<!DOCTYPE html>
<html>
<meta charset="utf-8">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="mystyle.css">
        <title>Mathematix - Panel admina</title>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
        <style>
            .admin-box {
                font-family: 'Courier New', Courier, monospace;
                padding: 20px 30px;
                max-width: 1000px;
                margin: 0 auto;
            }
            .admin-box h2 {
                font-size: 26px;
                margin-bottom: 16px;
            }
            .filtry {
                display: flex;
                gap: 12px;
                margin-bottom: 16px;
                flex-wrap: wrap;
            }
            .filtry input, .filtry select {
                padding: 8px 12px;
                font-family: 'Courier New', Courier, monospace;
                font-size: 16px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 16px;
                background: #f9f9f9;
            }
            th {
                background: #333;
                color: white;
                padding: 10px 12px;
                text-align: left;
                cursor: pointer;
                user-select: none;
            }
            th:hover { background: rgb(11, 105, 148); }
            td {
                padding: 9px 12px;
                border-bottom: 1px solid #ddd;
            }
            tr:hover td { background: #e8f4fd; }
            .licznik {
                font-size: 15px;
                color: #555;
                margin-bottom: 10px;
            }
            .btn-wyloguj {
                display: inline-block;
                margin-top: 20px;
                padding: 10px 28px;
                background: #333;
                color: white;
                border: none;
                border-radius: 6px;
                font-family: 'Courier New', Courier, monospace;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
            }
            .btn-wyloguj:hover { background: rgb(11, 105, 148); }
            #ladowanie { text-align:center; font-size:20px; padding:40px; font-family:monospace; }
            #blad { color:red; text-align:center; font-size:20px; padding:30px; font-family:monospace; }
        </style>
    </head>
    <body>
    <div class="obrazek2">
            <img src="niebo2.jpg" style="width:100%; height:100%;">
            <div class="centered3">Mathemati(x)</div>
        </div>
        <div>
        <ul id="navbar">
            <li><a href="index.html">Aktualności</a></li>
            <li><a href="matapki.html">MatApki</a></li>
            <li class="dropdown">
                <a href="javascript:void(0)" class="dropbtn">Filmy instruktażowe</a>
                <div class="dropdown-content">
                  <a href="klasa IV.html">Klasa IV</a>
                  <a href="klasa V.html">Klasa V</a>
                  <a href="Klasa VI.html">Klasa VI</a>
                  <a href="klasa VII.html">Klasa VII</a>
                  <a href="klasa VIII.html">Klasa VIII</a>
                </div></li>
            <li><a href='https://eduvulcan.pl/logowanie' target='_blank'>Dziennik elektroniczny</a></li>
            <li><a href='profil.html'>Mój profil</a></li>
        </ul>
        </div>
        <div class="pusty">&nbsp</div>
        <div id="newsy">
            <div id="ladowanie">Sprawdzanie uprawnień...</div>
            <div id="blad" style="display:none;"></div>
            <div id="panelContent" style="display:none;">
                <div class="admin-box">
                    <h2>Panel admina</h2>
                    <div class="filtry">
                        <input type="text" id="szukaj" placeholder="Szukaj (login, imię, nazwisko)..." oninput="filtruj()">
                        <select id="filterKlasa" onchange="filtruj()">
                            <option value="">Wszystkie klasy</option>
                        </select>
                    </div>
                    <div class="licznik" id="licznik"></div>
                    <div style="overflow-x:auto;">
                        <table id="tabela">
                            <thead>
                                <tr>
                                    <th onclick="sortuj('login')">Login ↕</th>
                                    <th onclick="sortuj('imie')">Imię ↕</th>
                                    <th onclick="sortuj('nazwisko')">Nazwisko ↕</th>
                                    <th onclick="sortuj('klasa')">Klasa ↕</th>
                                    <th onclick="sortuj('plec')">Płeć ↕</th>
                                </tr>
                            </thead>
                            <tbody id="tbody"></tbody>
                        </table>
                    </div>
                    <button class="btn-wyloguj" onclick="wyloguj()">Wyloguj się</button>
                </div>
            </div>
        </div>
        <script src="supabase-config.js"></script>
        <script>
            let wszyscyUczniowie = [];
            let sortKolumna = 'klasa';
            let sortDir = 1;

            async function init() {
                const { data: { session } } = await sb.auth.getSession();
                if (!session) { window.location.href = 'login.html'; return; }

                const { data: adminRow } = await sb.from('admins').select('id').eq('id', session.user.id).single();
                if (!adminRow) {
                    document.getElementById('ladowanie').style.display = 'none';
                    document.getElementById('blad').style.display = 'block';
                    document.getElementById('blad').textContent = 'Brak uprawnień admina.';
                    return;
                }

                const { data: uczniowie, error } = await sb.from('profiles').select('*').order('klasa');
                document.getElementById('ladowanie').style.display = 'none';

                if (error) {
                    document.getElementById('blad').style.display = 'block';
                    document.getElementById('blad').textContent = 'Błąd pobierania danych: ' + error.message;
                    return;
                }

                wszyscyUczniowie = uczniowie || [];

                const klasy = [...new Set(wszyscyUczniowie.map(u => u.klasa).filter(Boolean))].sort();
                const sel = document.getElementById('filterKlasa');
                klasy.forEach(k => {
                    const opt = document.createElement('option');
                    opt.value = k; opt.textContent = k;
                    sel.appendChild(opt);
                });

                renderuj(wszyscyUczniowie);
                document.getElementById('panelContent').style.display = 'block';
            }

            function filtruj() {
                const fraza = document.getElementById('szukaj').value.toLowerCase();
                const klasa = document.getElementById('filterKlasa').value;
                const wynik = wszyscyUczniowie.filter(u => {
                    const pasuje = !fraza ||
                        (u.login || '').toLowerCase().includes(fraza) ||
                        (u.imie || '').toLowerCase().includes(fraza) ||
                        (u.nazwisko || '').toLowerCase().includes(fraza);
                    const klasaPasuje = !klasa || u.klasa === klasa;
                    return pasuje && klasaPasuje;
                });
                renderuj(wynik);
            }

            function sortuj(kolumna) {
                if (sortKolumna === kolumna) sortDir *= -1;
                else { sortKolumna = kolumna; sortDir = 1; }
                filtruj();
            }

            function renderuj(lista) {
                const posortowana = [...lista].sort((a, b) => {
                    const va = (a[sortKolumna] || '').toLowerCase();
                    const vb = (b[sortKolumna] || '').toLowerCase();
                    return va < vb ? -sortDir : va > vb ? sortDir : 0;
                });

                document.getElementById('licznik').textContent =
                    'Wyświetlani uczniowie: ' + posortowana.length + ' / ' + wszyscyUczniowie.length;

                const tbody = document.getElementById('tbody');
                tbody.innerHTML = posortowana.map(u => `
                    <tr>
                        <td>${u.login || '—'}</td>
                        <td>${u.imie || '—'}</td>
                        <td>${u.nazwisko || '—'}</td>
                        <td>${u.klasa || '—'}</td>
                        <td>${u.plec === 'K' ? 'Kobieta' : u.plec === 'M' ? 'Mężczyzna' : '—'}</td>
                    </tr>`).join('');
            }

            async function wyloguj() {
                await sb.auth.signOut();
                window.location.href = 'login.html';
            }

            init();
        </script>
    </body>
</html>
