<svg viewBox="0 0 397 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
  </defs>
  <rect width="397" height="280" fill="url(#bg)"/>
  <text x="200" y="210" font-size="240" fill="rgba(255,255,255,0.07)"
        text-anchor="middle" font-family="Georgia, serif" font-weight="bold">÷</text>
  <line x1="198" y1="20" x2="198" y2="250" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-dasharray="6,4"/>
  <g font-family="'Courier New', monospace" font-weight="bold" fill="white" text-anchor="middle">
    <text x="100" y="55"  font-size="20" fill="rgba(255,255,255,0.7)">dzielenie</text>
    <text x="100" y="95"  font-size="24">6 ÷ 3 = 2</text>
    <text x="100" y="135" font-size="24">42 ÷ 7 = 6</text>
    <text x="100" y="175" font-size="24">32 ÷ 8 = 4</text>
    <text x="100" y="215" font-size="24">45 ÷ 5 = 9</text>
    <text x="100" y="255" font-size="24">49 ÷ 7 = 7</text>
  </g>
  <g font-family="'Courier New', monospace" font-weight="bold" fill="white" text-anchor="middle">
    <text x="298" y="55"  font-size="20" fill="rgba(255,255,255,0.7)">dzielenie</text>
    <text x="298" y="95"  font-size="24">20 ÷ 5 = 4</text>
    <text x="298" y="135" font-size="24">72 ÷ 9 = 8</text>
    <text x="298" y="175" font-size="24">21 ÷ 7 = 3</text>
    <text x="298" y="215" font-size="24">36 ÷ 6 = 6</text>
    <text x="298" y="255" font-size="24">40 ÷ 8 = 5</text>
  </g>
</svg>
