<svg viewBox="0 0 397 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
  </defs>
  <rect width="397" height="280" fill="url(#bg)"/>
  <!-- watermark ÷ -->
  <text x="200" y="210" font-size="240" fill="rgba(255,255,255,0.08)"
        text-anchor="middle" font-family="Georgia, serif" font-weight="bold">÷</text>
  <!-- division examples (inverse of multiplication) -->
  <g font-family="'Courier New', monospace" font-weight="bold" fill="white">
    <text x="50"  y="70"  font-size="28">6  ÷ 3 = 2</text>
    <text x="210" y="70"  font-size="28">20 ÷ 5 = 4</text>
    <text x="50"  y="120" font-size="28">42 ÷ 7 = 6</text>
    <text x="210" y="120" font-size="28">72 ÷ 9 = 8</text>
    <text x="50"  y="170" font-size="28">24 ÷ 8 = 3</text>
    <text x="210" y="170" font-size="28">42 ÷ 6 = 7</text>
    <text x="50"  y="220" font-size="28">81 ÷ 9 = 9</text>
    <text x="210" y="220" font-size="28">35 ÷ 7 = 5</text>
  </g>
</svg>
