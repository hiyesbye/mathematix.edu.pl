<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dodawanie i Odejmowanie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #f0f2ff;
    --card:       #ffffff;
    --text:       #2a2d4a;
    --primary:    #5b7fff;
    --good:       #1a7a3a;
    --bad:        #b00020;
    --score-bg:   #eef6ff; --score-text: #1a4a8a; --score-bdr: #b8d4f5;
    --timer-bg:   #f5f0ff; --timer-text: #5a1a8a; --timer-bdr: #d4b8f5;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg);
    font-family: "Segoe UI", Verdana, Arial, sans-serif; color: var(--text);
  }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 12px;
  }
  .card {
    background: var(--card); width: 100%; max-width: 420px;
    border-radius: 24px; padding: 22px 20px 26px;
    box-shadow: 0 8px 36px rgba(60,80,200,.13), 0 2px 8px rgba(60,80,200,.08);
    position: relative; overflow: hidden;
  }
  .app-title {
    font-family: 'Nunito', "Segoe UI", sans-serif;
    font-size: 1.55rem;
    font-weight: 900;
    letter-spacing: -0.2px;
    text-align: center;
    margin: 0 0 16px;
    padding: 13px 20px;
    background: linear-gradient(135deg, #7dddb0, #7ab4f2);
    border: 2px solid #9ccad8;
    border-radius: 16px;
    color: #fff;
  }
  .title-text {
    color: #1a3a6a;
  }

  /* ── Control rows ─────────────────────────────── */
  .mode-row {
    display: flex; align-items: center; gap: 5px;
    background: #eef0fb; border-radius: 15px;
    padding: 5px 6px; margin-bottom: 8px;
  }
  .mode-title {
    background: #c6ceed; color: #3d4470;
    font-size: .73rem; font-weight: 700;
    border-radius: 9px; padding: 6px 9px;
    white-space: nowrap; flex-shrink: 0;
  }
  .tab {
    flex: 1; border: none; background: transparent; border-radius: 11px;
    padding: 9px 4px; font-size: .85rem; font-weight: 700; color: #6672a8;
    cursor: pointer; transition: background .18s, color .18s, box-shadow .18s;
  }
  .tab:not([class*="active"]):hover { background: #dfe2f5; color: var(--text); }

  /* Module tabs */
  .tab.active-add { background: linear-gradient(135deg,#1b8a3d,#2ec26e); color:#fff; box-shadow:0 3px 10px rgba(27,138,61,.35); }
  .tab.active-sub { background: linear-gradient(135deg,#d64040,#f07070); color:#fff; box-shadow:0 3px 10px rgba(214,64,64,.35); }

  /* Mode tabs */
  .tab.active-n { background: linear-gradient(135deg,#5b7fff,#3a54e8); color:#fff; box-shadow:0 3px 10px rgba(74,108,247,.35); }
  .tab.active-t { background: linear-gradient(135deg,#e8604a,#f5a623); color:#fff; box-shadow:0 3px 10px rgba(232,96,74,.35); }

  /* Difficulty tabs */
  .tab.active-d1 { background: linear-gradient(135deg,#0099cc,#00ccff); color:#fff; box-shadow:0 3px 10px rgba(0,153,204,.35); }
  .tab.active-d2 { background: linear-gradient(135deg,#7b2ff7,#b966ff); color:#fff; box-shadow:0 3px 10px rgba(123,47,247,.35); }

  /* ── Stats ────────────────────────────────────── */
  .stats { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat-box { flex: 1; border-radius: 14px; padding: 10px 6px; font-weight: 700; text-align: center; }
  .stat-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .8px; opacity: .7; margin-bottom: 2px; }
  .stat-value { font-size: 1.35rem; }
  .score-box { background: var(--score-bg); color: var(--score-text); border: 2px solid var(--score-bdr); }
  .timer-box {
    background: var(--timer-bg); color: var(--timer-text); border: 2px solid var(--timer-bdr);
    transition: background .3s, color .3s, border-color .3s;
  }
  .timer-box.warn   { background: #ffe0cc; color: #c04000; border-color: #ffb480; }
  .timer-box.danger {
    background: #ffd6d6; color: #c00000; border-color: #ff9090;
    animation: pulse .5s ease-in-out infinite alternate;
  }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.04); } }

  /* ── Question box ─────────────────────────────── */
  .question-box {
    background: linear-gradient(145deg,#0a7e74,#12b0a0); color: #fff;
    border-radius: 18px; padding: 18px 12px 16px; text-align: center; margin-bottom: 16px;
  }
  .question {
    font-family: "Bahnschrift","DIN Alternate","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
    font-size: clamp(2rem, 11vw, 5rem); font-weight: 700;
    letter-spacing: clamp(1px, 0.4vw, 5px); line-height: 1; white-space: nowrap;
  }

  /* ── Input & buttons ──────────────────────────── */
  input[type="number"] {
    width: 100%; font-size: 1.6rem; text-align: center; padding: 12px 8px;
    border: 2.5px solid #d0d6f5; border-radius: 14px; margin-bottom: 10px;
    font-family: inherit; outline: none; transition: border-color .2s;
    -moz-appearance: textfield;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"]:focus { border-color: var(--primary); }

  button[type="submit"] {
    width: 100%; font-size: 1.1rem; font-weight: 700; padding: 13px 20px;
    border: none; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg,#5b7fff,#3a54e8); color: white;
    box-shadow: 0 4px 16px rgba(74,108,247,.3); transition: filter .2s;
    margin-bottom: 6px;
  }
  button[type="submit"]:hover { filter: brightness(1.08); }

  button.secondary {
    flex: 1; font-size: .93rem; font-weight: 600; padding: 10px 12px;
    border-radius: 12px; cursor: pointer;
    background: transparent; border: 2px solid #d0d6f5;
    color: #6672a8; box-shadow: none;
  }
  button.secondary:hover { background: #f2f4fd; }
  button[type="submit"]:disabled { opacity: 0.38; cursor: not-allowed; filter: none; box-shadow: none; }
  button.secondary:disabled      { opacity: 0.32; cursor: not-allowed; }

  .btn-row { display: flex; gap: 8px; }

  /* ── Feedback ─────────────────────────────────── */
  .feedback {
    min-height: 60px; font-size: 1.1rem; font-weight: 700;
    border-radius: 14px; padding: 12px 14px; text-align: center;
    margin-bottom: 10px; transition: all .2s;
  }
  .feedback.empty  { background: transparent; border: 2px dashed #dde2f5; color: transparent; }
  .feedback.good { background: #d6f5e6; color: var(--good); border: 2px solid #a8e8c8; }
  .feedback.bad  { background: #fde8e8; color: var(--bad);  border: 2px solid #f4b8b8; }

  /* ── Timed diff-selection screen ──────────────── */
  .diff-screen { padding: 6px 0 4px; }
  .diff-heading { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; opacity: .85; text-align: center; }
  .diff-buttons { display: flex; flex-direction: column; gap: 10px; }
  .diff-btn {
    display: flex; align-items: center; gap: 14px;
    border: none; border-radius: 16px; padding: 14px 18px;
    cursor: pointer; color: white; font-weight: 700;
    transition: transform .15s, box-shadow .15s;
  }
  .diff-btn:hover { transform: translateY(-2px); }
  .diff-icon { font-size: 1.9rem; line-height: 1; }
  .diff-info { display: flex; flex-direction: column; text-align: left; }
  .diff-name { font-size: 1.05rem; }
  .diff-desc { font-size: .78rem; opacity: .88; font-weight: 600; }
  .diff-easy   { background: linear-gradient(135deg,#1e9e5a,#38d68a); box-shadow: 0 4px 14px rgba(30,158,90,.3); }
  .diff-medium { background: linear-gradient(135deg,#c07800,#f5c030); box-shadow: 0 4px 14px rgba(192,120,0,.3); }
  .diff-hard   { background: linear-gradient(135deg,#d64040,#f07070); box-shadow: 0 4px 14px rgba(214,64,64,.3); }

  /* ── Animation layer ──────────────────────────── */
  #animLayer {
    position: absolute; inset: 0; pointer-events: none; z-index: 100;
    border-radius: 24px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .anim-correct-num {
    font-family: "Bahnschrift","DIN Alternate","Arial Rounded MT Bold",sans-serif;
    font-size: 9rem; font-weight: 900; color: #fff; line-height: 1; letter-spacing: 2px;
    text-shadow: 0 0 10px #7fffb0,0 0 25px #50ff80,0 0 55px #20e860,0 0 100px #00c840;
    animation: correctPop 1.3s cubic-bezier(.22,1,.36,1) forwards;
    position: relative; z-index: 2;
  }
  @keyframes correctPop {
    0%   { opacity:0; transform:scale(.2) rotate(-8deg); }
    28%  { opacity:1; transform:scale(1.18) rotate(2deg); }
    50%  { transform:scale(.94) rotate(-1deg); }
    68%  { opacity:1; transform:scale(1.04) rotate(.5deg); }
    85%  { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(1.4); }
  }
  .particle {
    position: absolute; z-index: 3; font-size: 1.8rem; font-weight: 900; color: #fff;
    pointer-events: none; animation: particleFly 1s ease-out forwards;
    text-shadow: 0 0 8px rgba(80,255,140,.9),0 0 18px rgba(80,255,140,.5);
  }
  @keyframes particleFly {
    0%   { opacity:1; transform:translate(0,0) scale(1.1); }
    100% { opacity:0; transform:var(--tx) scale(.2); }
  }
  .correct-flash {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center,rgba(40,220,100,.45) 0%,rgba(40,220,100,0) 70%);
    animation: flashFade 1.3s ease-out forwards;
  }
  @keyframes flashFade { 0%{opacity:0;} 15%{opacity:1;} 100%{opacity:0;} }
  .anim-big-x {
    font-size: 9rem; font-weight: 900; color: #ff1a1a; line-height: 1;
    position: absolute; z-index: 3;
    animation: wrongGlow 1.2s ease-out forwards;
  }
  @keyframes wrongGlow {
    0%   { opacity:0; transform:scale(.4); text-shadow:0 0 8px #f00,0 0 16px #f00; }
    18%  { opacity:1; transform:scale(1.12); text-shadow:0 0 8px #f00,0 0 20px #f00,0 0 40px #f22,0 0 80px #f44; }
    65%  { opacity:1; transform:scale(1.06); text-shadow:0 0 12px #f00,0 0 28px #f00,0 0 55px #f22; }
    100% { opacity:0; transform:scale(1.25); }
  }
  .wrong-flash {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center,rgba(220,0,0,.4) 0%,rgba(220,0,0,0) 70%);
    animation: flashFade 1.2s ease-out forwards;
  }
</style>
</head>
<body>
<div class="card">
  <div id="animLayer"></div>
  <div class="app-title"><span class="title-text">Dodawanie i odejmowanie</span></div>

  <!-- Module row -->
  <div class="mode-row">
    <span class="mode-title">Moduł:</span>
    <button class="tab active-add" id="modAddBtn" onclick="switchModule('add')">➕ Dodawanie</button>
    <button class="tab"           id="modSubBtn" onclick="switchModule('sub')">➖ Odejmowanie</button>
  </div>

  <!-- Mode row -->
  <div class="mode-row">
    <span class="mode-title">Tryb:</span>
    <button class="tab active-n" id="modeNBtn" onclick="switchTab('normal')">Normalny</button>
    <button class="tab"          id="modeTBtn" onclick="switchTab('timed')">⏱ Czasowy</button>
  </div>

  <!-- Difficulty row -->
  <div class="mode-row">
    <span class="mode-title">Trudność:</span>
    <button class="tab active-d1" id="diff1Btn" onclick="switchDifficulty('lvl1')">Lvl 1</button>
    <button class="tab"           id="diff2Btn" onclick="switchDifficulty('lvl2')">Lvl 2</button>
  </div>

  <!-- ══ PANEL: normalny ══════════════════════════ -->
  <div id="panelNormal">
    <div class="stats">
      <div class="stat-box score-box">
        <div class="stat-label">Wynik</div>
        <div class="stat-value" id="nScore">0 / 0</div>
      </div>
      <div class="stat-box timer-box">
        <div class="stat-label">Czas</div>
        <div class="stat-value" id="nTimer">0 s</div>
      </div>
    </div>
    <div class="question-box">
      <div class="question" id="nQuestion">?</div>
    </div>
    <form id="nForm" autocomplete="off">
      <input type="number" id="nInput" inputmode="numeric" placeholder="Twoja odpowiedź" required>
      <button type="submit" id="nSubmitBtn" disabled>Sprawdź</button>
    </form>
    <div class="feedback empty" id="nFeedback"></div>
    <button type="button" id="nReset" class="secondary" disabled>Resetuj wynik</button>
  </div>

  <!-- ══ PANEL: wybór trudności (dla trybu czasowego) ═══ -->
  <div id="panelDiff" style="display:none">
    <div class="diff-screen">
      <div class="diff-heading">Wybierz poziom czasu</div>
      <div class="diff-buttons">
        <button class="diff-btn diff-easy" onclick="selectTimedDiff(15)">
          <span class="diff-icon">🟢</span>
          <span class="diff-info">
            <span class="diff-name">Easy</span>
            <span class="diff-desc">15 sekund na odpowiedź</span>
          </span>
        </button>
        <button class="diff-btn diff-medium" onclick="selectTimedDiff(10)">
          <span class="diff-icon">🟡</span>
          <span class="diff-info">
            <span class="diff-name">Medium</span>
            <span class="diff-desc">10 sekund na odpowiedź</span>
          </span>
        </button>
        <button class="diff-btn diff-hard" onclick="selectTimedDiff(5)">
          <span class="diff-icon">🔴</span>
          <span class="diff-info">
            <span class="diff-name">Hard</span>
            <span class="diff-desc">5 sekund na odpowiedź</span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- ══ PANEL: czasowy ════════════════════════════ -->
  <div id="panelTimed" style="display:none">
    <div class="stats">
      <div class="stat-box score-box">
        <div class="stat-label">Wynik</div>
        <div class="stat-value" id="tScore">0 / 0</div>
      </div>
      <div class="stat-box timer-box" id="tTimerBox">
        <div class="stat-label">Pozostały czas</div>
        <div class="stat-value" id="tTimer">— s</div>
      </div>
    </div>
    <div class="question-box">
      <div class="question" id="tQuestion">?</div>
    </div>
    <form id="tForm" autocomplete="off">
      <input type="number" id="tInput" inputmode="numeric" placeholder="Twoja odpowiedź" required>
      <button type="submit" id="tSubmitBtn" disabled>Sprawdź</button>
    </form>
    <div class="feedback empty" id="tFeedback"></div>
    <div class="btn-row">
      <button type="button" id="tReset" class="secondary" disabled>Resetuj wynik</button>
      <button type="button" id="btnChangeDiff" class="secondary">Zmień poziom</button>
    </div>
  </div>
</div>

<script>
  const animLayer = document.getElementById('animLayer');

  // DOM refs
  const modAddBtn   = document.getElementById('modAddBtn');
  const modSubBtn   = document.getElementById('modSubBtn');
  const modeNBtn    = document.getElementById('modeNBtn');
  const modeTBtn    = document.getElementById('modeTBtn');
  const diff1Btn    = document.getElementById('diff1Btn');
  const diff2Btn    = document.getElementById('diff2Btn');
  const panelNormal = document.getElementById('panelNormal');
  const panelDiff   = document.getElementById('panelDiff');
  const panelTimed  = document.getElementById('panelTimed');
  const nScoreEl    = document.getElementById('nScore');
  const nTimerEl    = document.getElementById('nTimer');
  const nQuestionEl = document.getElementById('nQuestion');
  const nInput      = document.getElementById('nInput');
  const nFeedback   = document.getElementById('nFeedback');
  const tScoreEl    = document.getElementById('tScore');
  const tTimerEl    = document.getElementById('tTimer');
  const tTimerBox   = document.getElementById('tTimerBox');
  const tQuestionEl = document.getElementById('tQuestion');
  const tInput      = document.getElementById('tInput');
  const tFeedback   = document.getElementById('tFeedback');

  // State
  let currentModule = 'add';
  let currentTab    = 'normal';
  let currentDiff   = 'lvl1';

  let a, b, correctAnswer;
  let mode = 'ask';
  let autoAdvanceTimeout = null;
  let recentQ = [];

  let nCorrect = 0, nTotal = 0;
  let normalInterval = null, normalStart = 0;

  let tCorrect = 0, tTotal = 0;
  let timedDiff = null;
  let countdownInterval = null, countdownLeft = 0;

  // ── Question generation ────────────────────────
  function generateNumbers() {
    let attempts = 0;
    do {
      _generateOnce();
      attempts++;
    } while (recentQ.includes(getQuestionText()) && attempts < 50);
    const q = getQuestionText();
    recentQ.push(q);
    if (recentQ.length > 10) recentQ.shift();
  }

  function _generateOnce() {
    const r = Math.random();

    if (currentModule === 'add') {
      if (currentDiff === 'lvl1') {
        // 95%: oba 0–9, suma >= 11 (przekroczenie progu dziesiątkowego)
        //  5%: oba 0–9, suma <  10  (bez przekroczenia)
        if (r < 0.95) {
          do {
            a = Math.floor(Math.random() * 10);
            b = Math.floor(Math.random() * 10);
          } while (a + b < 11);
        } else {
          do {
            a = Math.floor(Math.random() * 10);
            b = Math.floor(Math.random() * 10);
          } while (a + b >= 10);
        }
      } else {
        // lvl2: oba 10–99
        // 85%: jedności a + jedności b >= 10  (przekroczenie)
        // 15%: jedności a + jedności b <  10  (bez przekroczenia)
        if (r < 0.85) {
          do {
            a = 10 + Math.floor(Math.random() * 90);
            b = 10 + Math.floor(Math.random() * 90);
          } while ((a % 10 + b % 10) < 10);
        } else {
          do {
            a = 10 + Math.floor(Math.random() * 90);
            b = 10 + Math.floor(Math.random() * 90);
          } while ((a % 10 + b % 10) >= 10);
        }
      }
      correctAnswer = a + b;

    } else {
      // odejmowanie
      if (currentDiff === 'lvl1') {
        // 95%: a z 10–18, b z 1–9, jedność a < b  (pożyczka z dziesiątek)
        //  5%: brak pożyczki – jednocyfrowe lub nastki bez pożyczki (50/50)
        if (r < 0.95) {
          do {
            a = 10 + Math.floor(Math.random() * 9);  // 10–18
            b =  1 + Math.floor(Math.random() * 9);  //  1–9
          } while (a % 10 >= b);
        } else {
          if (Math.random() < 0.5) {
            // jednocyfrowe: a z 1–9, b z 0 do a
            a = 1 + Math.floor(Math.random() * 9);
            b = Math.floor(Math.random() * (a + 1));
          } else {
            // nastki bez pożyczki: a z 11–19, b z 1–9, jedność a >= b
            do {
              a = 11 + Math.floor(Math.random() * 9);  // 11–19
              b =  1 + Math.floor(Math.random() * 9);  //  1–9
            } while (a % 10 < b);
          }
        }
      } else {
        // lvl2: oba 10–99, wynik >= 0
        // 85%: jedność a < jedność b  (pożyczka)
        // 15%: jedność a >= jedność b (bez pożyczki)
        if (r < 0.85) {
          do {
            a = 10 + Math.floor(Math.random() * 90);
            b = 10 + Math.floor(Math.random() * 90);
          } while (a < b || a % 10 >= b % 10);
        } else {
          do {
            a = 10 + Math.floor(Math.random() * 90);
            b = 10 + Math.floor(Math.random() * 90);
          } while (a < b || a % 10 < b % 10);
        }
      }
      correctAnswer = a - b;
    }
  }

  function getOpSymbol() { return currentModule === 'add' ? '+' : '−'; }
  function getQuestionText() { return `${a} ${getOpSymbol()} ${b}`; }

  // ── Module switching ───────────────────────────
  function switchModule(mod) {
    if (currentModule === mod) return;
    currentModule = mod;
    modAddBtn.className = 'tab' + (mod === 'add' ? ' active-add' : '');
    modSubBtn.className = 'tab' + (mod === 'sub' ? ' active-sub' : '');
    fullReset();
  }

  // ── Tab (mode) switching ───────────────────────
  function switchTab(tab) {
    if (currentTab === tab) return;
    currentTab = tab;
    modeNBtn.className = 'tab' + (tab === 'normal' ? ' active-n' : '');
    modeTBtn.className = 'tab' + (tab === 'timed'  ? ' active-t' : '');

    stopNormalTimer();
    stopCountdown();
    clearTimeout(autoAdvanceTimeout);
    mode = 'ask';

    if (tab === 'normal') {
      panelNormal.style.display = '';
      panelDiff.style.display   = 'none';
      panelTimed.style.display  = 'none';
      newQuestion();
    } else {
      panelNormal.style.display = 'none';
      panelTimed.style.display  = 'none';
      panelDiff.style.display   = '';
    }
  }

  // ── Difficulty (Lvl) switching ─────────────────
  function switchDifficulty(diff) {
    if (currentDiff === diff) return;
    currentDiff = diff;
    diff1Btn.className = 'tab' + (diff === 'lvl1' ? ' active-d1' : '');
    diff2Btn.className = 'tab' + (diff === 'lvl2' ? ' active-d2' : '');
    fullReset();
  }

  // ── Full reset ─────────────────────────────────
  function fullReset() {
    stopNormalTimer();
    stopCountdown();
    clearTimeout(autoAdvanceTimeout);
    mode = 'ask';
    timedDiff = null;
    recentQ = [];

    nCorrect = 0; nTotal = 0;
    nScoreEl.textContent = '0 / 0';
    nTimerEl.textContent = '0 s';
    nInput.value = '';
    nFeedback.className = 'feedback empty';
    nFeedback.textContent = '';

    tCorrect = 0; tTotal = 0;
    tScoreEl.textContent = '0 / 0';
    tTimerEl.textContent = '— s';
    tTimerBox.className = 'stat-box timer-box';
    tInput.value = '';
    tFeedback.className = 'feedback empty';
    tFeedback.textContent = '';

    if (currentTab === 'normal') {
      panelNormal.style.display = '';
      panelDiff.style.display   = 'none';
      panelTimed.style.display  = 'none';
      newQuestion();
    } else {
      panelNormal.style.display = 'none';
      panelTimed.style.display  = 'none';
      panelDiff.style.display   = '';
    }
  }

  // ── Timed diff selection ───────────────────────
  function selectTimedDiff(secs) {
    timedDiff = secs;
    tCorrect = 0; tTotal = 0;
    tScoreEl.textContent = '0 / 0';
    panelDiff.style.display  = 'none';
    panelTimed.style.display = '';
    mode = 'ask';
    newQuestion();
  }

  // ── New question ───────────────────────────────
  function newQuestion(skipFocus = false) {
    clearTimeout(autoAdvanceTimeout);
    mode = 'ask';
    generateNumbers();

    if (currentTab === 'normal') {
      nQuestionEl.textContent = getQuestionText();
      nInput.value = '';
      nFeedback.className = 'feedback empty';
      nFeedback.textContent = '';
      document.getElementById('nSubmitBtn').textContent = 'Sprawdź';
      document.getElementById('nSubmitBtn').disabled = true;
      if (!skipFocus) nInput.focus();
      if (!normalInterval) startNormalTimer();
    } else {
      tQuestionEl.textContent = getQuestionText();
      tInput.value = '';
      tFeedback.className = 'feedback empty';
      tFeedback.textContent = '';
      document.getElementById('tSubmitBtn').textContent = 'Sprawdź';
      document.getElementById('tSubmitBtn').disabled = true;
      if (!skipFocus) tInput.focus();
      startCountdown();
    }
  }

  // ── Normal timer ───────────────────────────────
  function startNormalTimer() {
    stopNormalTimer();
    normalStart = Date.now();
    nTimerEl.textContent = '0 s';
    normalInterval = setInterval(() => {
      nTimerEl.textContent = `${Math.floor((Date.now() - normalStart) / 1000)} s`;
    }, 1000);
  }
  function stopNormalTimer() { clearInterval(normalInterval); normalInterval = null; }

  // ── Countdown timer ────────────────────────────
  function refreshCountdown() {
    const ratio = countdownLeft / timedDiff;
    tTimerEl.textContent = `${countdownLeft} s`;
    tTimerBox.className = 'stat-box timer-box' +
      (ratio <= 0.2 ? ' danger' : ratio <= 0.4 ? ' warn' : '');
  }
  function startCountdown() {
    stopCountdown();
    countdownLeft = timedDiff;
    refreshCountdown();
    countdownInterval = setInterval(() => {
      countdownLeft--;
      if (countdownLeft <= 0) { stopCountdown(); timeUp(); }
      else refreshCountdown();
    }, 1000);
  }
  function stopCountdown() { clearInterval(countdownInterval); countdownInterval = null; }

  function timeUp() {
    if (mode !== 'ask') return;
    mode = 'next';
    tTotal++;
    tScoreEl.textContent = `${tCorrect} / ${tTotal}`;
    tFeedback.className = 'feedback bad';
    tFeedback.textContent = `⏰ Czas minął!  ${a} ${getOpSymbol()} ${b} = ${correctAnswer}`;
    playWrongAnim();
    updateResetBtns();
    tInput.value = '';
  }

  // ── Check answer ───────────────────────────────
  function checkAnswer(panel) {
    if (mode !== 'ask') return;
    mode = 'next';

    const isNormal = panel === 'normal';
    const input     = isNormal ? nInput     : tInput;
    const scoreEl   = isNormal ? nScoreEl   : tScoreEl;
    const feedbackEl= isNormal ? nFeedback  : tFeedback;
    const submitBtn = document.getElementById(isNormal ? 'nSubmitBtn' : 'tSubmitBtn');

    if (!isNormal) stopCountdown();

    const ans = Number(input.value);
    const op  = getOpSymbol();

    if (isNormal) { nTotal++; } else { tTotal++; }

    if (ans === correctAnswer) {
      if (isNormal) nCorrect++; else tCorrect++;
      feedbackEl.className = 'feedback good';
      feedbackEl.textContent = `✅ Brawo!  ${a} ${op} ${b} = ${correctAnswer}`;
      playCorrectAnim(correctAnswer);
    } else {
      feedbackEl.className = 'feedback bad';
      feedbackEl.textContent = `❌ Źle!  ${a} ${op} ${b} = ${correctAnswer}`;
      playWrongAnim(isNormal ? submitBtn : null);
    }

    const c = isNormal ? nCorrect : tCorrect;
    const t = isNormal ? nTotal   : tTotal;
    scoreEl.textContent = `${c} / ${t}`;
    updateResetBtns();
  }

  // ── Animations ─────────────────────────────────
  function playCorrectAnim(answer) {
    animLayer.innerHTML = '';
    const flash = document.createElement('div');
    flash.className = 'correct-flash';
    animLayer.appendChild(flash);
    const num = document.createElement('div');
    num.className = 'anim-correct-num';
    num.textContent = answer;
    animLayer.appendChild(num);
    const symbols = ['+','−','★','✦','✧','◆','✓'];
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = symbols[i % symbols.length];
      const angle = (360 / 14) * i;
      const dist  = 110 + Math.random() * 80;
      const rad   = angle * Math.PI / 180;
      p.style.setProperty('--tx', `translate(${Math.cos(rad)*dist}px,${Math.sin(rad)*dist}px)`);
      p.style.animationDelay = `${Math.random() * 0.12}s`;
      p.style.fontSize = `${1.2 + Math.random() * 1.2}rem`;
      animLayer.appendChild(p);
    }
    setTimeout(() => { animLayer.innerHTML = ''; }, 1400);
    autoAdvanceTimeout = setTimeout(() => newQuestion(false), 1900);
  }

  function playWrongAnim(submitBtn = null) {
    animLayer.innerHTML = '';
    const flash = document.createElement('div');
    flash.className = 'wrong-flash';
    animLayer.appendChild(flash);
    const x = document.createElement('div');
    x.className = 'anim-big-x';
    x.textContent = '✗';
    animLayer.appendChild(x);
    if (submitBtn) {
      setTimeout(() => {
        animLayer.innerHTML = '';
        submitBtn.textContent = 'Dalej →';
        submitBtn.disabled = false;
      }, 1300);
    } else {
      setTimeout(() => { animLayer.innerHTML = ''; }, 1300);
      autoAdvanceTimeout = setTimeout(() => newQuestion(false), 1900);
    }
  }

  // ── Form submit handlers ───────────────────────
  document.getElementById('nForm').addEventListener('submit', e => {
    e.preventDefault();
    if (mode === 'ask' && nInput.value !== '') checkAnswer('normal');
    else if (mode === 'next') newQuestion();
  });

  document.getElementById('tForm').addEventListener('submit', e => {
    e.preventDefault();
    if (mode === 'ask' && tInput.value !== '') checkAnswer('timed');
    else if (mode === 'next') newQuestion();
  });

  // ── Reset buttons ──────────────────────────────
  document.getElementById('nReset').addEventListener('click', () => {
    nCorrect = 0; nTotal = 0;
    nScoreEl.textContent = '0 / 0';
    stopNormalTimer();
    startNormalTimer();
    nInput.value = '';
    nFeedback.className = 'feedback empty';
    nFeedback.textContent = '';
    clearTimeout(autoAdvanceTimeout);
    newQuestion(true);
    updateResetBtns();
  });

  document.getElementById('tReset').addEventListener('click', () => {
    tCorrect = 0; tTotal = 0;
    tScoreEl.textContent = '0 / 0';
    stopCountdown();
    clearTimeout(autoAdvanceTimeout);
    mode = 'ask';
    newQuestion(true);
    updateResetBtns();
  });

  document.getElementById('btnChangeDiff').addEventListener('click', () => {
    stopCountdown();
    clearTimeout(autoAdvanceTimeout);
    mode = 'ask';
    panelTimed.style.display = 'none';
    panelDiff.style.display  = '';
  });

  // ── Helpers ────────────────────────────────────
  function updateResetBtns() {
    document.getElementById('nReset').disabled = (nTotal === 0);
    document.getElementById('tReset').disabled = (tTotal === 0);
  }

  nInput.addEventListener('input', () => {
    if (mode === 'ask') document.getElementById('nSubmitBtn').disabled = (nInput.value === '');
  });
  tInput.addEventListener('input', () => {
    if (mode === 'ask') document.getElementById('tSubmitBtn').disabled = (tInput.value === '');
  });

  // ── Init ───────────────────────────────────────
  newQuestion(true);
  startNormalTimer();
</script>
</body>
</html>
