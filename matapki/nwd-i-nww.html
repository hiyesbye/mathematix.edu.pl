  function playCorrectAnim(label) {
    animLayer.innerHTML = '';
    const flash = document.createElement('div');
    flash.className = 'correct-flash';
    animLayer.appendChild(flash);
    const num = document.createElement('div');
    num.className = 'anim-correct-num';
    num.textContent = '✔';
    animLayer.appendChild(num);
    const symbols = ['✓', '★', '✦', '✧', '◆', '='];
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = symbols[i % symbols.length];
      const angle = (360 / 14) * i;
      const dist  = 110 + Math.random() * 80;
      const rad   = angle * Math.PI / 180;
      p.style.setProperty('--tx', `translate(${Math.cos(rad)*dist}px,${Math.sin(rad)*dist}px)`);
      p.style.animationDelay = `${Math.random() * 0.12}s`;
      p.style.fontSize = `${1.2 + Math.random() * 1.2}rem`;
      animLayer.appendChild(p);
    }
    setTimeout(() => { animLayer.innerHTML = ''; }, 1400);
  }

  function playWrongAnim(onDone) {
    animLayer.innerHTML = '';
    const flash = document.createElement('div');
    flash.className = 'wrong-flash';
    animLayer.appendChild(flash);
    const x = document.createElement('div');
    x.className = 'anim-wrong-x';
    x.textContent = '✕';
    animLayer.appendChild(x);
    setTimeout(() => {
      animLayer.innerHTML = '';
      if (onDone) onDone();
    }, 1300);
  }

  newGcdMemoryQuestion();
  // --- Factor decomposition (Rozklad) ---
  const panelFactor     = document.getElementById('panelFactor');
  const moduleBtnFactor = document.getElementById('moduleBtnFactor');
  const moduleBtnGcdLcm = document.getElementById('moduleBtnGcdLcm');
  const modeRowEl       = document.getElementById('modeRow');
  const forfeitBtn      = document.getElementById('forfeitBtn');
  const roScoreEl       = document.getElementById('roScore');
  const roTimerEl       = document.getElementById('roTimer');
  const roQuestionEl    = document.getElementById('roQuestion');
  const roTreeCont      = document.getElementById('roTree');
  const roAnswerEl      = document.getElementById('roAnswerArea');
  const roFeedback      = document.getElementById('roFeedback');
  const roReset         = document.getElementById('roReset');

  let roNumber, roFactors, roPhase;
  let roCorrect = 0, roTotal = 0;
  let roStart = 0;
  const roHistory = [];

  function generateFactorNumber() {
    const primes = [2, 3, 5, 7, 11, 13];
    const smallPrimes = [2, 3, 5, 7];
    for (let attempt = 0; attempt < 3000; attempt++) {
      let n = 1, ok = true;
      if (Math.random() < 0.70) {
        // Force at least one repeated prime (70% of cases)
        const p = smallPrimes[Math.floor(Math.random() * smallPrimes.length)];
        const reps = 2 + Math.floor(Math.random() * 2); // 2 or 3 times
        for (let i = 0; i < reps; i++) {
          n *= p; if (n > 1000) { ok = false; break; }
        }
        if (ok) {
          const extra = Math.floor(Math.random() * 3); // 0-2 extra factors
          for (let i = 0; i < extra; i++) {
            n *= primes[Math.floor(Math.random() * primes.length)];
            if (n > 1000) { ok = false; break; }
          }
        }
      } else {
        const count = 2 + Math.floor(Math.random() * 4);
        for (let i = 0; i < count; i++) {
          n *= primes[Math.floor(Math.random() * primes.length)];
          if (n > 1000) { ok = false; break; }
        }
      }
      if (ok && n >= 20 && n <= 1000 && !isPrime(n)) return n;
    }
    return 60;
  }

  function newFactorQuestion(skipFocus = false) {
    clearAll();
    roAnswerEl.innerHTML = ''; roAnswerEl.style.display = 'none';
    roFeedback.textContent = ''; roFeedback.className = 'feedback empty';
    roPhase = 'tree';
    let n, tries = 0;
    do { n = generateFactorNumber(); tries++; }
    while (tries < 50 && roHistory.includes(n));
    roNumber = n; roHistory.push(n);
    if (roHistory.length > 10) roHistory.shift();
    roQuestionEl.textContent = String(roNumber);
    roTreeCont.innerHTML = '';
    new FactorTree(roNumber, roTreeCont, (f) => { roFactors = f; roTreeDone(); });
    roStart = Date.now(); roTimerEl.textContent = '0 s';
    roInterval = setInterval(() => {
      roTimerEl.textContent = Math.floor((Date.now() - roStart) / 1000) + ' s';
    }, 1000);
    questionMode = 'ask';
  }

  function roTreeDone() {
    roPhase = 'factors';
    roAnswerEl.innerHTML = '';
    roAnswerEl.className = 'lt-answer-area';
    const lbl = document.createElement('div');
    lbl.className = 'lt-phase-label';
    lbl.textContent = 'Wpisz czynniki pierwsze z drzewka:';
    roAnswerEl.appendChild(lbl);
    const row = document.createElement('div');
    row.className = 'lt-answer-row';
    const prefix = document.createElement('span');
    prefix.className = 'lt-formula-prefix';
    prefix.textContent = roNumber + ' = ';
    row.appendChild(prefix);
    roFactors.forEach((f, i) => {
      if (i > 0) row.appendChild(document.createTextNode(' \u00d7 '));
      const inp = document.createElement('input');
      inp.type = 'number'; inp.className = 'lt-factor-input';
      inp.dataset.idx = i; inp.min = '2'; inp.inputMode = 'numeric';
      inp.addEventListener('input', roUpdateFactorBtn);
      row.appendChild(inp);
    });
    const btn = document.createElement('button');
    btn.type = 'button'; btn.id = 'roFactorBtn';
    btn.className = 'submit-btn'; btn.textContent = 'Sprawd\u017a'; btn.disabled = true;
    btn.addEventListener('click', roCheckFactors);
    row.appendChild(btn);
    roAnswerEl.appendChild(row);
    roAnswerEl.style.display = '';
  }

  function roUpdateFactorBtn() {
    const btn = document.getElementById('roFactorBtn');
    if (!btn) return;
    btn.disabled = !Array.from(roAnswerEl.querySelectorAll('.lt-factor-input'))
      .every(inp => inp.value.trim() !== '');
  }

  function roCheckFactors() {
    const inputs = Array.from(roAnswerEl.querySelectorAll('.lt-factor-input'));
    const entered = inputs.map(inp => Number(inp.value)).sort((a,b) => a-b);
    const expected = [...roFactors].sort((a,b) => a-b);
    const ok = entered.length === expected.length && entered.every((v,i) => v === expected[i]);
    if (!ok) {
      inputs.forEach(inp => {
        inp.classList.add('input-err');
        setTimeout(() => inp.classList.remove('input-err'), 400);
      });
      return;
    }
    const allDistinct = new Set(roFactors).size === roFactors.length;
    if (allDistinct) {
      clearInterval(roInterval);
      roCorrect++; roTotal++;
      roScoreEl.textContent = roCorrect + ' / ' + roTotal;
      const sorted = [...roFactors].sort((a,b) => a-b);
      roFeedback.textContent = '✅ Brawo! ' + roNumber + ' = ' + sorted.join(' × ');
      roFeedback.className = 'feedback good';
      playCorrectAnim();
      questionMode = 'next'; roReset.disabled = false;
      autoAdvanceTimeout = setTimeout(() => newFactorQuestion(), 2000);
      return;
    }
    roShowPowerPhase();
  }

  function roShowPowerPhase() {
    roPhase = 'powers';
    const sorted = [...roFactors].sort((a,b) => a-b);
    const powerMap = {};
    sorted.forEach(f => { powerMap[f] = (powerMap[f] || 0) + 1; });
    const primes = Object.keys(powerMap).map(Number).sort((a,b) => a-b);
    roAnswerEl.innerHTML = '';
    const resultRow = document.createElement('div');
    resultRow.className = 'lt-answer-row';
    const resultFmla = document.createElement('span');
    resultFmla.className = 'lt-formula-display';
    resultFmla.textContent = roNumber + ' = ' + sorted.join(' \u00d7 ');
    resultRow.appendChild(resultFmla);
    roAnswerEl.appendChild(resultRow);
    const lbl = document.createElement('div');
    lbl.className = 'lt-phase-label'; lbl.style.marginTop = '8px';
    lbl.textContent = 'Zapisz jako iloczyn pot\u0119g liczb pierwszych:';
    roAnswerEl.appendChild(lbl);
    const powerRow = document.createElement('div');
    powerRow.className = 'lt-answer-row';
    const powerPrefix = document.createElement('span');
    powerPrefix.className = 'lt-formula-prefix';
    powerPrefix.textContent = roNumber + ' = ';
    powerRow.appendChild(powerPrefix);
    primes.forEach((p, i) => {
      if (i > 0) {
        const mul = document.createElement('span');
        mul.className = 'lt-formula-prefix'; mul.textContent = ' \u00d7 ';
        powerRow.appendChild(mul);
      }
      const cell = document.createElement('span'); cell.className = 'ro-power-cell';
      const baseInp = document.createElement('input');
      baseInp.type = 'number'; baseInp.className = 'lt-factor-input ro-base-inp';
      baseInp.dataset.prime = p; baseInp.dataset.exp = powerMap[p];
      baseInp.min = '2'; baseInp.placeholder = '?'; baseInp.inputMode = 'numeric';
      baseInp.addEventListener('input', roUpdatePowerBtn);
      const caret = document.createElement('span');
      caret.className = 'ro-caret'; caret.textContent = '^';
      const expInp = document.createElement('input');
      expInp.type = 'number'; expInp.className = 'ro-exp-inp';
      expInp.dataset.prime = p; expInp.dataset.exp = powerMap[p];
      expInp.min = '1'; expInp.placeholder = '?'; expInp.inputMode = 'numeric';
      expInp.addEventListener('input', roUpdatePowerBtn);
      cell.appendChild(baseInp); cell.appendChild(caret); cell.appendChild(expInp);
      powerRow.appendChild(cell);
    });
    const btn = document.createElement('button');
    btn.type = 'button'; btn.id = 'roPowerBtn';
    btn.className = 'submit-btn'; btn.textContent = 'Sprawd\u017a'; btn.disabled = true;
    btn.addEventListener('click', roCheckPowers);
    powerRow.appendChild(btn);
    roAnswerEl.appendChild(powerRow);
  }

  function roUpdatePowerBtn() {
    const btn = document.getElementById('roPowerBtn');
    if (!btn) return;
    btn.disabled = !Array.from(roAnswerEl.querySelectorAll('.ro-base-inp'))
      .every(inp => inp.value.trim() !== '');
  }

  function roCheckPowers() {
    const cells = Array.from(roAnswerEl.querySelectorAll('.ro-power-cell'));
    // Per-cell: exp from sibling exp-input, or 1 if absent (primes with exp=1 have no exp field)
    const entered  = cells.map(cell => {
      const expInp = cell.querySelector('.ro-exp-inp');
      const exp = expInp && expInp.value.trim() !== '' ? Number(expInp.value) : 1;
      return { base: Number(cell.querySelector('.ro-base-inp').value), exp };
    }).sort((a, b) => a.base - b.base);
    const expected = cells.map(cell => {
      const b = cell.querySelector('.ro-base-inp');
      return { base: Number(b.dataset.prime), exp: Number(b.dataset.exp) };
    }).sort((a, b) => a.base - b.base);
    const ok = entered.every((e, i) => e.base === expected[i].base && e.exp === expected[i].exp);
    if (!ok) {
      cells.forEach(cell => {
        [cell.querySelector('.ro-base-inp'), cell.querySelector('.ro-exp-inp')].forEach(inp => {
          if (inp) { inp.classList.add('input-err'); setTimeout(() => inp.classList.remove('input-err'), 400); }
        });
      });
      roTotal++;
      roScoreEl.textContent = roCorrect + ' / ' + roTotal;
      playWrongAnim(() => { autoAdvanceTimeout = setTimeout(() => newFactorQuestion(), 1200); });
      return;
    }
    clearInterval(roInterval);
    roCorrect++; roTotal++;
    roScoreEl.textContent = roCorrect + ' / ' + roTotal;
    const parts = cells.map(cell => {
      const base = cell.querySelector('.ro-base-inp').value;
      const expInp = cell.querySelector('.ro-exp-inp');
      const exp = expInp && expInp.value.trim() !== '' ? expInp.value : '1';
      return exp === '1' ? base : base + '^' + exp;
    }).join(' \u00d7 ');
    roFeedback.textContent = '\u2705 Brawo! ' + roNumber + ' = ' + parts;
    roFeedback.className = 'feedback good';
    playCorrectAnim(String(roNumber));
    questionMode = 'next'; roReset.disabled = false;
    autoAdvanceTimeout = setTimeout(() => newFactorQuestion(), 2000);
  }

  roReset.addEventListener('click', () => {
    roCorrect = 0; roTotal = 0; roScoreEl.textContent = '0 / 0';
    roReset.disabled = true; document.activeElement.blur();
    newFactorQuestion(true);
  });

  // --- NWD+NWW combined ---
  function startLcmWithPair(a, b) {
    panelGcdTree.style.display = 'none';
    panelLcmTree.style.display = '';
    clearAll();
    ltForm.style.display = 'none';
    ltFactorsEl.style.display = 'none';
    ltAnswerEl.style.display = 'none'; ltAnswerEl.innerHTML = '';
    ltFeedback.textContent = ''; ltFeedback.className = 'feedback empty';
    ltSubmitBtn.textContent = 'Sprawd\u017a'; ltSubmitBtn.disabled = true;
    ltA = a; ltB = b;
    ltAns = (ltA * ltB) / gcd(ltA, ltB);
    ltQuestionEl.textContent = 'NWW(' + ltA + ', ' + ltB + ')';
    ltLabelA.textContent = String(ltA);
    ltLabelB.textContent = String(ltB);
    ltFactorsA = null; ltFactorsB = null;
    ltTreeA.innerHTML = ''; ltTreeB.innerHTML = '';
    new FactorTree(ltA, ltTreeA, (f) => { ltFactorsA = f; ltBothDone(); });
    new FactorTree(ltB, ltTreeB, (f) => { ltFactorsB = f; ltBothDone(); });
    ltStart = Date.now(); ltTimerEl.textContent = '0 s';
    ltInterval = setInterval(() => {
      ltTimerEl.textContent = Math.floor((Date.now() - ltStart) / 1000) + ' s';
    }, 1000);
    questionMode = 'ask';
  }

  function startGcdLcmQuestion() {
    glForfeitMode = false; forfeitBtn.textContent = 'Forfeit';
    glPhase = 'gcd-tree';
    const _gmRes = document.getElementById('gmNwdResult');
    if (_gmRes) _gmRes.style.display = 'none';
    const _ltNwdRes = document.getElementById('ltNwdResult');
    if (_ltNwdRes) _ltNwdRes.style.display = 'none';
    panelGcdMemory.style.display = 'none';
    panelLcmMemory.style.display = 'none';
    const ltStatsEl = document.getElementById('ltStats');
    const ltTreeLabelEl = document.getElementById('ltTreeLabel');
    const ltTreeBoxEl = document.getElementById('ltTreeBox');
    if (ltStatsEl) ltStatsEl.style.display = '';
    if (ltTreeLabelEl) ltTreeLabelEl.style.display = '';
    if (ltTreeBoxEl) ltTreeBoxEl.style.display = '';
    ltReset.style.display = '';
    panelLcmTree.style.display = 'none';
    panelGcdTree.style.display = '';
    const _r = document.getElementById('gtNwdResult');
    if (_r) _r.style.display = 'none';
    newGcdTreeQuestion();
  }

  // --- NWD i NWW combined state ---
  let glA, glB, glNwdAns, glNwwAns;
  let glPhase = ''; // 'gcd-mem' | 'lcm-mem' | 'gcd-tree' | 'lcm-tree'
  const glMemHistory = [];

  function newGcdLcmMemoryQuestion() {
    clearAll();
    glForfeitMode = false; forfeitBtn.textContent = 'Forfeit';
    glPhase = 'gcd-mem';
    const _gmRes = document.getElementById('gmNwdResult');
    if (_gmRes) _gmRes.style.display = 'none';
    panelGcdTree.style.display   = 'none';
    panelLcmTree.style.display   = 'none';
    panelLcmMemory.style.display = 'none';
    panelGcdMemory.style.display = '';
    let pair, tries = 0;
    do { pair = generateGcdPair(); tries++; }
    while (tries < 50 && glMemHistory.some(([a, b]) => a === pair.a && b === pair.b));
    glA = pair.a; glB = pair.b; glNwdAns = pair.ans;
    glNwwAns = Math.round((glA * glB) / glNwdAns);
    glMemHistory.push([glA, glB]);
    if (glMemHistory.length > 8) glMemHistory.shift();
    gmA = glA; gmB = glB; gmAns = glNwdAns;
    const _gmInstr = document.getElementById('gmInstruction');
    if (_gmInstr) { _gmInstr.textContent = 'Oblicz NWD i NWW liczb: ' + glA + ' i ' + glB; _gmInstr.style.display = ''; }
    gmQuestionEl.textContent = 'NWD(' + glA + ', ' + glB + ')';
    gmInput.value = ''; gmSubmitBtn.disabled = true; gmSubmitBtn.textContent = 'Sprawd\u017a';
    gmFeedback.textContent = ''; gmFeedback.className = 'feedback empty';
    gmInput.focus();
    gmStart = Date.now(); gmTimerEl.textContent = '0 s';
    gmInterval = setInterval(() => {
      gmTimerEl.textContent = Math.floor((Date.now() - gmStart) / 1000) + ' s';
    }, 1000);
    questionMode = 'ask';
  }

  function startGcdLcmMemoryNww() {
    clearAll();
    glPhase = 'lcm-mem';
    panelGcdTree.style.display   = 'none';
    panelLcmTree.style.display   = 'none';
    panelGcdMemory.style.display = 'none';
    panelLcmMemory.style.display = '';
    const _gmResHide = document.getElementById('gmNwdResult');
    if (_gmResHide) _gmResHide.style.display = 'none';
    lmA = glA; lmB = glB; lmAns = glNwwAns;
    const _lmInstr = document.getElementById('lmInstruction');
    if (_lmInstr) { _lmInstr.textContent = 'Oblicz NWD i NWW liczb: ' + lmA + ' i ' + lmB; _lmInstr.style.display = ''; }
    const _lmNwdRes = document.getElementById('lmNwdResult');
    if (_lmNwdRes) { _lmNwdRes.textContent = 'NWD(' + lmA + ', ' + lmB + ') = ' + glNwdAns; _lmNwdRes.style.display = ''; }
    lmQuestionEl.textContent = 'NWW(' + lmA + ', ' + lmB + ')';
    lmInput.value = ''; lmSubmitBtn.disabled = true; lmSubmitBtn.textContent = 'Sprawd\u017a';
    lmFeedback.textContent = ''; lmFeedback.className = 'feedback empty';
    lmInput.focus();
    lmStart = Date.now(); lmTimerEl.textContent = '0 s';
    lmInterval = setInterval(() => {
      lmTimerEl.textContent = Math.floor((Date.now() - lmStart) / 1000) + ' s';
    }, 1000);
    questionMode = 'ask';
  }

  function startGcdLcmInlineNww() {
    clearAll();
    glPhase = 'lcm-tree';
    document.getElementById('ltStats').style.display = 'none';
    ltReset.style.display = 'none';
    panelGcdTree.style.display = 'none';
    panelLcmTree.style.display = '';
    ltForm.style.display = 'none';
    ltFactorsEl.style.display = 'none';
    ltAnswerEl.style.display = 'none'; ltAnswerEl.innerHTML = '';
    ltFeedback.textContent = ''; ltFeedback.className = 'feedback empty';
    ltSubmitBtn.disabled = true;
    ltA = gtA; ltB = gtB;
    ltAns = Math.round((ltA * ltB) / gcd(ltA, ltB));
    ltFactorsA = [...gtFactorsA]; ltFactorsB = [...gtFactorsB];
    const ltNwdResEl = document.getElementById('ltNwdResult');
    if (ltNwdResEl) { ltNwdResEl.textContent = 'NWD(' + ltA + ', ' + ltB + ') = ' + gcd(ltA, ltB); ltNwdResEl.style.display = ''; }
    const _ltInstr = document.getElementById('ltInstruction');
    if (_ltInstr) { _ltInstr.textContent = 'Oblicz NWD i NWW liczb: ' + ltA + ' i ' + ltB; _ltInstr.style.display = ''; }
    ltQuestionEl.textContent = 'NWW(' + ltA + ', ' + ltB + ')';
    document.getElementById('ltTreeLabel').style.display = '';
    document.getElementById('ltTreeBox').style.display = '';
    ltLabelA.textContent = String(ltA);
    ltLabelB.textContent = String(ltB);
    ltTreeA.innerHTML = gtTreeA.innerHTML;
    ltTreeB.innerHTML = gtTreeB.innerHTML;
    ltStart = Date.now(); ltTimerEl.textContent = '0 s';
    ltInterval = setInterval(() => {
      ltTimerEl.textContent = Math.floor((Date.now() - ltStart) / 1000) + ' s';
    }, 1000);
    questionMode = 'ask';
    ltBothDone();
  }

  let glForfeitMode = false;

  function handleForfeit() {
    if (currentModule !== 'gcdlcm' || questionMode !== 'ask') return;
    clearTimeout(autoAdvanceTimeout);
    clearInterval(gmInterval); clearInterval(lmInterval);
    clearInterval(gtInterval); clearInterval(ltInterval);
    questionMode = 'next';
    if (glPhase === 'gcd-mem') {
      gmTotal++;
      gmScoreEl.textContent = gmCorrect + ' / ' + gmTotal;
      gmReset.disabled = false;
      playWrongAnim(() => {
        gmFeedback.textContent = '❌ NWD(' + glA + ', ' + glB + ') = ' + glNwdAns + '   NWW(' + glA + ', ' + glB + ') = ' + glNwwAns;
        gmFeedback.className = 'feedback bad';
        glForfeitMode = true; forfeitBtn.textContent = 'Dalej';
      });
    } else if (glPhase === 'lcm-mem') {
      lmTotal++;
      lmScoreEl.textContent = lmCorrect + ' / ' + lmTotal;
      lmReset.disabled = false;
      playWrongAnim(() => {
        lmFeedback.textContent = '❌ NWW(' + lmA + ', ' + lmB + ') = ' + lmAns;
        lmFeedback.className = 'feedback bad';
        glForfeitMode = true; forfeitBtn.textContent = 'Dalej';
      });
    } else if (glPhase === 'gcd-tree') {
      gtTotal++;
      gtScoreEl.textContent = gtCorrect + ' / ' + gtTotal;
      gtReset.disabled = false;
      const nwwAns = Math.round((gtA * gtB) / gcd(gtA, gtB));
      playWrongAnim(() => {
        gtFeedback.textContent = '❌ NWD(' + gtA + ', ' + gtB + ') = ' + gtAns + '   NWW(' + gtA + ', ' + gtB + ') = ' + nwwAns;
        gtFeedback.className = 'feedback bad';
        glForfeitMode = true; forfeitBtn.textContent = 'Dalej';
      });
    } else if (glPhase === 'lcm-tree') {
      ltTotal++;
      ltScoreEl.textContent = ltCorrect + ' / ' + ltTotal;
      ltReset.disabled = false;
      playWrongAnim(() => {
        ltFeedback.textContent = '❌ NWW(' + ltA + ', ' + ltB + ') = ' + ltAns;
        ltFeedback.className = 'feedback bad';
        glForfeitMode = true; forfeitBtn.textContent = 'Dalej';
      });
    }
  }

  forfeitBtn.addEventListener('click', () => {
    if (glForfeitMode) {
      glForfeitMode = false; forfeitBtn.textContent = 'Forfeit';
      const savedPhase = glPhase;
      if (savedPhase === 'gcd-mem' || savedPhase === 'lcm-mem') newGcdLcmMemoryQuestion();
      else startGcdLcmQuestion();
    } else {
      handleForfeit();
    }
  });

</script>
</body>
