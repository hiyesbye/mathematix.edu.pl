<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3e5f5">
<title>Równania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3e5f5; --card: #fff; --text: #1a0030;
  --score-bg: #e8f5e9; --score-text: #1b5e20; --score-bdr: #a5d6a7;
  --timer-bg: #f0e8ff; --timer-text: #4527a0; --timer-bdr: #c8aaf5;
  --mod-dark: #4527a0; --mod-mid: #7c4dff; --mod-light: #ede7f6;
  --mod-bg: #ede7f6; --mod-shadow: rgba(69,39,160,.2);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg);
  font-family: "Segoe UI", Verdana, Arial, sans-serif; color: var(--text); }
body { display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 12px; }
.card {
  background: var(--card); width: 100%; max-width: 480px;
  border-radius: 24px; padding: 22px 20px 26px;
  box-shadow: 0 8px 36px rgba(69,39,160,.14), 0 2px 8px rgba(69,39,160,.08);
}
.app-title {
  font-family: 'Nunito', "Segoe UI", sans-serif;
  font-size: 1.55rem; font-weight: 900; letter-spacing: 3px;
  text-align: center; margin: 0 0 14px; padding: 13px 20px;
  background: linear-gradient(135deg, #5c0000 0%, #b71c1c 55%, #ef5350 100%);
  border-radius: 16px; color: #fff;
  text-shadow: 0 2px 10px rgba(0,0,0,0.45), 0 0 28px rgba(255,120,120,0.28);
  box-shadow: 0 4px 22px rgba(183,28,28,0.45), 0 1px 4px rgba(0,0,0,0.2);
  position: relative;
}
.app-title::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(115deg,
    transparent 30%,
    rgba(255,255,255,.55) 46%,
    rgba(255,255,255,.15) 52%,
    transparent 62%);
  background-size: 260% 260%;
  background-position: -80% -80%;
  animation: titleShine 4.5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes titleShine {
  0%   { background-position: -80% -80%; }
  45%  { background-position: 180% 180%; }
  100% { background-position: 180% 180%; }
}
.tabs {
  display: flex; gap: 4px; background: var(--mod-bg);
  border-radius: 15px; padding: 5px 6px; margin-bottom: 14px;
}
/* ── Section-box (label + row of buttons) ── */
.section-box {
  display: flex; align-items: center; flex-wrap: wrap; gap: 5px;
  background: var(--mod-bg); border-radius: 14px; padding: 5px 6px; margin-bottom: 12px;
}
.section-label {
  flex: 0 0 auto;
  background: linear-gradient(135deg, var(--mod-dark), var(--mod-mid));
  color: #fff; font-size: .72rem; font-weight: 700; padding: 5px 10px; border-radius: 8px;
  white-space: nowrap; cursor: default; user-select: none;
  box-shadow: 0 2px 6px var(--mod-shadow);
}
/* ── Diff screen (Challenge) ── */
.diff-screen { padding: 2px 0 6px; }
.diff-heading { font-size: 1rem; font-weight: 700; margin-bottom: 12px; opacity: .85; text-align: center; }
.diff-buttons { display: flex; flex-direction: column; gap: 10px; }
.diff-btn {
  display: flex; align-items: center; gap: 14px; width: 100%;
  border: none; border-radius: 14px; padding: 13px 16px; cursor: pointer;
  font-family: inherit; color: #fff; font-weight: 700; transition: filter .15s, transform .06s;
}
.diff-btn:hover { filter: brightness(1.08); }
.diff-btn:active { transform: scale(.97); }
.diff-icon { font-size: 1.8rem; line-height: 1; }
.diff-info { display: flex; flex-direction: column; gap: 2px; }
.diff-name { font-size: 1rem; }
.diff-desc { font-size: .76rem; opacity: .88; font-weight: 600; }
.diff-easy   { background: linear-gradient(135deg,#1e9e5a,#38d68a); box-shadow: 0 4px 14px rgba(30,158,90,.3); }
.diff-medium { background: linear-gradient(135deg,#c07800,#f5c030); box-shadow: 0 4px 14px rgba(192,120,0,.3); }
.diff-hard   { background: linear-gradient(135deg,#d64040,#f07070); box-shadow: 0 4px 14px rgba(214,64,64,.3); }
/* ── Timer countdown states ── */
.timer-box.warn   { background: #ffe0cc !important; color: #c04000 !important; border-color: #ffb480 !important; }
.timer-box.danger { background: #ffd6d6 !important; color: #c00000 !important; border-color: #ff9090 !important;
  animation: timerPulse .5s ease-in-out infinite alternate; }
@keyframes timerPulse { from { transform:scale(1); } to { transform:scale(1.05); } }
.tab {
  flex: 1; border: none; background: transparent; border-radius: 11px;
  padding: 8px 4px; font-size: .68rem; font-weight: 700; color: var(--mod-mid);
  cursor: pointer; transition: background .18s, color .18s;
  line-height: 1.25; text-align: center; font-family: inherit;
}
.tab:hover { background: var(--mod-light); }
.tab.active {
  background: linear-gradient(135deg, var(--mod-dark), var(--mod-mid));
  color: #fff; box-shadow: 0 3px 10px var(--mod-shadow);
}
.stats { display: flex; gap: 10px; margin-bottom: 14px; }
.stat-box {
  flex: 1; border-radius: 14px; padding: 10px 6px;
  font-weight: 700; text-align: center;
  background: var(--score-bg); color: var(--score-text); border: 2px solid var(--score-bdr);
}
.timer-box { background: var(--timer-bg); color: var(--timer-text); border: 2px solid var(--timer-bdr); transition: background .3s, color .3s; }
.stat-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .8px; opacity: .7; margin-bottom: 2px; }
.stat-value { font-size: 1.35rem; }
.question-box {
  background: linear-gradient(145deg, var(--mod-dark), var(--mod-mid)); color: #fff;
  border-radius: 18px; padding: 18px 14px 16px; text-align: center; margin-bottom: 14px;
  position: relative; overflow: hidden; transition: background .3s;
}
#m6-fill-area {
  background: linear-gradient(145deg, var(--mod-dark), var(--mod-mid)); color: #fff;
  border-radius: 0 0 18px 18px; padding: 10px 14px 14px; text-align: center;
  margin-top: -20px; position: relative;
}
.question-box.step2 {
  background: linear-gradient(145deg, #0d47a1, #1976d2);
}
.q-label { font-size: .76rem; font-weight: 600; opacity: .8; margin-bottom: 8px; position: relative; z-index: 1; }
.question {
  font-family: "Bahnschrift","DIN Alternate","Trebuchet MS",sans-serif;
  font-size: clamp(1rem, 4.5vw, 1.6rem); font-weight: 700; line-height: 1.5;
  position: relative; z-index: 1;
}

/* ── Kratki (moduł 1) ── */
.eq-input-row {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; flex-wrap: wrap; margin-bottom: 12px; min-height: 56px;
}
.kratka {
  width: 56px; height: 50px;
  border: 2.5px solid var(--mod-light); border-radius: 10px;
  font-size: 1.15rem; font-weight: 700; text-align: center;
  font-family: "Bahnschrift","DIN Alternate","Trebuchet MS",sans-serif;
  color: var(--text); background: #fafafa; outline: none;
  transition: border-color .2s, box-shadow .2s;
  -moz-appearance: textfield;
}
.kratka::-webkit-outer-spin-button,
.kratka::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.kratka:focus { border-color: var(--mod-mid); box-shadow: 0 0 0 3px rgba(124,77,255,.15); }
.kratka:disabled { opacity: .55; }
.kratka.narrow { width: 44px; height: 44px; font-size: 1rem; }
.eq-letter {
  font-size: 1.6rem; font-weight: 700; line-height: 1;
  font-family: "Bahnschrift","DIN Alternate","Trebuchet MS",sans-serif;
  color: var(--text);
}
.eq-fixed { font-size: 1.1rem; font-weight: 700; color: #555; white-space: nowrap; }
.frac-input { display: flex; flex-direction: column; align-items: center; }
.frac-bar { width: 44px; height: 2.5px; background: var(--text); margin: 2px 0; }
.sign-btn {
  min-width: 38px; height: 50px; padding: 0 8px;
  font-size: 1.3rem; font-weight: 900; line-height: 1;
  border: 2.5px solid #a5d6a7; border-radius: 10px;
  background: #f1f8f1; color: #1b5e20;
  cursor: pointer; transition: all .15s; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.sign-btn:hover { background: #c8e6c9; }
.sign-btn.neg { background: #ffe8e8; border-color: #e57373; color: #c62828; }
.sign-btn:disabled { opacity: .5; cursor: default; }

/* ── Moduł 2 ── */
.ans-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.ans-inp {
  flex: 1; padding: 12px 14px; font-size: 1.1rem; font-weight: 700;
  border: 2.5px solid var(--mod-light); border-radius: 14px; outline: none;
  font-family: "Bahnschrift","DIN Alternate","Trebuchet MS",sans-serif;
  color: var(--text); background: #fafafa; transition: border-color .2s;
}
.ans-inp:focus { border-color: var(--mod-mid); }
.btn {
  border: none; border-radius: 14px; padding: 12px 22px;
  font-size: .95rem; font-weight: 700; cursor: pointer;
  font-family: inherit; transition: opacity .18s, transform .1s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: linear-gradient(135deg, var(--mod-dark), var(--mod-mid)); color: #fff; }
.btn-primary:hover { opacity: .88; }
.btn-next { background: var(--mod-light); color: var(--mod-dark); }
.btn-next:hover { background: #d1c4e9; }
.btn-row { display: flex; gap: 8px; }
.m1-hint { font-size: .78rem; color: #888; text-align: center; margin-bottom: 10px; }
.lv-row { display: flex; gap: 6px; margin-bottom: 12px; }
.lv-btn {
  flex: 1; border: 2px solid var(--mod-light); border-radius: 10px;
  padding: 7px 4px; font-size: .78rem; font-weight: 700;
  background: transparent; color: var(--mod-mid);
  cursor: pointer; font-family: inherit; transition: all .15s;
}
.lv-btn:hover { background: var(--mod-light); }
.lv-btn.active { background: var(--mod-mid); color: #fff; border-color: var(--mod-dark); }
.eq-sup { font-size: 0.72rem; vertical-align: super; font-weight: 700; line-height: 0; }
.eq-frac { display: inline-flex; flex-direction: column; align-items: center; margin: 0 4px; flex-shrink: 0; vertical-align: middle; }
.eq-frac-num { border-bottom: 2.5px solid var(--mod-mid); padding: 2px 6px 5px; display: flex; align-items: center; gap: 4px; justify-content: center; min-width: 30px; }
.eq-frac-den { padding: 5px 6px 2px; display: flex; align-items: center; gap: 4px; justify-content: center; }
.kratka-pow {
  width: 22px; height: 22px;
  font-size: 0.68rem; font-weight: 700; text-align: center;
  border: 2px solid #9575cd; border-radius: 6px;
  background: #f3f0ff; color: #4527a0;
  padding: 0; margin-left: 2px;
  position: relative; bottom: 14px;
  flex-shrink: 0;
}
.kratka-pow:focus { outline: none; border-color: var(--mod-mid); background: #ede7f6; }
.kratka-dec {
  width: 58px; height: 38px;
  font-size: 1.05rem; font-weight: 700; text-align: center;
  border: 2px solid var(--mod-mid); border-radius: 8px;
  background: #f3f0ff; color: #4527a0;
  padding: 0; margin: 0 3px;
  flex-shrink: 0;
}
.kratka-dec:focus { outline: none; border-color: var(--mod-dark); background: #ede7f6; }
.kratka-eq {
  width: 100%; max-width: 320px; height: 42px;
  font-size: 1.08rem; font-weight: 700; text-align: center;
  border: 2px solid var(--mod-mid); border-radius: 8px;
  background: #f3f0ff; color: #4527a0;
  padding: 0 10px; box-sizing: border-box; flex-shrink: 0;
}
.kratka-eq:focus { outline: none; border-color: var(--mod-dark); background: #ede7f6; }
.step-row {
  width: 100%; display: flex; align-items: center; justify-content: center;
  gap: 6px; flex-wrap: wrap; padding: 2px 0;
}
.step-label {
  font-size: 0.75rem; color: #888; font-style: italic;
  width: 100%; text-align: center; margin-bottom: 1px;
}
.feedback.step { display: block; background: #fff8e1; color: #e65100; border: 2px solid #ffb300; }
.feedback {
  border-radius: 14px; padding: 11px 14px; font-weight: 700;
  text-align: center; margin-bottom: 12px; font-size: .93rem; display: none;
}
.feedback.good { display: block; background: #e8f5e9; color: #1b5e20; border: 2px solid #a5d6a7; }
.feedback.bad  { display: block; background: #ffebee; color: #b71c1c; border: 2px solid #ef9a9a; }
.feedback.bad .fb-hint { display: block; margin-top: 5px; font-size: 1.08rem; font-weight: 900; color: #c62828; letter-spacing: .02em; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.choice-btn {
  padding: 14px 8px; border-radius: 14px; border: 2.5px solid var(--mod-light);
  background: #fafafa; font-size: 1.15rem; font-weight: 700; cursor: pointer;
  font-family: "Bahnschrift","DIN Alternate","Trebuchet MS",sans-serif;
  color: var(--text); transition: all .18s; text-align: center;
}
.choice-btn:hover:not(:disabled) { border-color: var(--mod-mid); background: var(--mod-bg); }
.choice-btn.correct { background: #e8f5e9; border-color: #4caf50; color: #1b5e20; }
.choice-btn.wrong   { background: #ffebee; border-color: #e53935; color: #b71c1c; }
.choice-btn:disabled { cursor: default; }
.module { display: none; }
.module.active { display: block; }

/* ── Animacje ── */
.anim-layer {
  position: absolute; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.correct-flash {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(40,220,100,.45) 0%, rgba(40,220,100,0) 70%);
  animation: flashFade 1.3s ease-out forwards;
}
.wrong-flash {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(220,0,0,.4) 0%, rgba(220,0,0,0) 70%);
  animation: flashFade 1.2s ease-out forwards;
}
@keyframes flashFade { 0%{opacity:0;} 15%{opacity:1;} 100%{opacity:0;} }
.anim-correct-num {
  font-size: 6rem; font-weight: 900; color: #fff; line-height: 1;
  text-shadow: 0 0 10px #7fffb0, 0 0 25px #50ff80, 0 0 55px #20e860;
  animation: correctPop 1.3s cubic-bezier(.22,1,.36,1) forwards;
  position: relative; z-index: 2;
}
@keyframes correctPop {
  0%   { opacity:0; transform:scale(.2) rotate(-8deg); }
  28%  { opacity:1; transform:scale(1.18) rotate(2deg); }
  60%  { transform:scale(.95) rotate(0); }
  100% { opacity:0; transform:scale(1.1); }
}
.anim-big-x {
  font-size: 6rem; font-weight: 900; color: #ff1a1a; line-height: 1;
  position: absolute; z-index: 3;
  animation: wrongGlow 1.2s ease-out forwards;
}
@keyframes wrongGlow {
  0%   { opacity:0; transform:scale(.4); text-shadow:0 0 8px #f00,0 0 16px #f00; }
  18%  { opacity:1; transform:scale(1.12); text-shadow:0 0 8px #f00,0 0 20px #f00,0 0 40px #f22,0 0 80px #f44; }
  60%  { transform:scale(1.05); }
  100% { opacity:0; transform:scale(1.2); }
}
.particle {
  position: absolute; z-index: 3; font-size: 1.8rem; font-weight: 900; color: #fff;
  pointer-events: none; animation: particleFly 1s ease-out forwards;
  text-shadow: 0 0 8px rgba(80,255,140,.9), 0 0 18px rgba(80,255,140,.5);
}
@keyframes particleFly {
  0%   { opacity:1; transform:translate(0,0) scale(1.1); }
  100% { opacity:0; transform:var(--tx) scale(.2); }
}

/* ── Moduł 3 ── */
.m3-step { font-size:.72rem; font-weight:700; text-align:center; color:rgba(255,255,255,.75); margin-bottom:10px; letter-spacing:.5px; position:relative; z-index:1; }
.m3-eq-row {
  display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap;
  font-family:"Bahnschrift","DIN Alternate","Trebuchet MS",sans-serif;
  font-size:clamp(1.3rem,5.5vw,2rem); font-weight:700; color:#fff; min-height:2.6rem;
  position:relative; z-index:1;
}
.m3-term-btn {
  background:rgba(255,255,255,.12); border:2.5px solid rgba(255,255,255,.38);
  border-radius:10px; padding:3px 10px; color:#fff; cursor:pointer;
  font-family:inherit; font-size:inherit; font-weight:inherit;
  transition:background .15s, border-color .15s, transform .12s;
}
.m3-term-btn:hover { background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.85); transform:scale(1.07); }
.m3-term-sel { background:rgba(255,213,0,.22); border:2.5px solid rgba(255,213,0,.78); border-radius:10px; padding:3px 10px; color:#fff; }
.m3-term-static { color:#fff; }
.m3-sep { color:rgba(255,255,255,.65); padding:0 3px; }
.m3-sign-sep { color:rgba(255,255,255,.85); padding:0 4px; font-size:1.15em; }
.m3-rhs { color:#fff; }
.m3-bar { color:rgba(255,255,255,.5); font-size:1.5em; margin:0 4px; line-height:1; }
.m3-op { background:rgba(255,255,255,.18); border-radius:10px; padding:2px 12px; color:#fff8; font-weight:900; }
.m3-hint { text-align:center; color:rgba(255,255,255,.68); font-size:.8rem; font-weight:600; margin-top:10px; position:relative; z-index:1; }
.m3-undo-inline { background:none; border:none; color:rgba(255,255,255,.55); font-size:.72rem; font-weight:700; cursor:pointer; padding:0; margin-right:8px; vertical-align:middle; letter-spacing:.01em; }
.m3-undo-inline:not([disabled]):hover { color:#fff; }
.m3-undo-inline[disabled] { opacity:.25; cursor:default; }
.m3lrm-chip-row { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:center; gap:0; padding:2px 0; }
.m3lrm-chip { display:inline-block; padding:3px 8px; border-radius:20px; cursor:pointer; font-size:1.05em; font-weight:700; line-height:1.3; background:rgba(255,255,255,.15); color:#fff; border:2px solid rgba(255,255,255,.3); transition:background .12s; user-select:none; -webkit-user-select:none; vertical-align:middle; }
.m3lrm-chip:hover { background:rgba(255,255,255,.28); }
.m3lrm-chip.gc0 { background:#a855f7; border-color:#9333ea; }
.m3lrm-chip.gc1 { background:#f97316; border-color:#ea580c; }
.m3lrm-chip.gc2 { background:#22c55e; border-color:#16a34a; color:#052e16; }
.m3lrm-chip.gc3 { background:#ef4444; border-color:#dc2626; }
.m3lrm-chip-hint { font-size:.7rem; color:rgba(255,255,255,.65); text-align:center; margin:4px 0 2px; }
.m3lrm-scroll { overflow-x:auto; width:100%; }
.m3lrm-scroll .m3-eq-row { flex-wrap:nowrap; }
.m3-forfeit-btn { display:block; width:100%; margin-top:8px; background:rgba(220,50,50,.14); border:2px solid rgba(200,50,50,.35); color:#8b0000; border-radius:12px; padding:9px 0; font-size:.9rem; font-weight:700; cursor:pointer; transition:background .15s; }
.m3-forfeit-btn:hover { background:rgba(220,50,50,.25); }
.m3-sol-steps { text-align:left; margin-top:5px; }
.m3-sol-step { font-size:.8rem; color:#7f0000; margin:3px 0; line-height:1.4; }
.m3-sol-lbl { color:#b71c1c; font-size:.75rem; }
.m3-sol-eq { font-weight:800; color:#5d0000; background:rgba(183,28,28,.1); padding:1px 7px; border-radius:6px; letter-spacing:.01em; }
.m3-solved { text-align:center; padding:10px 0; position:relative; z-index:1; }
.m3-solved-icon { font-size:2.5rem; margin-bottom:6px; }
.m3-solved-eq { font-size:2rem; font-weight:900; color:#fff; font-family:"Bahnschrift","DIN Alternate","Trebuchet MS",sans-serif; margin-bottom:6px; display:flex; align-items:center; justify-content:center; gap:4px; }
.m3-solved-frac{display:inline-flex;flex-direction:column;align-items:center;margin:0 2px;vertical-align:middle;font-size:.8em;line-height:1.15;}
.m3-solved-frac-num{border-bottom:2.5px solid rgba(255,255,255,.85);padding:0 6px 3px;min-width:1.4em;text-align:center;}
.m3-solved-frac-den{padding:3px 6px 0;min-width:1.4em;text-align:center;}
.m3-solved-msg { color:rgba(255,255,255,.82); font-size:.9rem; font-weight:700; margin-bottom:16px; }
.m3-sign-cycle {
  min-width:46px; background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.35);
  border-radius:8px; padding:4px 8px; color:#fff; font-size:1.25rem; font-weight:900;
  font-family:inherit; cursor:pointer; transition:background .15s,border-color .15s;
  position:relative; z-index:1; text-align:center;
}
.m3-sign-cycle:hover { background:rgba(255,255,255,.3); }
.m3-sign-cycle.s-minus { background:rgba(255,80,80,.32); border-color:rgba(255,160,160,.75); }
.m3-sign-cycle.s-mul   { background:rgba(80,200,80,.22); border-color:rgba(120,230,120,.65); }
.m3-sign-cycle.s-div   { background:rgba(100,160,255,.28); border-color:rgba(150,190,255,.7); }
.m3-val-inp {
  width:62px; background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.35);

}
.m3-val-inp::placeholder { color:rgba(255,255,255,.45); }
.m3-val-inp:focus { outline:none; border-color:rgba(255,255,255,.85); }
.m3-choice-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:10px; position:relative; z-index:1; }
.m3-choice-action {
  flex:1; min-width:130px; padding:9px 10px; border-radius:12px;

.m3-transp-lbl { font-size:.72rem; font-weight:800; color:#ffd700; white-space:nowrap; min-height:1.1em; text-align:center; line-height:1; }
.m3-transp-sel { background:rgba(255,213,0,.28)!important; border-color:rgba(255,213,0,.85)!important; }
.m3-transp-apply {
  padding:8px 22px; border-radius:12px;
  border:2px solid rgba(255,255,255,.4); background:rgba(255,255,255,.18);
  color:#fff; font-size:.88rem; font-weight:700; font-family:inherit;
  cursor:pointer; transition:background .15s,border-color .15s; position:relative; z-index:1;
}
.m3-transp-apply:hover { background:rgba(255,255,255,.32); border-color:rgba(255,255,255,.75); }
/* ── Moduł 3 — Lv6 ── */
.m6-frac-chip{display:inline-flex;align-items:center;cursor:pointer;background:rgba(255,255,255,.12);border:2.5px solid rgba(255,255,255,.3);border-radius:10px;padding:3px 10px;color:#fff;font-family:"Bahnschrift","DIN Alternate","Trebuchet MS",sans-serif;font-size:inherit;font-weight:inherit;transition:background .15s,border-color .15s,transform .12s;}

.m6-dalej-btn{display:block;width:100%;margin-top:8px;background:linear-gradient(135deg,var(--mod-dark),var(--mod-mid));border:none;color:#fff;border-radius:12px;padding:10px 0;font-size:.95rem;font-weight:700;cursor:pointer;transition:opacity .15s;position:relative;z-index:1;}

<script>
const randInt = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const shuffle = arr => { for(let i=arr.length-1;i>0;i--){const j=randInt(0,i);[arr[i],arr[j]]=[arr[j],arr[i]];}return arr; };

// ── Tabs
const tabs = document.querySelectorAll('.tab');
const mods = document.querySelectorAll('.module');
function switchTab(i){
  if(i!==1) stopCountdownM2();
  tabs.forEach((t,j)=>t.classList.toggle('active',i===j));
  mods.forEach((m,j)=>m.classList.toggle('active',i===j));
}

// ── Timer
function startTimer(id){
  const el=document.getElementById(id);
  clearInterval(el._iv);
  const t0=Date.now(); el.textContent='0 s';
  el._iv=setInterval(()=>{el.textContent=`${Math.floor((Date.now()-t0)/1000)} s`;},500);
}
function stopTimer(id){
  const el=document.getElementById(id);
  clearInterval(el._iv); el._iv=null;
}

// ── Animacje
let _adv=null;
function playCorrectAnim(animId,onDone){
  const L=document.getElementById(animId); L.innerHTML='';
  const f=document.createElement('div'); f.className='correct-flash'; L.appendChild(f);
  const n=document.createElement('div'); n.className='anim-correct-num'; n.textContent='✓'; L.appendChild(n);
  const S=['x','=','★','✦','✧','◆','✓'];
  for(let i=0;i<14;i++){
    const p=document.createElement('div'); p.className='particle';
    p.textContent=S[i%S.length];
    const a=(360/14)*i,d=90+Math.random()*80,r=a*Math.PI/180;
    p.style.setProperty('--tx',`translate(${Math.cos(r)*d}px,${Math.sin(r)*d}px)`);
    p.style.animationDelay=`${Math.random()*.12}s`;
    p.style.fontSize=`${1.1+Math.random()*1.1}rem`;
    L.appendChild(p);
  }
  setTimeout(()=>{L.innerHTML='';},1400);
  if(onDone){clearTimeout(_adv);_adv=setTimeout(onDone,1700);}
}
function playWrongAnim(animId,onDone){
  const L=document.getElementById(animId); L.innerHTML='';
  const f=document.createElement('div'); f.className='wrong-flash'; L.appendChild(f);
  const x=document.createElement('div'); x.className='anim-big-x'; x.textContent='✗'; L.appendChild(x);
  setTimeout(()=>{L.innerHTML='';if(onDone)onDone();},1300);
}
function playFlash(animId,type){
  const L=document.getElementById(animId); L.innerHTML='';
  const f=document.createElement('div'); f.className=type+'-flash'; L.appendChild(f);
  setTimeout(()=>{L.innerHTML='';},800);
}

// ════════════════════════════════════════
// MODUŁ 1 – Zapisywanie z kratek
// ════════════════════════════════════════
let m1Cor=0,m1Tot=0,m1Cur=null,m1Locked=false,m1Sign='+',m1Level=1,m1Phase=1;
const M1_VARS=['x','y','z','n','u','a','m','k'];
const pick=arr=>arr[randInt(0,arr.length-1)];
const rndVar=()=>pick(M1_VARS);
function gcd(a,b){return b?gcd(b,Math.abs(a)%b):Math.abs(a);}
function numToFracStr(n){
  if(Number.isInteger(n))return String(n);
  for(let d=2;d<=20;d++){const num=Math.round(n*d);if(Math.abs(num/d-n)<0.0001){const g=gcd(Math.abs(num),d);return`${num/g}/${d/g}`;}}
  return String(Math.round(n*1000)/1000);
}
function numToDispHtml(n){
  if(Number.isInteger(n))return String(n);
  const neg=n<0,abs=Math.abs(n);
  const mkFrac=(p,q)=>`<span class="m3-solved-frac"><span class="m3-solved-frac-num">${p}</span><span class="m3-solved-frac-den">${q}</span></span>`;
  if(abs<1){
    for(let d=2;d<=20;d++){const p=Math.round(abs*d);if(Math.abs(p/d-abs)<0.0001){const g=gcd(p,d);return(neg?'−':'')+mkFrac(p/g,d/g);}}
    return numToFracStr(n);
  }
  const whole=Math.floor(abs),frac=abs-whole;
  for(let d=2;d<=20;d++){const p=Math.round(frac*d);if(Math.abs(p/d-frac)<0.0001&&p>0){const g=gcd(p,d);return(neg?'−':'')+whole+' '+mkFrac(p/g,d/g);}}
  return numToFracStr(n);
}
const WORD_A_EXT={2:'Dwukrotność',3:'Trzykrotność',4:'Czterokrotność',5:'Pięciokrotność',6:'Sześciokrotność',7:'Siedmiokrotność'};
const FRAC_WORD={2:'Połowa',3:'Trzecia część',4:'Ćwierć',5:'Piąta część',6:'Szósta część',7:'Siódma część',8:'Ósma część'};

const M1_LV1=[
  ()=>{const v=rndVar(),b=randInt(2,20),c=randInt(b+2,60);
    return{s:`Liczba o ${b} większa od ${v} wynosi ${c}.`,schema:'xbc',exp:{sign:'+',b,c,letter:v}};},
  ()=>{const v=rndVar(),b=randInt(2,15),x=randInt(b+1,30),c=x-b;
    return{s:`Liczba ${v} zmniejszona o ${b} wynosi ${c}.`,schema:'xbc',exp:{sign:'-',b,c,letter:v}};},
  ()=>{const v=rndVar(),b=randInt(2,12),c=randInt(b+2,40);
    return{s:`Do liczby ${v} dodano ${b} i otrzymano ${c}.`,schema:'xbc',exp:{sign:'+',b,c,letter:v}};},
  ()=>{const v=rndVar(),b=randInt(2,12),x=randInt(b+2,30),c=x-b;
    return{s:`Od liczby ${v} odjęto ${b} i otrzymano ${c}.`,schema:'xbc',exp:{sign:'-',b,c,letter:v}};},
  ()=>{const v=rndVar(),b=randInt(2,15),c=randInt(b+2,50);
    return{s:`Suma liczby ${v} i liczby ${b} wynosi ${c}.`,schema:'xbc',exp:{sign:'+',b,c,letter:v}};},
  ()=>{const v=rndVar(),b=randInt(3,20),c=randInt(b+1,50);
    return{s:`Liczba ${v} jest o ${b} mniejsza od ${c}.`,schema:'xbc',exp:{sign:'+',b,c,letter:v}};},
  ()=>{const v=rndVar(),a=randInt(2,9),x=randInt(2,12),c=a*x;
    return{s:`Iloczyn liczby ${v} i liczby ${a} wynosi ${c}.`,schema:'axc',exp:{a,c,letter:v}};},
  ()=>{const v=rndVar(),a=randInt(2,5),x=randInt(2,12),c=a*x;
    return{s:`${WORD_A_EXT[a]} liczby ${v} wynosi ${c}.`,schema:'axc',exp:{a,c,letter:v}};},
  ()=>{const v=rndVar(),c=randInt(2,20);
    return{s:`Połowa liczby ${v} wynosi ${c}.`,schema:'fracxc',exp:{num:1,den:2,c,letter:v}};},
  ()=>{const v=rndVar(),den=pick([3,4]),c=randInt(2,12);

  ()=>{const v=rndVar(),den=randInt(5,8),c=randInt(2,10);

  ()=>{const v=rndVar(),den=randInt(2,6),c=randInt(2,12);

];

const M1_LV2=[
  ()=>{const v=rndVar(),a=randInt(2,6),b=randInt(1,15),x=randInt(2,10),c=a*x+b;

  ()=>{const v=rndVar(),a=randInt(2,4),b=randInt(5,20),x=randInt(2,12),c=a*x+b;

  ()=>{const v=rndVar(),den=pick([2,3,4,5,6]),b=randInt(5,25),x=randInt(2,12),c=x+b;
    return{s:`${FRAC_WORD[den]||'1/'+den+' część'} liczby ${v} powiększona o ${b} wynosi ${c}.`,schema:'fracxbc',exp:{num:1,den,sign:'+',b,c,letter:v}};},
  ()=>{const v=rndVar(),den=pick([3,4,5,6]),b=randInt(10,30),x=randInt(2,12),c=x+b;
    const ordt={3:'trzecią część',4:'ćwierć',5:'piątą część',6:'szóstą część'};
    return{s:`Jeśli ${ordt[den]||'1/'+den+' część'} liczby ${v} powiększymy o ${b}, to otrzymamy ${c}.`,schema:'fracxbc',exp:{num:1,den,sign:'+',b,c,letter:v}};},
  ()=>{const v=rndVar(),a=randInt(2,5),b=randInt(2,10),x=randInt(1,8),c=a*(x+b);

  ()=>{const v=rndVar(),a=randInt(2,4),b=randInt(2,8),x=randInt(b+2,12),c=a*(x-b);

const M1_LV3=[
  ()=>{const v=rndVar(),b=randInt(1,8),x=randInt(1,7),base=x+b,c=base*base;
    return{s:`Kwadrat sumy liczby ${v} i liczby ${b} wynosi ${c}.`,schema:'ltrParenPow2c',exp:{b,sign:'+',c,letter:v}};},

    return{s:`Kwadrat różnicy liczby ${v} i liczby ${b} wynosi ${c}.`,schema:'ltrParenPow2c',exp:{b,sign:'-',c,letter:v}};},
  ()=>{const v=rndVar(),b=randInt(1,4),x=randInt(1,4),base=x+b,c=base*base*base;
    return{s:`Sześcian sumy liczby ${v} i liczby ${b} wynosi ${c}.`,schema:'ltrParenPow3c',exp:{b,sign:'+',c,letter:v}};},
  ()=>{const v=rndVar(),b=randInt(1,3),x=randInt(b+1,6),base=x-b,c=base*base*base;
    return{s:`Sześcian różnicy liczby ${v} i liczby ${b} wynosi ${c}.`,schema:'ltrParenPow3c',exp:{b,sign:'-',c,letter:v}};},

  ()=>{const v=rndVar(),a=randInt(2,3),d=randInt(2,4),x=randInt(2,8);

// Buduje kratki dla danego schematu
function renderM1Input(schema){
  const row=document.getElementById('m1-input-row');
  row.innerHTML=''; m1Sign='+';

  const mkKratka=(id,narrow)=>{
    const el=document.createElement('input');
    el.type='text'; el.inputMode='numeric';
    el.className='kratka'+(narrow?' narrow':'');
    el.id=id; el.autocomplete='off';
    el.addEventListener('keydown',e=>{if(e.key==='Enter')checkM1();});
    return el;
  };
  const mkLetterKratka=(id)=>{
    const el=document.createElement('input');
    el.type='text'; el.maxLength=1;
    el.className='kratka narrow'; el.id=id; el.autocomplete='off';
    el.addEventListener('keydown',e=>{if(e.key==='Enter')checkM1();});
    return el;
  };
  const mkTxt=(t,cls='eq-fixed')=>{
    const s=document.createElement('span'); s.className=cls; s.textContent=t; return s;
  };
  const mkSignBtn=()=>{
    const b=document.createElement('button'); b.type='button';
    b.id='m1-sign'; b.className='sign-btn'; b.textContent='+';
    m1Sign='+';
    b.onclick=()=>{
      m1Sign=m1Sign==='+'?'-':'+';
      b.textContent=m1Sign==='+'?'+':'−';
      b.className='sign-btn'+(m1Sign==='-'?' neg':'');
    };
    return b;
  };
  const mkFrac=(nId,dId)=>{
    const wrap=document.createElement('div'); wrap.className='frac-input';
    wrap.appendChild(mkKratka(nId,true));
    const bar=document.createElement('div'); bar.className='frac-bar'; wrap.appendChild(bar);
    wrap.appendChild(mkKratka(dId,true));
    return wrap;
  };
  const mkSup=(t)=>{const s=document.createElement('span'); s.className='eq-fixed eq-sup'; s.textContent=t; return s;};
  const mkPowKratka=(id)=>{
    const el=document.createElement('input');
    el.type='text'; el.maxLength=1;
    el.className='kratka-pow'; el.id=id; el.autocomplete='off';
    el.addEventListener('keydown',e=>{if(e.key==='Enter')checkM1();});
    return el;
  };
  const mkDecKratka=(id)=>{
    const el=document.createElement('input');
    el.type='text'; el.maxLength=6;
    el.className='kratka-dec'; el.id=id; el.autocomplete='off';
    el.addEventListener('keydown',e=>{if(e.key==='Enter')checkM1();});
    return el;
  };
  const mkFracEq=(numEls,denEls)=>{
    const wrap=document.createElement('div'); wrap.className='eq-frac';
    const num=document.createElement('div'); num.className='eq-frac-num';
    numEls.forEach(el=>num.appendChild(el));
    const den=document.createElement('div'); den.className='eq-frac-den';
    denEls.forEach(el=>den.appendChild(el));
    wrap.appendChild(num); wrap.appendChild(den);
    return wrap;
  };

  switch(schema){
    case 'xbc':
      row.appendChild(mkLetterKratka('ltr'));
      row.appendChild(mkSignBtn());
      row.appendChild(mkKratka('b1'));
      row.appendChild(mkTxt('='));
      row.appendChild(mkKratka('b2'));
      break;
    case 'axc':
      row.appendChild(mkKratka('b1'));
      row.appendChild(mkLetterKratka('ltr'));
      row.appendChild(mkTxt('='));
      row.appendChild(mkKratka('b2'));
      break;
    case 'axbc':
      row.appendChild(mkKratka('b1'));
      row.appendChild(mkLetterKratka('ltr'));
      row.appendChild(mkSignBtn());
      row.appendChild(mkKratka('b2'));
      row.appendChild(mkTxt('='));
      row.appendChild(mkKratka('b3'));
      break;
    case 'fracxc':
      row.appendChild(mkFrac('b1','b2'));
      row.appendChild(mkLetterKratka('ltr'));
      row.appendChild(mkTxt('='));
      row.appendChild(mkKratka('b3'));
      break;
    case 'fracxbc':
      row.appendChild(mkFrac('b1','b2'));
      row.appendChild(mkLetterKratka('ltr'));
      row.appendChild(mkSignBtn());
      row.appendChild(mkKratka('b3'));
      row.appendChild(mkTxt('='));
      row.appendChild(mkKratka('b4'));
      break;
    case 'aparenbc':
      row.appendChild(mkKratka('b1'));
      row.appendChild(mkTxt('('));
      row.appendChild(mkLetterKratka('ltr'));
      row.appendChild(mkSignBtn());
      row.appendChild(mkKratka('b2'));
      row.appendChild(mkTxt(') ='));
      row.appendChild(mkKratka('b3'));
      break;
    case 'bcxc':
      row.appendChild(mkKratka('b1'));
      row.appendChild(mkSignBtn());
      row.appendChild(mkLetterKratka('ltr'));
      row.appendChild(mkTxt('='));
      row.appendChild(mkKratka('b2'));
      break;
    case 'bDivLtrc':
      row.appendChild(mkFracEq([mkKratka('b1')],[mkLetterKratka('ltr')]));
      row.appendChild(mkTxt('='));
      row.appendChild(mkKratka('b2'));
      break;
    case 'ltrPow2c':
      row.appendChild(mkLetterKratka('ltr'));
      row.appendChild(mkPowKratka('pow'));
      row.appendChild(mkTxt('='));
      row.appendChild(mkKratka('b1'));
      break;
    case 'ltrPow3c':
      row.appendChild(mkLetterKratka('ltr'));
      row.appendChild(mkPowKratka('pow'));
      row.appendChild(mkTxt('='));
      row.appendChild(mkKratka('b1'));
      break;
    case 'ltrParenPow2c':
      row.appendChild(mkTxt('('));
      row.appendChild(mkLetterKratka('ltr'));
      row.appendChild(mkSignBtn());
      row.appendChild(mkKratka('b1'));
      row.appendChild(mkTxt(')'));
      row.appendChild(mkPowKratka('pow'));
      row.appendChild(mkTxt('='));
      row.appendChild(mkKratka('b2'));
      break;
    case 'ltrParenPow3c':
      row.appendChild(mkTxt('('));
      row.appendChild(mkLetterKratka('ltr'));
      row.appendChild(mkSignBtn());
      row.appendChild(mkKratka('b1'));
      row.appendChild(mkTxt(')'));
      row.appendChild(mkPowKratka('pow'));
      row.appendChild(mkTxt('='));
      row.appendChild(mkKratka('b2'));
      break;
    case 'ltrPow2SignBc':
      row.appendChild(mkLetterKratka('ltr'));
      row.appendChild(mkPowKratka('pow'));
      row.appendChild(mkSignBtn());
      row.appendChild(mkKratka('b1'));
      row.appendChild(mkTxt('='));
      row.appendChild(mkKratka('b2'));
      break;
    case 'aLtrPow3PlusBc':
      row.appendChild(mkKratka('b1'));
      row.appendChild(mkTxt('('));
      row.appendChild(mkLetterKratka('ltr'));
      row.appendChild(mkPowKratka('pow'));
      row.appendChild(mkTxt('+'));
      row.appendChild(mkKratka('b2'));
      row.appendChild(mkTxt(') ='));
      row.appendChild(mkKratka('b3'));
      break;
    case 'axbDivDc':
      row.appendChild(mkFracEq(
        [mkTxt('('),mkKratka('b1'),mkLetterKratka('ltr'),mkSignBtn(),mkKratka('b2'),mkTxt(')')],
        [mkKratka('b3')]
      ));
      row.appendChild(mkTxt('='));
      row.appendChild(mkKratka('b4'));
      break;
    case 'percentXc':
    case 'percentXbc': {
      const inp=document.createElement('input');
      inp.type='text'; inp.className='kratka-eq'; inp.id='eq-input'; inp.autocomplete='off';
      inp.placeholder='Zapisz równanie...';
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkM1();});
      row.appendChild(inp);
      break;
    }
    case 'percentSmaller':
    case 'percentBigger': {
      const inp=document.createElement('input');
      inp.type='text'; inp.className='kratka-eq'; inp.id='eq-input'; inp.autocomplete='off';
      inp.placeholder=m1Phase===1?'Zapisz równanie...':'Uprość lewą stronę...';
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkM1();});
      row.appendChild(inp);
      break;
    }
  }
  // update hint text
  const hintEl=document.querySelector('.m1-hint');
  if(hintEl){
    hintEl.textContent=['percentXc','percentXbc','percentSmaller','percentBigger'].includes(schema)
      ?'Wpisz pełne równanie — spacje nie mają znaczenia.'
      :'Litery i cyfry — wąskie kratki; ułamek dziesiętny (np. 0,7) — szeroka kratka.';
  }
  // focus first kratka
  const first=row.querySelector('input'); if(first) first.focus();
}

function gn(id){
  const el=document.getElementById(id);
  if(!el)return NaN;
  return parseFloat(el.value.replace(',','.').trim());
}
function fmtDec(d){
  return String(Math.round(d*1000)/1000).replace('.',',');
}
function parseEqText(raw){
  const s=raw.replace(/\s+/g,'').replace(/−/g,'-').replace(/–/g,'-');
  const n='\\d+[,.]?\\d*';
  // form 2: {dec}{ltr}={num}   e.g. 0,7x=15
  const m2=s.match(new RegExp('^('+n+')([a-zA-Z])=('+n+')$'));
  if(m2)return{type:2,dec:parseFloat(m2[1].replace(',','.')),ltr:m2[2].toLowerCase(),c:parseFloat(m2[3].replace(',','.'))};
  // form 1: {ltr}[+-][opt: dec]{ltr}={num}  e.g. x-0,3x=15 or x+x=6 (coeff 1 omitted)
  const m1=s.match(new RegExp('^([a-zA-Z])([+\\-])('+n+')?([a-zA-Z])=('+n+')$'));
  if(m1)return{type:1,ltr1:m1[1].toLowerCase(),sign:m1[2],dec:m1[3]?parseFloat(m1[3].replace(',','.')):1,ltr2:m1[4].toLowerCase(),c:parseFloat(m1[5].replace(',','.'))};
  // form 3: {dec}{ltr}[+-]{num}={num}  e.g. 0,25k-5=1
  const m3=s.match(new RegExp('^('+n+')([a-zA-Z])([+\\-])('+n+')=('+n+')$'));
  if(m3)return{type:3,dec:parseFloat(m3[1].replace(',','.')),ltr:m3[2].toLowerCase(),sign:m3[3],b:parseFloat(m3[4].replace(',','.')),c:parseFloat(m3[5].replace(',','.'))};
  return null;
}

function nextM1(){
  clearTimeout(_adv);
  m1Phase=1;
  const pool=M1_POOLS[m1Level-1];
  m1Cur=pool[randInt(0,pool.length-1)]();
  m1Locked=false;
  document.getElementById('m1-sentence').textContent=m1Cur.s;
  document.getElementById('m1-qbox').classList.remove('step2');
  document.getElementById('m1-qlabel').textContent='Zapisz jako równanie';
  document.getElementById('m1-fb').className='feedback';
  document.getElementById('m1-next').style.display='none';
  renderM1Input(m1Cur.schema);
  startTimer('m1-timer');
}

function checkM1(){
  if(m1Locked)return;
  const {schema,exp}=m1Cur;
  const expLtr=(exp.letter||'x').toLowerCase();

  // two-step schemas (percentSmaller / percentBigger) — free text input
  if(schema==='percentSmaller'||schema==='percentBigger'){
    const inpEl=document.getElementById('eq-input');
    if(!inpEl||inpEl.value.trim()===''){
      document.getElementById('m1-fb').textContent='Wpisz równanie!';
      document.getElementById('m1-fb').className='feedback bad'; return;
    }
    const parsed=parseEqText(inpEl.value);
    const expectedSign=schema==='percentSmaller'?'-':'+';
    const signStr=schema==='percentSmaller'?'−':'+';
    const coeff1str=exp.p/100===1?'':fmtDec(exp.p/100);
    const hintBoth=`np. ${expLtr} ${signStr} ${coeff1str}${expLtr} = ${exp.c}  lub  ${fmtDec(exp.p_eff)}${expLtr} = ${exp.c}`;
    const hintStep2=`${fmtDec(exp.p_eff)}${expLtr} = ${exp.c}`;

    const lockAndResult=(ok)=>{
      m1Locked=true; m1Tot++;
      stopTimer('m1-timer'); inpEl.disabled=true;
      if(ok){
        m1Cor++;
        document.getElementById('m1-score').textContent=`${m1Cor} / ${m1Tot}`;
        document.getElementById('m1-fb').textContent='✓ Poprawnie!';
        document.getElementById('m1-fb').className='feedback good';
        playCorrectAnim('m1-anim',nextM1);
      }else{
        document.getElementById('m1-score').textContent=`${m1Cor} / ${m1Tot}`;
        document.getElementById('m1-fb').innerHTML=`✗ Niepoprawnie<span class="fb-hint">Poprawna odpowiedź: ${hintStep2}</span>`;
        document.getElementById('m1-fb').className='feedback bad';
        playWrongAnim('m1-anim',()=>{document.getElementById('m1-next').style.display='';});
      }
    };

    if(m1Phase===1){
      // check step2 form (direct shortcut)
      if(parsed&&parsed.type===2){
        const ok=Math.abs(parsed.dec-exp.p_eff)<0.001&&parsed.ltr===expLtr&&Math.abs(parsed.c-exp.c)<0.001;
        lockAndResult(ok); return;
      }
      // check step1 form
      if(parsed&&parsed.type===1){
        const ok1=parsed.ltr1===expLtr&&parsed.sign===expectedSign
          &&Math.abs(parsed.dec-exp.p/100)<0.001&&parsed.ltr2===expLtr&&Math.abs(parsed.c-exp.c)<0.001;
        if(ok1){
          const userEq=inpEl.value.trim();
          m1Phase=2; renderM1Input(schema);
          document.getElementById('m1-qbox').classList.add('step2');
          document.getElementById('m1-qlabel').textContent='Krok 1:';
          document.getElementById('m1-sentence').textContent=userEq;
          document.getElementById('m1-fb').textContent='Poprawnie! Teraz uprość lewą stronę.';
          document.getElementById('m1-fb').className='feedback step';
          return;
        }
      }
      // wrong — don't lock, allow retry
      document.getElementById('m1-fb').innerHTML=`✗ Niepoprawnie<span class="fb-hint">${hintBoth}</span>`;
      document.getElementById('m1-fb').className='feedback bad'; return;
    }else{
      // phase 2: check step2 form
      const ok2=parsed&&parsed.type===2&&Math.abs(parsed.dec-exp.p_eff)<0.001&&parsed.ltr===expLtr&&Math.abs(parsed.c-exp.c)<0.001;
      lockAndResult(ok2); return;
    }
  }

  // empty check
  const inputs=[...document.querySelectorAll('#m1-input-row input')];
  if(inputs.some(i=>i.value.trim()==='')){
    const fb=document.getElementById('m1-fb');
    const isEqSchema=['percentXc','percentXbc'].includes(schema);
    fb.textContent=isEqSchema?'Wpisz równanie!':'Wypełnij wszystkie kratki!';
    fb.className='feedback bad'; return;
  }

  const ltrEl2=document.getElementById('ltr');
  const ltrOk=ltrEl2&&ltrEl2.value.trim().toLowerCase()===expLtr;

  const sc=s=>(s==='+'?'+':'−');
  let ok=false, hint='';
  if(schema==='xbc'){
    const b=gn('b1'),c=gn('b2');
    const normalOk=ltrOk&&m1Sign===exp.sign&&b===exp.b&&c===exp.c;
    const commOk=exp.sign==='+'&&m1Sign==='+'
      &&document.getElementById('ltr').value.trim()===String(exp.b)
      &&document.getElementById('b1').value.trim().toLowerCase()===expLtr
      &&c===exp.c;
    ok=normalOk||commOk;
    hint=`${expLtr} ${sc(exp.sign)} ${exp.b} = ${exp.c}`;
  }else if(schema==='axc'){
    const a=gn('b1'),c=gn('b2');
    ok=ltrOk&&a===exp.a&&c===exp.c;
    hint=`${exp.a}${expLtr} = ${exp.c}`;
  }else if(schema==='axbc'){
    const a=gn('b1'),b=gn('b2'),c=gn('b3');
    ok=ltrOk&&a===exp.a&&m1Sign===exp.sign&&b===exp.b&&c===exp.c;
    hint=`${exp.a}${expLtr} ${sc(exp.sign)} ${exp.b} = ${exp.c}`;
  }else if(schema==='fracxc'){
    const num=gn('b1'),den=gn('b2'),c=gn('b3');
    ok=ltrOk&&den>0&&Math.abs(num*exp.den-den*exp.num)<0.001&&c===exp.c;
    hint=`${exp.num}/${exp.den}·${expLtr} = ${exp.c}`;
  }else if(schema==='fracxbc'){
    const num=gn('b1'),den=gn('b2'),b=gn('b3'),c=gn('b4');
    const fracOk=den>0&&Math.abs(num*exp.den-den*exp.num)<0.001;
    ok=ltrOk&&fracOk&&m1Sign===exp.sign&&b===exp.b&&c===exp.c;
    hint=`${exp.num}/${exp.den}·${expLtr} ${sc(exp.sign)} ${exp.b} = ${exp.c}`;
  }else if(schema==='aparenbc'){
    const a=gn('b1'),b=gn('b2'),c=gn('b3');
    ok=ltrOk&&a===exp.a&&m1Sign===exp.sign&&b===exp.b&&c===exp.c;
    hint=`${exp.a}(${expLtr} ${sc(exp.sign)} ${exp.b}) = ${exp.c}`;
  }else if(schema==='bcxc'){
    const b=gn('b1'),c=gn('b2');
    const normalOk=ltrOk&&b===exp.b&&m1Sign===exp.sign&&c===exp.c;
    const commOk=exp.sign==='+'&&m1Sign==='+'
      &&document.getElementById('ltr').value.trim()===String(exp.b)
      &&document.getElementById('b1').value.trim().toLowerCase()===expLtr
      &&c===exp.c;
    ok=normalOk||commOk;
    hint=`${exp.b} ${sc(exp.sign)} ${expLtr} = ${exp.c}`;
  }else if(schema==='bDivLtrc'){
    const b=gn('b1'),c=gn('b2');
    ok=ltrOk&&b===exp.b&&c===exp.c;
    hint=`${exp.b}/${expLtr} = ${exp.c}`;
  }else if(schema==='ltrPow2c'){
    const c=gn('b1'),pow=document.getElementById('pow').value.trim();
    ok=ltrOk&&pow==='2'&&c===exp.c;
    hint=`${expLtr}² = ${exp.c}`;
  }else if(schema==='ltrPow3c'){
    const c=gn('b1'),pow=document.getElementById('pow').value.trim();
    ok=ltrOk&&pow==='3'&&c===exp.c;
    hint=`${expLtr}³ = ${exp.c}`;
  }else if(schema==='ltrParenPow2c'){
    const b=gn('b1'),c=gn('b2'),pow=document.getElementById('pow').value.trim();
    ok=ltrOk&&pow==='2'&&m1Sign===exp.sign&&b===exp.b&&c===exp.c;
    hint=`(${expLtr} ${sc(exp.sign)} ${exp.b})² = ${exp.c}`;
  }else if(schema==='ltrParenPow3c'){
    const b=gn('b1'),c=gn('b2'),pow=document.getElementById('pow').value.trim();
    ok=ltrOk&&pow==='3'&&m1Sign===exp.sign&&b===exp.b&&c===exp.c;
    hint=`(${expLtr} ${sc(exp.sign)} ${exp.b})³ = ${exp.c}`;
  }else if(schema==='ltrPow2SignBc'){
    const b=gn('b1'),c=gn('b2'),pow=document.getElementById('pow').value.trim();
    ok=ltrOk&&pow==='2'&&m1Sign===exp.sign&&b===exp.b&&c===exp.c;
    hint=`${expLtr}² ${sc(exp.sign)} ${exp.b} = ${exp.c}`;
  }else if(schema==='aLtrPow3PlusBc'){
    const a=gn('b1'),b=gn('b2'),c=gn('b3'),pow=document.getElementById('pow').value.trim();
    ok=ltrOk&&pow==='3'&&a===exp.a&&b===exp.b&&c===exp.c;
    hint=`${exp.a}(${expLtr}³ + ${exp.b}) = ${exp.c}`;
  }else if(schema==='axbDivDc'){
    const a=gn('b1'),b=gn('b2'),d=gn('b3'),c=gn('b4');
    ok=ltrOk&&a===exp.a&&m1Sign===exp.sign&&b===exp.b&&d===exp.d&&c===exp.c;
    hint=`(${exp.a}${expLtr} ${sc(exp.sign)} ${exp.b}) / ${exp.d} = ${exp.c}`;
  }else if(schema==='percentXc'){
    const p=parseEqText(document.getElementById('eq-input').value);
    const expDec=exp.p/100;
    ok=p&&p.type===2&&Math.abs(p.dec-expDec)<0.001&&p.ltr===expLtr&&Math.abs(p.c-exp.c)<0.001;
    hint=`${fmtDec(expDec)}${expLtr} = ${exp.c}`;
  }else if(schema==='percentXbc'){
    const p=parseEqText(document.getElementById('eq-input').value);
    const expDec=exp.p/100;
    ok=p&&p.type===3&&Math.abs(p.dec-expDec)<0.001&&p.ltr===expLtr&&p.sign===exp.sign&&Math.abs(p.b-exp.b)<0.001&&Math.abs(p.c-exp.c)<0.001;
    hint=`${fmtDec(expDec)}${expLtr} ${sc(exp.sign)} ${exp.b} = ${exp.c}`;
  }

  m1Locked=true; m1Tot++;
  stopTimer('m1-timer');
  inputs.forEach(i=>i.disabled=true);
  document.querySelectorAll('#m1-input-row .sign-btn').forEach(b=>b.disabled=true);

  if(ok){
    m1Cor++;
    document.getElementById('m1-score').textContent=`${m1Cor} / ${m1Tot}`;
    document.getElementById('m1-fb').textContent='✓ Poprawnie!';
    document.getElementById('m1-fb').className='feedback good';
    playCorrectAnim('m1-anim',nextM1);
  }else{
    document.getElementById('m1-score').textContent=`${m1Cor} / ${m1Tot}`;
    document.getElementById('m1-fb').innerHTML=`✗ Niepoprawnie<span class="fb-hint">Poprawna odpowiedź: ${hint}</span>`;
    document.getElementById('m1-fb').className='feedback bad';
    playWrongAnim('m1-anim',()=>{document.getElementById('m1-next').style.display='';});
  }
}

let m2Cor=0,m2Tot=0,m2Sol=null,m2Level=1,m2Mode='normal',m2Diff=null,m2Cdv=null,m2CdvLeft=0;
const EQ_GEN=[
  ()=>{const a=randInt(2,6),x=randInt(1,12);return{d:`${a}x = ${a*x}`,sol:x};},
  ()=>{const b=randInt(2,20),x=randInt(1,20);return{d:`x + ${b} = ${x+b}`,sol:x};},
  ()=>{const b=randInt(2,15),x=randInt(b+1,30);return{d:`x − ${b} = ${x-b}`,sol:x};},
  ()=>{const a=randInt(2,4),b=randInt(1,10),x=randInt(1,10);return{d:`${a}x + ${b} = ${a*x+b}`,sol:x};},
  ()=>{const a=randInt(2,4),b=randInt(1,10),x=randInt(2,10);const c=a*x-b;if(c<1)return EQ_GEN[4]();return{d:`${a}x − ${b} = ${c}`,sol:x};},
];

const fracHtml=(n,d)=>`<span class="eq-frac"><span class="eq-frac-num">${n}</span><span class="eq-frac-den">${d}</span></span>`;
const EQ_GEN_LV2=[
  // Ułamek: (ax−b)/c + d = e − fx
  ()=>{
    const sol=randInt(2,9),c=pick([2,3,4,5,7]),a=randInt(1,4),f=randInt(1,3),d=randInt(1,5);
    const b=(a*sol)%c,numVal=(a*sol-b)/c,lhsVal=numVal+d,e=lhsVal+f*sol;
    if(e>50||e<f*sol+2)return EQ_GEN_LV2[0]();
    const numStr=b===0?`${a}x`:`${a}x − ${b}`;
    const fxStr=f===1?`x`:`${f}x`;
    return{d:`${fracHtml(numStr,c)} + ${d} = ${e} − ${fxStr}`,sol,isHtml:true};
  },
  // Ułamek: (ax+b)/c − d = fx − e
  ()=>{
    const sol=randInt(3,10),c=pick([2,3,5,6]),a=randInt(1,4),f=randInt(1,3),d=randInt(1,4);
    const rem=(a*sol)%c,b=rem===0?0:c-rem,numVal=(a*sol+b)/c,lhsVal=numVal-d;
    if(lhsVal<=0)return EQ_GEN_LV2[1]();
    const e=f*sol-lhsVal;
    if(e<0||e>50)return EQ_GEN_LV2[1]();
    const numStr=b===0?`${a}x`:`${a}x + ${b}`;
    const fxStr=f===1?`x`:`${f}x`;
    return{d:`${fracHtml(numStr,c)} − ${d} = ${fxStr} − ${e}`,sol,isHtml:true};
  },
  // Ułamek prosty: (ax−b)/c = fx + e
  ()=>{
    const sol=randInt(2,10),c=pick([2,3,4,5,6]),a=randInt(c+1,4*c),f=randInt(1,3);
    const b=(a*sol)%c,numVal=(a*sol-b)/c,e=numVal-f*sol;
    if(e<=0)return EQ_GEN_LV2[2]();
    const numStr=b===0?`${a}x`:`${a}x − ${b}`;
    const fxStr=f===1?`x`:`${f}x`;
    return{d:`${fracHtml(numStr,c)} = ${fxStr} + ${e}`,sol,isHtml:true};
  },
  // Nawiasy: (x+a)(x+b) = c  (drugi pierwiastek < 0)
  ()=>{
    const sol=randInt(2,9),a=randInt(1,6),b=randInt(1,6),c=(sol+a)*(sol+b);
    return{d:`(x + ${a})(x + ${b}) = ${c}`,sol,isHtml:false};
  },
  // Nawiasy: (2x+a)(x+b) = c  (drugi pierwiastek < 0)
  ()=>{
    const sol=randInt(2,8),a=randInt(1,6),b=randInt(1,5),c=(2*sol+a)*(sol+b);
    return{d:`(2x + ${a})(x + ${b}) = ${c}`,sol,isHtml:false};
  },
];

function setM2Level(lv){
  m2Level=lv;
  document.querySelectorAll('#m2-lv-row .lv-btn').forEach((b,i)=>b.classList.toggle('active',i+1===lv));
  nextM2();
}

function setM2Mode(mode){
  m2Mode=mode;
  stopCountdownM2();
  document.getElementById('m2-btn-normal').classList.toggle('active',mode==='normal');
  document.getElementById('m2-btn-challenge').classList.toggle('active',mode==='challenge');
  if(mode==='normal'){
    document.getElementById('m2-diff-panel').style.display='none';
    document.getElementById('m2-game-panel').style.display='';
    document.getElementById('m2-timer-label').textContent='Czas';
    document.getElementById('m2-timer-box').className='stat-box timer-box';
    document.getElementById('m2-change-diff').style.display='none';
    m2Diff=null; nextM2();
  } else {
    document.getElementById('m2-game-panel').style.display='none';
    document.getElementById('m2-diff-panel').style.display='';
  }
}

function m2SelectDiff(secs){
  m2Diff=secs; m2Cor=0; m2Tot=0;
  document.getElementById('m2-score').textContent='0 / 0';
  document.getElementById('m2-diff-panel').style.display='none';
  document.getElementById('m2-game-panel').style.display='';
  document.getElementById('m2-timer-label').textContent='Pozostały czas';
  document.getElementById('m2-change-diff').style.display='';
  nextM2();
}

function m2ChangeDiff(){
  stopCountdownM2();
  document.getElementById('m2-game-panel').style.display='none';
  document.getElementById('m2-diff-panel').style.display='';
}

function startCountdownM2(){
  m2CdvLeft=m2Diff;
  _updateCdvDisplay();
  m2Cdv=setInterval(()=>{
    m2CdvLeft--;
    _updateCdvDisplay();
    if(m2CdvLeft<=0) timeUpM2();
  },1000);
}

function stopCountdownM2(){
  clearInterval(m2Cdv); m2Cdv=null;
  const box=document.getElementById('m2-timer-box');
  if(box) box.className='stat-box timer-box';
}

function _updateCdvDisplay(){
  document.getElementById('m2-timer').textContent=`${m2CdvLeft} s`;
  const ratio=m2Diff>0?m2CdvLeft/m2Diff:1;
  document.getElementById('m2-timer-box').className='stat-box timer-box'+(ratio<=0.2?' danger':ratio<=0.5?' warn':'');
}

function timeUpM2(){
  stopCountdownM2();
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  m2Tot++;
  document.getElementById('m2-score').textContent=`${m2Cor} / ${m2Tot}`;
  document.getElementById('m2-fb').textContent=`⏰ Czas minął! Poprawna odpowiedź: x = ${m2Sol}`;
  document.getElementById('m2-fb').className='feedback bad';
  playWrongAnim('m2-anim',nextM2);
}

function nextM2(){
  clearTimeout(_adv);
  stopCountdownM2();
  stopTimer('m2-timer');
  const pool=m2Level===2?EQ_GEN_LV2:EQ_GEN;
  const eq=pool[randInt(0,pool.length-1)]();
  m2Sol=eq.sol;
  const eqEl=document.getElementById('m2-eq');
  if(eq.isHtml)eqEl.innerHTML=eq.d; else eqEl.textContent=eq.d;
  document.getElementById('m2-fb').className='feedback';
  document.getElementById('m2-fb').textContent='';
  document.getElementById('m2-next').style.display='none';
  const used=new Set([m2Sol]),opts=[m2Sol];
  while(opts.length<4){const w=m2Sol+randInt(-10,10);if(w>0&&!used.has(w)){used.add(w);opts.push(w);}}
  shuffle(opts);
  const cont=document.getElementById('m2-choices'); cont.innerHTML='';
  opts.forEach(v=>{
    const btn=document.createElement('button');
    btn.className='choice-btn'; btn.textContent=`x = ${v}`;
    btn.onclick=()=>pickM2(v,btn); cont.appendChild(btn);
  });
  if(m2Mode==='challenge') startCountdownM2();
  else startTimer('m2-timer');
}

function pickM2(val,btn){
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  if(m2Mode==='challenge') stopCountdownM2(); else stopTimer('m2-timer');
  m2Tot++;
  if(val===m2Sol){
    m2Cor++;
    document.getElementById('m2-score').textContent=`${m2Cor} / ${m2Tot}`;
    btn.classList.add('correct');
    document.getElementById('m2-fb').textContent='✓ Poprawnie!';
    document.getElementById('m2-fb').className='feedback good';
    playCorrectAnim('m2-anim',nextM2);
  }else{
    document.getElementById('m2-score').textContent=`${m2Cor} / ${m2Tot}`;
    btn.classList.add('wrong');
    document.querySelectorAll('.choice-btn').forEach(b=>{
      if(+b.textContent.replace('x = ','')===m2Sol)b.classList.add('correct');
    });
    document.getElementById('m2-fb').textContent=`✗ Błąd. Poprawna odpowiedź: x = ${m2Sol}`;
    document.getElementById('m2-fb').className='feedback bad';
    if(m2Mode==='challenge') playWrongAnim('m2-anim',nextM2);
    else playWrongAnim('m2-anim',()=>{document.getElementById('m2-next').style.display='';});
  }
}

let m3Cor=0,m3Tot=0,m3Eq=null,m3Step=0,m3TotalSteps=0;
let m3Phase='WAIT',m3Sel=null,m3OpSel=null,m3OpVal=null,m3ExpEq=null,m3Level=1,m3ChoiceMethod=null,m3TranspSel={},m3TranspRaw=null,m3TranspUserInput=null,m3LrmTranspRaw=null;
let m3AnsSign=1,m3FracSubStep=null;
let m3History=[];
let m3LrmSel=[], m3LrmChipGrp=[];
let m6FracDone=[],m6SelSet=new Set(),m6FillMode=false,m6ResultValidAnswers=null;

// Lv1: 1-step — {a, b, c, xDiv}
const EQ3_LV1=[
  ()=>{const a=randInt(2,7),x=randInt(2,15);return{a,b:0,c:a*x,xDiv:1};},
  ()=>{const a=randInt(6,12),x=randInt(2,10);return{a,b:0,c:a*x,xDiv:1};},
  ()=>{const b=randInt(2,18),x=randInt(2,20);return{a:1,b,c:x+b,xDiv:1};},
  ()=>{const b=randInt(2,15),x=randInt(2,20);return{a:1,b:-b,c:x-b,xDiv:1};},
  ()=>{const d=pick([2,3,4,5,6,7,8,10]),x=randInt(2,15);return{a:1,b:0,c:x,xDiv:d};},
  ()=>{const b=randInt(5,15),xN=randInt(1,10);return{a:1,b,c:b-xN,xDiv:1};},
  ()=>{const b=randInt(5,15),xN=randInt(1,8);return{a:1,b:-b,c:-xN-b,xDiv:1};},
  ()=>{const a=pick([2,3,4,5,6]);const c=randInt(2,20);if(c%a===0)return EQ3_LV1[7]();return{a,b:0,c,xDiv:1};},
  ()=>{const a=pick([3,4,5,7]);const c=randInt(3,30);if(c%a===0)return EQ3_LV1[8]();return{a,b:0,c,xDiv:1};},
  ()=>{const d=pick([3,4,5,6,8,9,10,12]),x=randInt(2,10);return{a:1,b:0,c:x,xDiv:d};},
  // negative coefficient -ax = c (integer negative answer)
  ()=>{const a=pick([2,3,4,5,6]);const x=randInt(2,12);return{a:-a,b:0,c:a*x,xDiv:1};},
  // negative coefficient -ax = c (fraction answer)
  ()=>{const a=pick([3,4,5,7]);const c=randInt(2,25);if(c%a===0)return EQ3_LV1[10]();return{a:-a,b:0,c,xDiv:1};},
  // x + b = c where c < b (negative answer)
  ()=>{const b=randInt(3,15),x=randInt(2,12);return{a:1,b,c:b-x,xDiv:1};},
  // x/d = negative c
  ()=>{const d=pick([2,3,4,5]);const x=randInt(2,10);return{a:1,b:0,c:-x,xDiv:d};},
];

// Lv2: 2-step — ax+b=c (b≠0, a≥2)
const EQ3_LV2=[
  ()=>{const a=randInt(2,6),x=randInt(2,12),b=randInt(2,14);return{a,b,c:a*x+b,xDiv:1};},
  ()=>{const a=randInt(2,6),x=randInt(2,12),b=randInt(2,14);return{a,b:-b,c:a*x-b,xDiv:1};},
  ()=>{const a=randInt(2,5),x=randInt(-9,-1),b=randInt(3,14);return{a,b,c:a*x+b,xDiv:1};},
  ()=>{const a=randInt(2,5),x=randInt(-8,-1),b=randInt(3,10);return{a,b:-b,c:a*x-b,xDiv:1};},
  ()=>{const a=pick([2,3,4,5]);const b=randInt(1,12);const c=b+randInt(2,a*8+1);if((c-b)%a===0)return EQ3_LV2[4]();return{a,b,c,xDiv:1};},
  ()=>{const a=pick([2,3,4,5]);const b=randInt(2,10);const c=randInt(2,a*8+b);if((c+b)%a===0)return EQ3_LV2[5]();return{a,b:-b,c,xDiv:1};},

  ()=>{

// ── Lv6 helpers & equations ─────────────────────────────────────────────────
function m6FracNum(a,b){
  if(a>0)return fmtSum(a,b);
  if(a<0&&b>0)return String(b)+(a===-1?'-x':`${a}x`);
  if(a===0)return String(b);
  return fmtSum(a,b);
}
function m6TermHtml(t,done,lcd){
  if(done){
    const m=lcd/t.d,ea=t.a*m,eb=t.b*m;
    if(ea===0)return fracHtml(String(eb),lcd);
    if(eb===0)return fracHtml(fmtSum(ea,0),lcd);
    return fracHtml(m6FracNum(ea,eb),lcd);
  }
  if(t.d===1)return t.a!==0?fmtSum(t.a,t.b||0):String(t.b);
  return fracHtml(m6FracNum(t.a,t.b),t.d);
}
function m6ValidNumerForms(ea,eb){
  const set=new Set();
  const xa=ea===0?'':(ea===1?'x':ea===-1?'-x':`${ea}x`);
  if(ea!==0&&eb!==0){
    const xbSign=eb>0?`+${eb}`:String(eb);
    const xbFirst=String(eb);
    const xaAfter=ea>0?(ea===1?'+x':`+${ea}x`):(ea===-1?'-x':`${ea}x`);
    set.add(normIn(xa+xbSign));
    set.add(normIn(xbFirst+xaAfter));
  }else if(ea!==0){set.add(normIn(xa));}
  else{set.add(normIn(String(eb)));}
  return set;
}
function m6ValidAnswersSet(resultEq){
  const fmt=(v,first,x)=>{if(v===0)return'';const a=Math.abs(v);const part=x?(a===1?'x':`${a}x`):String(a);return(v>0?(first?'':'+'):'-')+part;};
  const bld=ts=>{let o='',f=true;for(const t of ts){const k=fmt(t.c,f,t.x);if(k){o+=k;f=false;}}return o||'0';};
  const perms=arr=>{if(arr.length<=1)return[arr.slice()];const r=[];for(let i=0;i<arr.length;i++){const rest=[...arr.slice(0,i),...arr.slice(i+1)];for(const p of perms(rest))r.push([arr[i],...p]);}return r;};
  const set=new Set();
  const eqToTerms=eq=>{const lt=[],rt=[];
    if(eq.type==='LRM'){lt.push(...eq.lTerms);rt.push(...eq.rTerms);}
    else if(eq.type==='LR'){const{lA,lB,rA,rB}=eq;if(lA)lt.push({c:lA,x:true});if(lB)lt.push({c:lB,x:false});if(rA)rt.push({c:rA,x:true});if(rB)rt.push({c:rB,x:false});}
    else{const{a,b,c}=eq;if(a)lt.push({c:a,x:true});if(b)lt.push({c:b,x:false});rt.push({c,x:false});}
    return{lt,rt};};
  const addPerms=eq=>{const{lt,rt}=eqToTerms(eq);for(const lp of perms(lt))for(const rp of perms(rt))set.add(normIn(bld(lp)+'='+bld(rp)));};
  addPerms(resultEq);
  if(resultEq.type==='LRM')addPerms(resultEq.simplified);
  return set;
}
function buildL6(lT,rT,lcd){
  const expand=ts=>{const res=[];for(const t of ts){const m=lcd/t.d;if(t.a*m)res.push({c:t.a*m,x:true});if(t.b*m)res.push({c:t.b*m,x:false});}return res;};
  const lE=expand(lT),rE=expand(rT);
  const lA=lE.filter(t=>t.x).reduce((s,t)=>s+t.c,0);
  const lB=lE.filter(t=>!t.x).reduce((s,t)=>s+t.c,0);
