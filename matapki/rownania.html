        if(firstSel!==undefined){const inp=document.getElementById(`m6-inp-${firstSel}`);if(inp)inp.focus();}
      }
      return;
    }

    if(m3Phase==='L6_MULTIPLY'){
      const chipHtml=(t,i)=>`<span class="m3-term-static">${m6FracDone[i]?mkLcdTermHtml(t):m6TermHtml(t,false,lcd)}</span>`;
      let lStr='',rStr='';
      m3Eq.lTerms.forEach((t,i)=>{if(i>0)lStr+=`<span class="m3-sep">+</span>`;lStr+=chipHtml(t,i);});
      m3Eq.rTerms.forEach((t,j)=>{if(j>0)rStr+=`<span class="m3-sep">+</span>`;rStr+=chipHtml(t,m3Eq.lTerms.length+j);});
      area.innerHTML=badge+`<div class="m3-eq-row" style="flex-wrap:nowrap;overflow-x:auto;font-size:clamp(0.8rem,3.2vw,1.25rem)">${lStr}<span class="m3-sep">=</span>${rStr}<span class="m3-bar">|</span>${signInputs}</div><div class="m3-hint">Pomnóż obie strony przez LCD = ${lcd}, żeby usunąć mianowniki</div>`;
      showSign(); return;
    }

    if(m3Phase==='L6_TYPE_UNSIMPL'){
      const chipHtml=(t,i)=>`<span class="m3-term-static">${m6FracDone[i]?mkLcdTermHtml(t):m6TermHtml(t,false,lcd)}</span>`;
      let lStr='',rStr='';
      m3Eq.lTerms.forEach((t,i)=>{if(i>0)lStr+=`<span class="m3-sep">+</span>`;lStr+=chipHtml(t,i);});
      m3Eq.rTerms.forEach((t,j)=>{if(j>0)rStr+=`<span class="m3-sep">+</span>`;rStr+=chipHtml(t,m3Eq.lTerms.length+j);});
      area.innerHTML=badge+`<div class="m3-eq-row" style="flex-wrap:nowrap;overflow-x:auto;font-size:clamp(0.8rem,3.2vw,1.25rem)">${lStr}<span class="m3-sep">=</span>${rStr}<span class="m3-bar">|</span><span class="m3-op">× ${lcd}</span></div><div class="m3-hint">Wpisz wynik mnożenia (może być nieuproszczona, np. x+2+3x-3=9)</div>`;
      showType(); return;
    }
  }

  // ── L3F / L4F: (ax+b)/d = c or ex+f ──────────────────────────────────────
  if(m3Eq.type==='L3F'||m3Eq.type==='L4F'){
    const{a,b,d,e,f,c}=m3Eq;
    const numHtml=fracHtml(fmtSum(a,b),d);
    const rhsStr=m3Eq.type==='L4F'?fmtSum(e,f):String(c);
    if(m3Phase==='PICK'){
      area.innerHTML=badge+`<div class="m3-eq-row"><button class="m3-term-btn" onclick="m3click('frac')">${numHtml}</button><span class="m3-sep">=</span><span class="m3-rhs">${rhsStr}</span></div><div class="m3-hint">Kliknij ułamek, żeby go wyeliminować</div>`;
      return;
    }
    if(m3Phase==='CHOOSE'){
      area.innerHTML=badge+`<div class="m3-eq-row"><span class="m3-term-sel">${numHtml}</span><span class="m3-sep">=</span><span class="m3-rhs">${rhsStr}</span></div><div class="m3-choice-row"><button class="m3-choice-action" onclick="m3choose('simplify')">Podziel sumę przez mianownik</button><button class="m3-choice-action" onclick="m3choose('elim')">Pozbądź się mianownika</button></div>`;
      return;
    }
    if(m3Phase==='SIGN'){
      area.innerHTML=badge+`<div class="m3-eq-row"><span class="m3-term-sel">${numHtml}</span><span class="m3-sep">=</span><span class="m3-rhs">${rhsStr}</span><span class="m3-bar">|</span>${signInputs}</div><div class="m3-hint">Kliknij znak, żeby zmienić, wpisz liczbę</div>`;
      showSign(); return;
    }
    if(m3Phase==='TYPE'){
      const opDisp=m3OpSel==='·'?`× ${m3OpVal}`:`÷ ${m3OpVal}`;
      const hint=m3ExpEq&&m3ExpEq.type==='LR'?'Wpisz wynik nowego równania (np. 2x+1=x+5)':'Wpisz wynik nowego równania (np. 2x+3=11)';
      const opPart=m3ChoiceMethod==='simplify'?'':`<span class="m3-bar">|</span><span class="m3-op">${opDisp}</span>`;
      area.innerHTML=badge+`<div class="m3-eq-row"><span class="m3-term-sel">${numHtml}</span><span class="m3-sep">=</span><span class="m3-rhs">${rhsStr}</span>${opPart}</div><div class="m3-hint">${hint}</div>`;
      showType(); return;
    }
  }

  // ── L3M / L4M: k(ax+b) = c or ex+f ───────────────────────────────────────
  if(m3Eq.type==='L3M'||m3Eq.type==='L4M'){
    const{k,a,b,e,f,c}=m3Eq;
    const sumHtml=`(${fmtSum(a,b)})`;
    const rhsStr=m3Eq.type==='L4M'?fmtSum(e,f):String(c);
    if(m3Phase==='PICK'){
      area.innerHTML=badge+`<div class="m3-eq-row"><button class="m3-term-btn" onclick="m3click('mul')">${k}</button><span class="m3-term-static">${sumHtml}</span><span class="m3-sep">=</span><span class="m3-rhs">${rhsStr}</span></div><div class="m3-hint">Kliknij liczbę przed nawiasem</div>`;
      return;
    }
    if(m3Phase==='CHOOSE'){
      area.innerHTML=badge+`<div class="m3-eq-row"><span class="m3-term-sel">${k}</span><span class="m3-term-static">${sumHtml}</span><span class="m3-sep">=</span><span class="m3-rhs">${rhsStr}</span></div><div class="m3-choice-row"><button class="m3-choice-action" onclick="m3choose('expand')">Pomnóż nawias przez liczbę</button><button class="m3-choice-action" onclick="m3choose('elim')">Pozbądź się liczby sprzed nawiasu</button></div>`;
      return;
    }
    if(m3Phase==='SIGN'){
      area.innerHTML=badge+`<div class="m3-eq-row"><span class="m3-term-sel">${k}</span><span class="m3-term-static">${sumHtml}</span><span class="m3-sep">=</span><span class="m3-rhs">${rhsStr}</span><span class="m3-bar">|</span>${signInputs}</div><div class="m3-hint">Kliknij znak, żeby zmienić, wpisz liczbę</div>`;
      showSign(); return;
    }
    if(m3Phase==='TYPE'){
      const opDisp=m3OpSel==='·'?`× ${m3OpVal}`:`÷ ${m3OpVal}`;
      const hint=m3ExpEq&&m3ExpEq.type==='LR'?'Wpisz wynik nowego równania (np. 2x+1=x+5)':'Wpisz wynik nowego równania (np. 2x+3=11)';
      const opPart=m3ChoiceMethod==='expand'?'':`<span class="m3-bar">|</span><span class="m3-op">${opDisp}</span>`;
      area.innerHTML=badge+`<div class="m3-eq-row"><span class="m3-term-sel">${k}</span><span class="m3-term-static">${sumHtml}</span><span class="m3-sep">=</span><span class="m3-rhs">${rhsStr}</span>${opPart}</div><div class="m3-hint">${hint}</div>`;
      showType(); return;
    }
  }

  // ── LRM: multi-term both sides (Lv3) ─────────────────────────────────────────
  if(m3Eq.type==='LRM'){
    const lhs=fmtTerms(m3Eq.lTerms);
    const rhs=fmtTerms(m3Eq.rTerms);
    const ll=m3Eq.lTerms.length;

    // Helper: chips HTML for one side
    const mkChips=(terms,offset,forTransp)=>{
      let h='';
      terms.forEach((t,i)=>{
        const idx=offset+i;
        const abs=Math.abs(t.c);
        const part=t.x?(abs===1?'x':`${abs}x`):String(abs);
        if(i===0){if(t.c<0) h+='<span class="m3-sign-sep">−</span>';}
        else h+=`<span class="m3-sign-sep">${t.c<0?'−':'+'}</span>`;
        if(forTransp){
          const sel=m3LrmSel[idx]?' m3-transp-sel':'';
          h+=`<button id="m3-lrm-t${idx}" class="m3-term-btn${sel}" data-lrm-ti="${idx}" onclick="m3LRMToggleTerm(${idx})">${part}</button>`;
        } else {
          const grp=m3LrmChipGrp[idx];
          const cls='m3lrm-chip'+(grp>=0?' gc'+grp:'');
          h+=`<span class="${cls}" data-ci="${idx}" onclick="m3LRMChipCycle(${idx})">${part}</span>`;
        }
      });
      return h;
    };

    if(m3Phase==='PICK'){
      area.innerHTML=badge
        +`<div class="m3lrm-scroll"><div class="m3-eq-row"><span class="m3-term-static">${lhs}</span><span class="m3-sep">=</span><span class="m3-term-static">${rhs}</span></div></div>`
        +`<div class="m3-choice-row"><button class="m3-choice-action" onclick="m3LRMCombine()">Uprość obie strony</button><button class="m3-choice-action" onclick="m3LRMTransposeStart()">Przerzuć na drugą stronę</button></div>`;
      return;
    }
    if(m3Phase==='COMBINE'){
      const lC=mkChips(m3Eq.lTerms,0,false);
      const rC=mkChips(m3Eq.rTerms,ll,false);
      area.innerHTML=badge
        +`<div class="m3-eq-row m3lrm-chip-row">${lC}<span class="m3-sep">=</span>${rC}</div>`
        +`<p class="m3lrm-chip-hint">Kliknij wyraz, aby zmienić kolor — zaznacz wyrazy podobne</p>`
        +`<div class="m3-hint">Wpisz nowe równanie po uproszczeniu</div>`;
      showType(); return;
    }
    if(m3Phase==='LRM_TRANSPOSE'){
      const lT=mkChips(m3Eq.lTerms,0,true);
      const rT=mkChips(m3Eq.rTerms,ll,true);
      area.innerHTML=badge
        +`<div id="m3-lrm-tcont" style="position:relative;padding-top:170px">`
        +`<svg id="m3-lrm-tsvg" style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;pointer-events:none"></svg>`
        +`<div class="m3lrm-scroll"><div class="m3-eq-row" style="position:relative;z-index:1">${lT}<span class="m3-sep">=</span>${rT}</div></div>`
        +`</div>`
        +`<div class="m3-hint">Kliknij wyrazy do przerzucenia, potem zatwierdź</div>`
        +`<div style="text-align:center;margin-top:8px"><button class="m3-transp-apply" onclick="m3LRMApplyTranspose()">Zatwierdź →</button></div>`;
      drawLRMTranspArrows();
      return;
    }
    if(m3Phase==='TYPE'){
      if(m3ChoiceMethod==='lrm_transpose'){
        const mkSta=(terms,offset)=>{
          let h='';
          terms.forEach((t,i)=>{
            const idx=offset+i;
            const abs=Math.abs(t.c);
            const part=t.x?(abs===1?'x':`${abs}x`):String(abs);
            if(i===0){if(t.c<0)h+='<span class="m3-sign-sep">−</span>';}
            else h+=`<span class="m3-sign-sep">${t.c<0?'−':'+'}</span>`;
            const cls=m3LrmSel[idx]?'m3-term-btn m3-transp-sel':'m3-term-static';
            h+=`<span id="m3-lrm-t${idx}" class="${cls}">${part}</span>`;
          });
          return h;
        };
        const lS=mkSta(m3Eq.lTerms,0), rS=mkSta(m3Eq.rTerms,ll);
        area.innerHTML=badge
          +`<div id="m3-lrm-tcont" style="position:relative;padding-top:170px">`
          +`<svg id="m3-lrm-tsvg" style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;pointer-events:none"></svg>`
          +`<div class="m3lrm-scroll"><div class="m3-eq-row" style="position:relative;z-index:1">${lS}<span class="m3-sep">=</span>${rS}</div></div>`
          +`</div>`
          +`<div class="m3-hint">Wpisz wynik po przerzuceniu i uproszczeniu (np. 6x=12)</div>`;
        drawLRMTranspArrows();
        showType(); return;
      }
      if(m3ChoiceMethod==='lrm_transp_simplify'){
        area.innerHTML=badge
          +`<div class="m3lrm-scroll"><div class="m3-eq-row"><span class="m3-term-static">${m3TranspUserInput}</span></div></div>`
          +`<div class="m3-hint">Uprość obie strony i wpisz wynik (np. x=4)</div>`;
        showType(); return;
      }
      area.innerHTML=badge
        +`<div class="m3lrm-scroll"><div class="m3-eq-row"><span class="m3-term-static">${lhs}</span><span class="m3-sep">=</span><span class="m3-term-static">${rhs}</span></div></div>`
        +`<div class="m3-hint">Uprość obie strony i zapisz nowe równanie (np. 7x−4=5x+12)</div>`;
      showType(); return;
    }
  }

  // ── LR: lAx+lB = rAx+rB ──────────────────────────────────────────────────
  if(m3Eq.type==='LR'){
    const{lA,lB,rA,rB}=m3Eq;
    const lhsStr=fmtSum(lA,lB);

    if(m3Phase==='PICK'){
      area.innerHTML=badge+`<div class="m3-eq-row"><span class="m3-term-static">${lhsStr}</span><span class="m3-sep">=</span><span class="m3-term-static">${fmtSum(rA,rB)}</span></div><div class="m3-choice-row"><button class="m3-choice-action" onclick="m3LRChoose('transpose')">Przerzuć na drugą stronę</button><button class="m3-choice-action" onclick="m3LRChoose('equiv')">Równania równoważne</button></div>`;
      return;
    }
    if(m3Phase==='TRANSPOSE'){
      const sel=m3TranspSel;
      const lADisp=lA===1?'x':lA===-1?'-x':`${lA}x`;
      const lBDisp=String(lB);
      const rADisp=rA===1?'x':rA===-1?'-x':`${rA}x`;
      const rBDisp=String(rB);
      const bc=key=>sel[key]?' m3-transp-sel':'';
      const lBSignT=lB!==0?(lB>0?'+':'−'):'';
      const lBValT=String(Math.abs(lB));
      const rBSignT=rB!==0?(rB>0?'+':'−'):'';
      const rBValT=String(Math.abs(rB));
      area.innerHTML=badge
        +`<div id="m3-transp-cont" style="position:relative;padding-top:170px">`
        +`<svg id="m3-transp-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;pointer-events:none"></svg>`
        +`<div class="m3-eq-row" style="position:relative;z-index:1">`
        +`<button id="m3-tb-lA" class="m3-term-btn${bc('lA')}" onclick="m3ToggleTransp('lA')">${lADisp}</button>`
        +(lB!==0?`<span class="m3-sign-sep">${lBSignT}</span><button id="m3-tb-lB" class="m3-term-btn${bc('lB')}" onclick="m3ToggleTransp('lB')">${lBValT}</button>`:'')
        +`<span class="m3-sep">=</span>`
        +`<button id="m3-tb-rA" class="m3-term-btn${bc('rA')}" onclick="m3ToggleTransp('rA')">${rADisp}</button>`
        +(rB!==0?`<span class="m3-sign-sep">${rBSignT}</span><button id="m3-tb-rB" class="m3-term-btn${bc('rB')}" onclick="m3ToggleTransp('rB')">${rBValT}</button>`:'')
        +`</div></div>`
        +`<div class="m3-hint">Kliknij jednomiany do przerzucenia, potem zatwierdź</div>`
        +`<div style="text-align:center;margin-top:8px;position:relative;z-index:1"><button class="m3-transp-apply" onclick="m3ApplyTranspose()">Zatwierdź →</button></div>`;
      drawTranspArrows();
      return;
    }
    if(m3Phase==='LR_EQUIV'){
      const lAD=lA===1?'x':lA===-1?'-x':`${lA}x`;
      const rAD=rA===1?'x':rA===-1?'-x':`${rA}x`;
      let h=badge+'<div class="m3-eq-row">';
      if(lA!==0&&lB!==0){
        h+=`<button class="m3-term-btn" onclick="m3clickLREquiv('lA')">${lAD}</button>`;
        h+=`<span class="m3-sign-sep">${lB>0?'+':'−'}</span>`;
        h+=`<button class="m3-term-btn" onclick="m3clickLREquiv('lB')">${Math.abs(lB)}</button>`;
      } else if(lA!==0){
        h+=`<button class="m3-term-btn" onclick="m3clickLREquiv('lA')">${lAD}</button>`;
      } else if(lB!==0){
        h+=`<button class="m3-term-btn" onclick="m3clickLREquiv('lB')">${String(lB)}</button>`;
      }
      h+=`<span class="m3-sep">=</span>`;
      if(rA!==0&&rB!==0){
        h+=`<button class="m3-term-btn" onclick="m3clickLREquiv('rA')">${rAD}</button>`;
        h+=`<span class="m3-sign-sep">${rB>0?'+':'−'}</span>`;
        h+=`<button class="m3-term-btn" onclick="m3clickLREquiv('rB')">${Math.abs(rB)}</button>`;
      } else if(rA!==0){
        h+=`<button class="m3-term-btn" onclick="m3clickLREquiv('rA')">${rAD}</button>`;
      } else if(rB!==0){
        h+=`<button class="m3-term-btn" onclick="m3clickLREquiv('rB')">${String(rB)}</button>`;
      }
      h+=`</div><div class="m3-hint">Kliknij element do obustronnego działania</div>`;
      area.innerHTML=h; return;
    }
    if(m3Phase==='SIGN'){
      const lAD=lA===1?'x':lA===-1?'-x':`${lA}x`;
      const rAD=rA===1?'x':rA===-1?'-x':`${rA}x`;
      const mkT=(key,d)=>m3Sel===key?`<span class="m3-term-sel">${d}</span>`:`<span class="m3-term-static">${d}</span>`;
      let h=badge+'<div class="m3-eq-row">';
      if(lA!==0&&lB!==0){
        h+=mkT('lA',lAD);
        h+=`<span class="m3-sign-sep">${lB>0?'+':'−'}</span>`;
        h+=mkT('lB',String(Math.abs(lB)));
      } else if(lA!==0){ h+=mkT('lA',lAD);
      } else if(lB!==0){ h+=mkT('lB',String(lB)); }
      h+=`<span class="m3-sep">=</span>`;
      if(rA!==0&&rB!==0){
        h+=mkT('rA',rAD);
        h+=`<span class="m3-sign-sep">${rB>0?'+':'−'}</span>`;
        h+=mkT('rB',String(Math.abs(rB)));
      } else if(rA!==0){ h+=mkT('rA',rAD);
      } else if(rB!==0){ h+=mkT('rB',String(rB)); }
      h+=`<span class="m3-bar">|</span>${signInputs}</div><div class="m3-hint">Kliknij znak, żeby zmienić, wpisz liczbę</div>`;
      area.innerHTML=h; showSign(); return;
    }
    if(m3Phase==='TYPE'){
      const hint=m3ExpEq&&m3ExpEq.type==='LR'?'Wpisz wynik nowego równania (np. 2x+1=x+5)':'Wpisz wynik nowego równania (np. 2x+3=11)';
      if(m3ChoiceMethod==='transp_simplify'){
        area.innerHTML=badge+`<div class="m3-eq-row"><span class="m3-term-static">${m3TranspUserInput}</span></div><div class="m3-hint">Uprość obie strony i wpisz wynik (np. 2x=10)</div>`;
      } else if(m3ChoiceMethod==='transpose'){
        const lADisp=lA===1?'x':lA===-1?'-x':`${lA}x`;
        const rADisp=rA===1?'x':rA===-1?'-x':`${rA}x`;
        const sc=key=>m3TranspSel[key]?'m3-term-btn m3-transp-sel':'m3-term-static';
        const lBSignTT=lB!==0?(lB>0?'+':'−'):'';
        const lBValTT=String(Math.abs(lB));
        const rBSignTT=rB!==0?(rB>0?'+':'−'):'';
        const rBValTT=String(Math.abs(rB));
        area.innerHTML=badge
          +`<div id="m3-transp-cont" style="position:relative;padding-top:170px">`
          +`<svg id="m3-transp-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;pointer-events:none"></svg>`
          +`<div class="m3-eq-row" style="position:relative;z-index:1">`
          +`<span id="m3-tb-lA" class="${sc('lA')}">${lADisp}</span>`
          +(lB!==0?`<span class="m3-sign-sep">${lBSignTT}</span><span id="m3-tb-lB" class="${sc('lB')}">${lBValTT}</span>`:'')
          +`<span class="m3-sep">=</span>`
          +`<span id="m3-tb-rA" class="${sc('rA')}">${rADisp}</span>`
          +(rB!==0?`<span class="m3-sign-sep">${rBSignTT}</span><span id="m3-tb-rB" class="${sc('rB')}">${rBValTT}</span>`:'')
          +`</div></div>`
          +`<div class="m3-hint">${hint}</div>`;
        drawTranspArrows();
      } else {
        const lAD=lA===1?'x':lA===-1?'-x':`${lA}x`;
        const rAD=rA===1?'x':rA===-1?'-x':`${rA}x`;
        const mkT=(key,d)=>m3Sel===key?`<span class="m3-term-sel">${d}</span>`:`<span class="m3-term-static">${d}</span>`;
        const isXSel=m3Sel==='lA'||m3Sel==='rA';
        const opValDisp=(isXSel&&(m3OpSel==='+'||m3OpSel==='-'))?(m3OpVal===1?'x':`${m3OpVal}x`):m3OpVal;
        const opLbl=m3OpSel==='÷'?`÷ ${m3OpVal}`:m3OpSel==='·'?`× ${m3OpVal}`:m3OpSel==='-'?`− ${opValDisp}`:`+ ${opValDisp}`;
        let h=badge+'<div class="m3-eq-row">';
        if(lA!==0&&lB!==0){
          h+=mkT('lA',lAD);
          h+=`<span class="m3-sign-sep">${lB>0?'+':'−'}</span>`;
          h+=mkT('lB',String(Math.abs(lB)));
        } else if(lA!==0){ h+=mkT('lA',lAD);
        } else if(lB!==0){ h+=mkT('lB',String(lB)); }
        h+=`<span class="m3-sep">=</span>`;
        if(rA!==0&&rB!==0){
          h+=mkT('rA',rAD);
          h+=`<span class="m3-sign-sep">${rB>0?'+':'−'}</span>`;
          h+=mkT('rB',String(Math.abs(rB)));
        } else if(rA!==0){ h+=mkT('rA',rAD);
        } else if(rB!==0){ h+=mkT('rB',String(rB)); }
        h+=`<span class="m3-bar">|</span><span class="m3-op">${opLbl}</span></div><div class="m3-hint">${hint}</div>`;
        area.innerHTML=h;
      }
      showType(); return;
    }
  }

  // ── Standard form {a, b, c, xDiv} ─────────────────────────────────────────
  const{a,b,c,xDiv=1}=m3Eq;
  const xHtml=m3GetXHtml(m3Eq);
  const bLbl=m3GetBLbl(m3Eq);

  if(m3Phase==='PICK'){
    let h=badge+'<div class="m3-eq-row">';
    if(b===0){
      h+=`<button class="m3-term-btn" onclick="m3click('a')">${xHtml}</button>`;
    } else if(a===1&&xDiv===1){
      h+=`<span class="m3-term-static">${xHtml}</span>`;
      h+=`<button class="m3-term-btn" onclick="m3click('b')">${bLbl}</button>`;
    } else {
      h+=`<button class="m3-term-btn" onclick="m3click('a')">${xHtml}</button>`;
      h+=`<button class="m3-term-btn" onclick="m3click('b')">${bLbl}</button>`;
    }
    h+=`<span class="m3-sep">=</span><span class="m3-rhs">${c}</span>`;
    h+='</div><div class="m3-hint">Kliknij element, który chcesz wyeliminować</div>';
    area.innerHTML=h; return;
  }

  if(m3Phase==='SIGN'){
    let h=badge+'<div class="m3-eq-row">';
    if(m3Sel==='b'){
      h+=`<span class="m3-term-static">${xHtml}</span>`;
      h+=`<span class="m3-term-sel">${bLbl}</span>`;
    } else {
      h+=`<span class="m3-term-sel">${xHtml}</span>`;
    }
    h+=`<span class="m3-sep">=</span><span class="m3-rhs">${c}</span>`;
    h+=`<span class="m3-bar">|</span>${signInputs}`;
    h+='</div><div class="m3-hint">Kliknij znak, żeby zmienić, wpisz liczbę</div>';
    area.innerHTML=h;
    showSign(); return;
  }

  if(m3Phase==='TYPE'){
    if(m3FracSubStep==='mixed'&&m3ExpEq&&m3ExpEq.a===1&&m3ExpEq.b===0){
      const _c=m3ExpEq.c;
      const neg=_c<0;
      const fracStr=numToFracStr(neg?-_c:_c);
      const[pStr,qStr]=fracStr.split('/');
      const rhsHtml=(neg?'<span style="font-weight:900;margin-right:2px">−</span>':'')+fracHtml(pStr,qStr);
      area.innerHTML=badge+`<div class="m3-eq-row"><span class="m3-term-static">x</span><span class="m3-sep">=</span><span class="m3-rhs">${rhsHtml}</span></div><div class="m3-hint">Wyłącz całości i zapisz jako liczbę mieszaną</div>`;
      showMixedAns();return;
    }
    const opDisp=m3OpSel==='-'?`− ${m3OpVal}`:m3OpSel==='+'?`+ ${m3OpVal}`:m3OpSel==='·'?`× ${m3OpVal}`:`÷ ${m3OpVal}`;
    let h=badge+'<div class="m3-eq-row">';
    if(m3Sel==='b'){
      h+=`<span class="m3-term-static">${xHtml}</span>`;
      h+=`<span class="m3-term-sel">${bLbl}</span>`;
    } else {
      h+=`<span class="m3-term-sel">${xHtml}</span>`;
    }
    h+=`<span class="m3-sep">=</span><span class="m3-rhs">${c}</span>`;
    h+=`<span class="m3-bar">|</span><span class="m3-op">${opDisp}</span>`;
    h+='</div><div class="m3-hint">Wpisz wynik nowego równania (np. x=5 lub 2x=10)</div>';
    area.innerHTML=h;
    if(m3ExpEq&&m3ExpEq.a===1&&m3ExpEq.b===0){
      const _c=m3ExpEq.c;
      if(!Number.isInteger(_c)){
        if(Math.abs(_c)<1){showFracAns();return;}
        const hintEl=area.querySelector('.m3-hint');
        m3FracSubStep='improper';
        if(hintEl)hintEl.textContent='Zapisz wynik jako ułamek niewłaściwy (p/q)';
        showFracAns();return;
      }
      if(_c<0){showIntAns();return;}
      showPosIntAns();return;
    }
    showType(); return;
  }
}

function m3LRMTranspUnordStrs(){
  const lT=m3Eq.lTerms, rT=m3Eq.rTerms, ll=lT.length;
  const newL=[], newR=[];
  lT.forEach((t,i)=>{
    if(m3LrmSel[i]) newR.push({v:-t.c,x:t.x});
    else newL.push({v:t.c,x:t.x});
  });
  rT.forEach((t,j)=>{
    if(m3LrmSel[ll+j]) newL.push({v:-t.c,x:t.x});
    else newR.push({v:t.c,x:t.x});
  });
  const fmt=(v,first,isX)=>{
    if(v===0)return'';
    const a=Math.abs(v);
    const part=isX?(a===1?'x':`${a}x`):String(a);
    return(v>0?(first?'':'+'):'-')+part;
  };
  const bld=ts=>{let o='',f=true;for(const t of ts){const k=fmt(t.v,f,t.x);if(k){o+=k;f=false;}}return o||'0';};
  const perms=arr=>{if(arr.length<=1)return[arr.slice()];const r=[];for(let i=0;i<arr.length;i++){const rest=[...arr.slice(0,i),...arr.slice(i+1)];for(const p of perms(rest))r.push([arr[i],...p]);}return r;};
  const set=new Set();
  for(const lp of perms(newL))for(const rp of perms(newR))set.add(normIn(bld(lp)+'='+bld(rp)));
  return set;
}
function m3LRMApplyTranspose(){
  const lT=m3Eq.lTerms, rT=m3Eq.rTerms, ll=lT.length;
  let nLX=0,nLC=0,nRX=0,nRC=0;
  lT.forEach((t,i)=>{
    if(m3LrmSel[i]){if(t.x)nRX+=(-t.c);else nRC+=(-t.c);}
    else{if(t.x)nLX+=t.c;else nLC+=t.c;}
  });
  rT.forEach((t,j)=>{
    const i=ll+j;
    if(m3LrmSel[i]){if(t.x)nLX+=(-t.c);else nLC+=(-t.c);}
    else{if(t.x)nRX+=t.c;else nRC+=t.c;}
  });
  m3ExpEq=nRX===0?{a:nLX,b:nLC,c:nRC,xDiv:1}:{type:'LR',lA:nLX,lB:nLC,rA:nRX,rB:nRC};
  m3LrmTranspRaw=m3LRMTranspUnordStrs();
  m3Phase='TYPE';
  document.getElementById('m3-fb').className='feedback';
  document.getElementById('m3-fb').textContent='';
  renderM3();
}

function drawTranspArrows(){
  requestAnimationFrame(()=>{
    const cont=document.getElementById('m3-transp-cont');
    const svgEl=document.getElementById('m3-transp-svg');
    if(!cont||!svgEl)return;
    const cr=cont.getBoundingClientRect();
    const ns='http://www.w3.org/2000/svg';
    svgEl.innerHTML=`<defs>
      <marker id="tah-r" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#ef4444"/></marker>
      <marker id="tah-g" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#22c55e"/></marker>
    </defs>`;
    const {lA,lB,rA,rB}=m3Eq;
    const sel=m3TranspSel;
    const negX=a=>{const n=-a;return(n>0?'+'+n:String(n))+'x';};
    const negN=b=>{const n=-b;return n>0?'+'+n:String(n);};
    const gr=id=>{const el=document.getElementById(id);return el?el.getBoundingClientRect():null;};
    const arcs=[];
    if(sel.lA) arcs.push({id:'m3-tb-lA',dir:'R',lbl:negX(lA)});
    if(sel.lB&&lB!==0) arcs.push({id:'m3-tb-lB',dir:'R',lbl:negN(lB)});
    if(sel.rA) arcs.push({id:'m3-tb-rA',dir:'L',lbl:negX(rA)});
    if(sel.rB&&rB!==0) arcs.push({id:'m3-tb-rB',dir:'L',lbl:negN(rB)});
    const rBs=['m3-tb-rA','m3-tb-rB'].map(gr).filter(Boolean);
    const lBs=['m3-tb-lA','m3-tb-lB'].map(gr).filter(Boolean);
    const rEnd=rBs.length?Math.max(...rBs.map(r=>r.right))-cr.left+14:cr.width*0.9;
    const lEnd=lBs.length?Math.min(...lBs.map(r=>r.left))-cr.left-14:cr.width*0.1;
    const hs=[55,90,125,160];
    arcs.forEach((arc,i)=>{
      const sr=gr(arc.id);
      if(!sr)return;
      const col=arc.dir==='R'?'#ef4444':'#22c55e';
      const mid=arc.dir==='R'?'url(#tah-r)':'url(#tah-g)';
      const sx=sr.left+sr.width/2-cr.left;
      const sy=sr.top+sr.height/2-cr.top;
      const dx=arc.dir==='R'?rEnd:lEnd;
      const dy=sy;
      const mx=(sx+dx)/2;
      const py=sy-hs[i];
      const path=document.createElementNS(ns,'path');
      path.setAttribute('d',`M${sx},${sy} Q${mx},${py} ${dx},${dy}`);
      path.setAttribute('fill','none');
      path.setAttribute('stroke',col);
      path.setAttribute('stroke-width','3');
      path.setAttribute('marker-end',mid);
      svgEl.appendChild(path);
      const lx=mx;
      const ly=0.25*sy+0.5*py+0.25*dy;
      const txt=document.createElementNS(ns,'text');
      txt.setAttribute('x',String(lx));
      txt.setAttribute('y',String(ly-7));
      txt.setAttribute('text-anchor','middle');
      txt.setAttribute('fill',col);
      txt.setAttribute('font-size','14');
      txt.setAttribute('font-weight','800');
      txt.setAttribute('font-family','Nunito,Segoe UI,sans-serif');
      txt.textContent=arc.lbl;
      svgEl.appendChild(txt);
    });
  });
}

function checkM3FracAns(){
  const numInp=document.getElementById('m3-inp-frac-num');

  if(!numInp||!denInp)return;
  const p=Math.abs(parseInt(numInp.value.trim(),10));
  const q=Math.abs(parseInt(denInp.value.trim(),10));

    document.getElementById('m3-fb').textContent='Wpisz licznik i mianownik!';

  }
  const _eq=m3ExpEq||m3Eq;
  const solNum=_eq.type==='LR'?_eq.rB:_eq.c;
  if(Math.abs(m3AnsSign*p/q-solNum)>0.0001){
    document.getElementById('m3-fb').textContent='✗ Niepoprawna odpowiedź — spróbuj jeszcze raz.';
    document.getElementById('m3-fb').className='feedback bad';
    playFlash('m3-anim','wrong'); return;
  }
  if(m3FracSubStep==='improper'){
    m3FracSubStep='mixed';
    document.getElementById('m3-fb').textContent='✓ Dobry ułamek! Teraz wyłącz całości.';
    document.getElementById('m3-fb').className='feedback ok';
    renderM3(); return;
  }
  m3Cor++; m3Tot++; stopTimer('m3-timer');
  document.getElementById('m3-score').textContent=`${m3Cor} / ${m3Tot}`;
  m3Phase='SOLVED'; renderM3(); playCorrectAnim('m3-anim',nextM3);
}

function m3BuildSolutionHTML(){
  const steps=[];
  const addStep=(lbl,eq)=>steps.push({lbl,eq});
  function processEq(ceq){
    if(ceq.type==='LRM'){
      const s=ceq.simplified;
      if(s.type==='LR'){
        addStep('Uprość obie strony',fmtSum(s.lA,s.lB)+' = '+fmtSum(s.rA,s.rB));
      } else {
        addStep('Uprość obie strony',fmtSum(s.a,s.b)+' = '+s.c);
      }
      processEq(s);
    } else if(ceq.type==='LR'){
      const{lA,lB,rA,rB}=ceq;
      const a=lA-rA,c=rB-lB;
      addStep('Przenieś wyrazy podobne',fmtSum(a,0)+' = '+c);
      processEq({a,b:0,c,xDiv:1});
    } else if(ceq.type==='L6'){
      const{lcd,lTerms,rTerms,resultEq}=ceq;
      const termStr=t=>{const m=lcd/t.d,ea=t.a*m,eb=t.b*m;return ea===0?String(eb):eb===0?fmtSum(ea,0):fmtSum(ea,eb);};
      addStep(`Pomnóż przez LCD = ${lcd}`,lTerms.map(termStr).join('+')+' = '+rTerms.map(termStr).join('+'));
      processEq(resultEq);
    } else if(ceq.type==='L3F'){
      const{a,b,d,c}=ceq;
      addStep(`Pomnóż obie strony przez ${d}`,fmtSum(a,b)+' = '+c*d);
      processEq({a,b,c:c*d,xDiv:1});
    } else if(ceq.type==='L4F'){
      const{a,b,d,e,f}=ceq;
      addStep(`Pomnóż obie strony przez ${d}`,fmtSum(a,b)+' = '+fmtSum(d*e,d*f));
      processEq({type:'LR',lA:a,lB:b,rA:d*e,rB:d*f});
    } else if(ceq.type==='L3M'){
      const{k,a,b,c}=ceq;
      addStep(`Rozwiń nawias (×${k})`,fmtSum(k*a,k*b)+' = '+c);
      processEq({a:k*a,b:k*b,c,xDiv:1});
    } else if(ceq.type==='L4M'){
      const{k,a,b,e,f}=ceq;
      addStep(`Rozwiń nawias (×${k})`,fmtSum(k*a,k*b)+' = '+fmtSum(e,f));
      processEq({type:'LR',lA:k*a,lB:k*b,rA:e,rB:f});
    } else {
      const{a,b,xDiv=1}=ceq;
      let cc=ceq.c;
      if(b!==0){
        const lbl=b>0?`Odejmij ${b} od obu stron`:`Dodaj ${Math.abs(b)} do obu stron`;
        cc-=b; addStep(lbl,fmtSum(a,0)+' = '+cc);
      }
      if(a!==1||xDiv!==1){
        const x=xDiv>1?cc*xDiv/a:cc/a;
        const lbl=xDiv>1?`Pomnóż obie strony przez ${xDiv}`:`Podziel obie strony przez ${a}`;
        addStep(lbl,'x = '+numToFracStr(x));
      }
    }
  }
  processEq(m3Eq);
  let html='<div class="m3-sol-steps">';
  steps.forEach((s,i)=>{
    html+=`<div class="m3-sol-step"><span class="m3-sol-lbl">${i+1}. ${s.lbl}:</span> <span class="m3-sol-eq">${s.eq}</span></div>`;
  });
  return html+'</div>';
}
function m3Forfeit(){
  if(m3Phase==='WAIT'||m3Phase==='SOLVED'||m3Phase==='FORFEIT')return;
  m3Tot++;
  stopTimer('m3-timer');
  document.getElementById('m3-score').textContent=`${m3Cor} / ${m3Tot}`;
  m3Phase='FORFEIT';
  renderM3();
  const fb=document.getElementById('m3-fb');
  fb.className='feedback bad';
  fb.innerHTML='🏳️ Poddano się.<br>'+m3BuildSolutionHTML()
    +'<div style="text-align:center;margin-top:10px"><button class="btn btn-primary" onclick="nextM3()">Następne →</button></div>';
  playFlash('m3-anim','wrong');
}
function transpUnordStrs(lA,lB,rA,rB,s){
  const fmt=(v,first,isX)=>{if(v===0)return'';const aV=Math.abs(v);const sg=v>0?(first?'':'+'):'-';return isX?sg+(aV===1?'':aV)+'x':sg+aV;};
  const lT=[],rT=[];
  if(!s.lA&&lA!==0)lT.push({v:lA,x:true});   if(s.rA&&rA!==0)lT.push({v:-rA,x:true});
  if(!s.lB&&lB!==0)lT.push({v:lB,x:false});   if(s.rB&&rB!==0)lT.push({v:-rB,x:false});
  if(!s.rA&&rA!==0)rT.push({v:rA,x:true});    if(s.lA&&lA!==0)rT.push({v:-lA,x:true});
  if(!s.rB&&rB!==0)rT.push({v:rB,x:false});   if(s.lB&&lB!==0)rT.push({v:-lB,x:false});
  const perms=arr=>{if(arr.length<=1)return[arr.slice()];const r=[];for(let i=0;i<arr.length;i++){const rest=[...arr.slice(0,i),...arr.slice(i+1)];for(const p of perms(rest))r.push([arr[i],...p]);}return r;};
  const bld=ts=>{let o='',f=true;for(const t of ts){const tk=fmt(t.v,f,t.x);o+=tk;if(tk)f=false;}return o||'0';};
  const set=new Set();
  for(const lp of perms(lT))for(const rp of perms(rT))set.add(normIn(bld(lp)+'='+bld(rp)));
  return set;
}
function m3ApplyTranspose(){
  const s=m3TranspSel;
  if(!s.lA&&!s.lB&&!s.rA&&!s.rB){
    document.getElementById('m3-fb').textContent='Kliknij co najmniej jeden jednomian!';
    document.getElementById('m3-fb').className='feedback bad'; return;
  }
  m3SaveState();
  const{lA,lB,rA,rB}=m3Eq;
  const nLA=(s.lA?0:lA)+(s.rA?-rA:0);
  const nLB=(s.lB?0:lB)+(s.rB?-rB:0);
  const nRA=(s.rA?0:rA)+(s.lA?-lA:0);
  const nRB=(s.rB?0:rB)+(s.lB?-lB:0);
  if(nRA===0) m3ExpEq={a:nLA,b:nLB,c:nRB,xDiv:1};
  else m3ExpEq={type:'LR',lA:nLA,lB:nLB,rA:nRA,rB:nRB};
  m3TranspRaw=transpUnordStrs(lA,lB,rA,rB,s);
  m3Phase='TYPE'; renderM3();
}
function m3choose(method){
  m3SaveState();
  m3ChoiceMethod=method;
  if(method==='expand'){
    const{k,a,b,c,e,f}=m3Eq;
    m3OpSel='·'; m3OpVal=k;
    if(m3Eq.type==='L3M') m3ExpEq={a:k*a,b:k*b,c,xDiv:1};
    else m3ExpEq={type:'LR',lA:k*a,lB:k*b,rA:e,rB:f};
    m3Phase='TYPE'; renderM3();
  } else if(method==='simplify'){
    const{a,b,d,c,e,f}=m3Eq;
    m3OpSel='÷'; m3OpVal=d;
    if(m3Eq.type==='L3F') m3ExpEq={a:a/d,b:b/d,c,xDiv:1};
    else m3ExpEq={type:'LR',lA:a/d,lB:b/d,rA:e,rB:f};
    m3Phase='TYPE'; renderM3();
  } else {
    m3OpSel='+'; m3Phase='SIGN'; renderM3();
  }
}

function m3CycleSign(){
  const ops=['+','-','·','÷'];
  const lbls=['+','−','·','÷'];
  const cls=['','s-minus','s-mul','s-div'];
  const idx=ops.indexOf(m3OpSel);
  m3OpSel=ops[(idx+1)%4];
  const ni=(idx+1)%4;
  const btn=document.getElementById('m3-sign-cyc');
  if(btn){btn.textContent=lbls[ni];btn.className='m3-sign-cycle'+(cls[ni]?' '+cls[ni]:'');}
}

function checkM3Sign(){
  if(!m3OpSel){
    document.getElementById('m3-fb').textContent='Wybierz najpierw znak!';
    document.getElementById('m3-fb').className='feedback bad'; return;
  }
  const rawStr=(document.getElementById('m3-inp-sign').value||'').trim();
  let val;
  const xCoeffM=rawStr.match(/^(\d*\.?\d*)x$/i);
  if(xCoeffM){const c=xCoeffM[1];val=(c==='')?1:parseFloat(c.replace(',','.'));}
  else if(/^-?(\d+\.?\d*|\.\d+)$/.test(rawStr.replace(',','.'))){val=parseFloat(rawStr.replace(',','.'));}
  else{val=NaN;}
  if(isNaN(val)||val===0||rawStr===''){
    document.getElementById('m3-fb').textContent='Wpisz liczbę lub wyrażenie z x (np. 3 lub 2x)!';
    document.getElementById('m3-fb').className='feedback bad'; return;
  }
  if(m3Phase==='L6_MULTIPLY'){
    if(m3OpSel!=='·'||Math.abs(val-m3Eq.lcd)>0.001){
      document.getElementById('m3-fb').textContent=`✗ Pomnóż obie strony przez LCD = ${m3Eq.lcd}`;
      document.getElementById('m3-fb').className='feedback bad'; return;
    }
    m3OpVal=val; m3SaveState();
    document.getElementById('m3-fb').className='feedback';
    m3Phase='L6_TYPE_UNSIMPL'; renderM3(); return;
  }
  if(m3ChoiceMethod==='equiv'&&m3Eq.type==='LR'){
    const{lA,lB,rA,rB}=m3Eq;
    const isX=(m3Sel==='lA'||m3Sel==='rA');
    let ne;
    if(m3OpSel==='·'||m3OpSel==='÷'){
      const r=v=>Math.round(applyOp(v,m3OpSel,val)*1000)/1000;
      ne={type:'LR',lA:r(lA),lB:r(lB),rA:r(rA),rB:r(rB)};
    } else if(isX){
      const sv=m3OpSel==='-'?-val:val;
      ne={type:'LR',lA:lA+sv,lB,rA:rA+sv,rB};
    } else {
      ne={type:'LR',lA,lB:Math.round(applyOp(lB,m3OpSel,val)*1000)/1000,rA,rB:Math.round(applyOp(rB,m3OpSel,val)*1000)/1000};
    }
    m3OpVal=val; m3ExpEq=ne;
    m3SaveState();
    document.getElementById('m3-fb').className='feedback';
    m3Phase='TYPE'; renderM3(); return;
  }
  let coeff,target;
  if(m3Sel==='frac'){coeff=1/m3Eq.d;target=1;}
  else if(m3Sel==='mul'){coeff=m3Eq.k;target=1;}
  else if(m3Sel==='rhs-a'){coeff=m3Eq.rA;target=0;}
  else{const{a,b,xDiv=1}=m3Eq;coeff=m3Sel==='b'?b:a/xDiv;target=m3Sel==='b'?0:1;}
  if(Math.abs(applyOp(coeff,m3OpSel,val)-target)>0.001){
    document.getElementById('m3-fb').textContent='✗ Ta operacja nie eliminuje zaznaczonego elementu. Spróbuj jeszcze raz.';
    document.getElementById('m3-fb').className='feedback bad';
    playFlash('m3-anim','wrong'); return;
  }
  m3OpVal=val;
  if(m3Sel==='frac'){
    if(m3Eq.type==='L3F') m3ExpEq={a:m3Eq.a,b:m3Eq.b,c:m3Eq.c*val,xDiv:1};
    else m3ExpEq={type:'LR',lA:m3Eq.a,lB:m3Eq.b,rA:m3Eq.d*m3Eq.e,rB:m3Eq.d*m3Eq.f};
  } else if(m3Sel==='mul'){
    if(m3Eq.type==='L3M') m3ExpEq={a:m3Eq.a,b:m3Eq.b,c:m3Eq.c/val,xDiv:1};
    else m3ExpEq={type:'LR',lA:m3Eq.a,lB:m3Eq.b,rA:m3Eq.e/val,rB:m3Eq.f/val};
  } else if(m3Sel==='rhs-a'){
    const{lA,lB,rA,rB}=m3Eq;
    m3ExpEq={a:applyOp(lA,m3OpSel,val),b:lB,c:rB,xDiv:1};
  } else {
    const{a,b,c,xDiv=1}=m3Eq;
    const newC=Math.round(applyOp(c,m3OpSel,val)*10000)/10000;
    if(m3Sel==='b') m3ExpEq={a,b:0,c:newC,xDiv};
    else m3ExpEq={a:1,b:0,c:newC,xDiv:1};
  }
  m3SaveState();
  document.getElementById('m3-fb').className='feedback';
  m3Phase='TYPE'; renderM3();
}

function checkM3Type(){
  const raw=(document.getElementById('m3-inp-type').value||'').trim();
  if(!raw) return;
  if(m3Phase==='L6_TYPE_UNSIMPL'){
    if(!m6ResultValidAnswers) m6ResultValidAnswers=m6ValidAnswersSet(m3Eq.resultEq);
    if(!m6ResultValidAnswers.has(normIn(raw))){
      document.getElementById('m3-fb').textContent='✗ Niepoprawnie — sprawdź wynik mnożenia.';
      document.getElementById('m3-fb').className='feedback bad';
      playFlash('m3-anim','wrong'); return;
    }
    m3Eq=m3Eq.resultEq; m3Step++;
    m3Sel=null; m3OpSel=null; m3OpVal=null; m3ExpEq=null;
    m3Phase='PICK';
    document.getElementById('m3-fb').className='feedback';
    renderM3(); playFlash('m3-anim','correct'); return;
  }
  const inp=normIn(raw);
  const isUnord=m3ChoiceMethod==='transpose'&&m3TranspRaw&&m3TranspRaw.has(inp);
  const isLrmUnord=m3ChoiceMethod==='lrm_transpose'&&m3LrmTranspRaw&&m3LrmTranspRaw.has(inp);
  const ok=inp===expNorm(m3ExpEq)||isUnord||isLrmUnord;
  if(!ok){
    document.getElementById('m3-fb').textContent='✗ Niepoprawnie — popraw i spróbuj jeszcze raz.';
    document.getElementById('m3-fb').className='feedback bad';
    playFlash('m3-anim','wrong'); return;
  }
  if(isUnord&&inp!==expNorm(m3ExpEq)){
    m3TranspUserInput=raw;
    m3ChoiceMethod='transp_simplify';
    m3TotalSteps++;
    m3Step++;
    m3Phase='TYPE';
    document.getElementById('m3-fb').className='feedback';
    renderM3(); playFlash('m3-anim','correct'); return;
  }
  if(isLrmUnord&&inp!==expNorm(m3ExpEq)){
    m3TranspUserInput=raw;
    m3ChoiceMethod='lrm_transp_simplify';
    m3TotalSteps++;
    m3Step++;
    m3Phase='TYPE';
    document.getElementById('m3-fb').className='feedback';
    renderM3(); playFlash('m3-anim','correct'); return;
  }
  m3Eq=m3ExpEq; m3Step++;
  const lrSolved=m3Eq.type==='LR'&&m3Eq.lA===1&&m3Eq.lB===0&&m3Eq.rA===0;
  const stdSolved=!m3Eq.type&&m3Eq.a===1&&m3Eq.b===0&&(m3Eq.xDiv===undefined||m3Eq.xDiv===1);
  if(lrSolved||stdSolved){
    m3Cor++; m3Tot++; stopTimer('m3-timer');
    document.getElementById('m3-score').textContent=`${m3Cor} / ${m3Tot}`;
    m3Phase='SOLVED'; renderM3(); playCorrectAnim('m3-anim',nextM3);
  } else if(m3Eq.type==='LR'&&m3ChoiceMethod==='equiv'){
    m3TotalSteps++; m3Sel=null; m3OpSel=null; m3OpVal=null; m3ExpEq=null;
    m3Phase='LR_EQUIV';
    document.getElementById('m3-fb').className='feedback';
    renderM3(); playFlash('m3-anim','correct');
  } else {
    m3Sel=null; m3OpSel=null; m3OpVal=null; m3ExpEq=null;
    m3Phase='PICK';
    document.getElementById('m3-fb').className='feedback';
    renderM3(); playFlash('m3-anim','correct');
  }
}

function nextM3(){
  clearTimeout(_adv);
  const pool=m3Level===6?EQ3_LV6:m3Level===5?EQ3_LV5:m3Level===4?EQ3_LV4:m3Level===3?EQ3_LV3:m3Level===2?EQ3_LV2:EQ3_LV1;
  m3Eq=pool[randInt(0,pool.length-1)]();
  m3TotalSteps=m3CountSteps(m3Eq);
  m3Sel=null; m3OpSel=null; m3OpVal=null; m3ExpEq=null; m3ChoiceMethod=null; m3TranspSel={}; m3TranspRaw=null; m3TranspUserInput=null; m3History=[]; m3LrmSel=[]; m3LrmChipGrp=[]; m3LrmTranspRaw=null; m3FracSubStep=null;
  m6FracDone=[]; m6SelSet=new Set(); m6FillMode=false; m6ResultValidAnswers=null;
  if(m3Eq.type==='L6'){
    m6FracDone=new Array(m3Eq.lTerms.length+m3Eq.rTerms.length).fill(false);
    [...m3Eq.lTerms,...m3Eq.rTerms].forEach((t,i)=>{if(t.d===m3Eq.lcd)m6FracDone[i]=true;});
    m6SelSet=new Set(); m6FillMode=false;
    m3Step=1; m3Phase='L6_LCD';
  } else {
    m3Step=1; m3Phase='PICK';
  }
  document.getElementById('m3-fb').className='feedback';
  document.getElementById('m3-fb').textContent='';
  startTimer('m3-timer'); renderM3();
}

document.getElementById('m3-inp-sign').addEventListener('keydown',e=>{if(e.key==='Enter')checkM3Sign();});
document.getElementById('m3-inp-type').addEventListener('keydown',e=>{if(e.key==='Enter')checkM3Type();});

nextM1(); nextM2(); nextM3();
</script>
