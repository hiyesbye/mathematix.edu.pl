<style>
  :root {
    --bg:        #eceffe;
    --card:      #ffffff;
    --primary:   #4a6cf7;
    --good:      #1e9e5a;
    --bad:       #d64040;
    --text:      #1e2340;

    --score-bg:  #d6f5e6; --score-text: #1a7a44; --score-bdr: #a8e8c8;
    --timer-bg:  #fff4d6; --timer-text: #b86b00; --timer-bdr: #ffd98a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg);
    font-family: "Segoe UI", Verdana, Arial, sans-serif; color: var(--text); }
  body { display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px; }

  /* ── Card ─────────────────────────────────────────── */
  .card {
    background: var(--card); width: 100%; max-width: 420px;
    border-radius: 24px; box-shadow: 0 12px 36px rgba(30,40,120,.14);
    padding: 28px 24px 32px; text-align: center;
    position: relative; overflow: hidden;
  }
  h1 {
    font-family: 'Nunito', "Segoe UI", sans-serif;
    font-size: 1.55rem; font-weight: 900; letter-spacing: -0.2px;
    margin: 0 0 16px; padding: 13px 20px;
    background: linear-gradient(135deg, #0d47a1 0%, #64b5f6 100%);
    border: 2px solid #1565c0;
    border-radius: 16px;
    text-align: center;
  }
  .title-text {
    color: #ffffff;
    text-shadow: 0 1px 4px rgba(5, 30, 100, 0.4);



  }

  /* ── Mode row (label + tabs in one box) ──────────── */
  .mode-row {
    display: flex;
    align-items: center;
    background: #eef0fb;
    border-radius: 14px;
    padding: 4px;
    gap: 4px;
    margin-bottom: 20px;
  }
  .mode-title {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    padding: 4px 9px;
    border-radius: 9px;
    background: #c6ceed;
    color: #3d4470;
    font-size: .78rem;
    font-weight: 700;
    white-space: nowrap;
    cursor: default;
    user-select: none;
  }
  .tab {
    flex: 1; min-width: 0; border: none; background: transparent; border-radius: 11px;
    padding: 10px 6px; font-size: .88rem; font-weight: 700; color: #6672a8;
    cursor: pointer; transition: background .18s, color .18s, box-shadow .18s;
    line-height: 1.3; box-shadow: none;
    display: flex; align-items: center; justify-content: center; gap: 3px;
    overflow: hidden;
  }
  .tab .ti { flex-shrink: 0; }
  .tab .tl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab:not(.active-n):not(.active-t):not(.active-e):hover { background: #dfe2f5; color: var(--text); }
  @media (max-width: 430px) {
    .mode-title { display: none; }
    .tab { font-size: .82rem; padding: 9px 3px; gap: 2px; }
    .tab .ti { font-size: .85em; }
  }
  .tab.active-n { background: linear-gradient(135deg,#5b7fff,#3a54e8); color:#fff; box-shadow:0 3px 10px rgba(74,108,247,.35); }
  .tab.active-t { background: linear-gradient(135deg,#e8604a,#f5a623); color:#fff; box-shadow:0 3px 10px rgba(232,96,74,.35); }
  .tab.active-e { background:linear-gradient(135deg,#1b8a3d,#2ec26e); color:#fff; box-shadow:0 3px 10px rgba(27,138,61,.35); }

  /* ── Stats ────────────────────────────────────────── */
  .stats { display: flex; gap: 10px; margin-bottom: 20px; }
  .stat-box { flex: 1; border-radius: 14px; padding: 10px 6px; font-weight: 700; }
  .stat-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .8px; opacity: .7; margin-bottom: 2px; }
  .stat-value { font-size: 1.35rem; }
  .score-box { background: var(--score-bg); color: var(--score-text); border: 2px solid var(--score-bdr); }
  .timer-box { background: var(--timer-bg); color: var(--timer-text); border: 2px solid var(--timer-bdr);
    transition: background .3s, color .3s, border-color .3s; }
  .timer-box.warn   { background: #ffe0cc; color: #c04000; border-color: #ffb480; }
  .timer-box.danger { background: #ffd6d6; color: #c00000; border-color: #ff9090;
    animation: timerPulse .5s ease-in-out infinite alternate; }
  @keyframes timerPulse { from { transform:scale(1); } to { transform:scale(1.05); } }

  /* ── Question box ─────────────────────────────────── */
  .question-box {
    background: linear-gradient(145deg,#0a7e74,#12b0a0); color: #fff;
    border-radius: 18px; padding: 24px 16px; margin-bottom: 20px;
    box-shadow: 0 6px 22px rgba(10,126,116,.35);
  }
  .question {
    font-family: "Bahnschrift","DIN Alternate","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
    font-size: clamp(3.5rem, 16vw, 7rem); font-weight: 700; letter-spacing: clamp(2px, 0.8vw, 6px); line-height: 1; white-space: nowrap;
    text-shadow: 0 2px 8px rgba(0,0,0,.18);
  }

  /* ── Form & inputs ────────────────────────────────── */
  form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
  input[type="number"] { touch-action: manipulation;
    width: 100%; font-size: 1.6rem; text-align: center; padding: 12px 8px;
    border: 2px solid #cdd5f7; border-radius: 14px; outline: none;
    -moz-appearance: textfield; transition: border-color .15s;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { touch-action: manipulation; -webkit-appearance:none; margin:0; }
  input[type="number"]:focus { border-color: var(--primary); }

  button {
    width: 100%; font-size: 1.1rem; font-weight: 700; padding: 13px 20px;
    border: none; border-radius: 14px;
    background: linear-gradient(135deg,#5b7fff,#3a54e8); color: white;
    cursor: pointer; transition: filter .15s, transform .06s;
    letter-spacing: .3px; box-shadow: 0 4px 14px rgba(74,108,247,.35);
  }
  button:hover  { filter: brightness(1.08); }
  button:active { transform: scale(.97); }
  button.secondary {
    background: transparent; border: 2px solid #d0d6f5;
    color: #6672a8; font-weight: 600; box-shadow: none; margin-top: 2px;
  }
  button.secondary:hover { background: #f2f4fd; filter: none; }
  button[type=submit]:disabled { opacity: 0.38; cursor: not-allowed; pointer-events: none; }
  button.secondary:disabled    { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

  /* ── Feedback ─────────────────────────────────────── */
  .feedback {
    min-height: 66px; font-size: 1.15rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; line-height: 1.4;
  }
  .feedback.good  { background: #d6f5e6; color: var(--good); border: 2px solid #a8e8c8; }
  .feedback.bad   { background: #fde8e8; color: var(--bad);  border: 2px solid #f4b8b8; }
  .feedback.empty { visibility: hidden; }

  /* ── Difficulty selection ─────────────────────────── */
  .diff-screen { padding: 4px 0 8px; }
  .diff-heading { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; opacity: .85; }
  .diff-buttons { display: flex; flex-direction: column; gap: 10px; }
  .diff-btn {
    display: flex; align-items: center; gap: 14px; width: 100%;
    padding: 14px 18px; border: none; border-radius: 16px;
    cursor: pointer; text-align: left; color: white; font-weight: 700;
    transition: filter .15s, transform .06s; letter-spacing: normal; box-shadow: none;
  }
  .diff-btn:hover  { filter: brightness(1.08); }
  .diff-btn:active { transform: scale(.97); }
  .diff-icon { font-size: 1.9rem; line-height: 1; }
  .diff-info { display: flex; flex-direction: column; gap: 2px; }
  .diff-name { font-size: 1.05rem; }
  .diff-desc { font-size: .78rem; opacity: .88; font-weight: 600; }
  .diff-easy   { background: linear-gradient(135deg,#1e9e5a,#38d68a); box-shadow: 0 4px 14px rgba(30,158,90,.3); }
  .diff-medium { background: linear-gradient(135deg,#c07800,#f5c030); box-shadow: 0 4px 14px rgba(192,120,0,.3); }
  .diff-hard   { background: linear-gradient(135deg,#d64040,#f07070); box-shadow: 0 4px 14px rgba(214,64,64,.3); }

  /* ── Two-button row ───────────────────────────────── */
  .btn-row { display: flex; gap: 10px; }
  .btn-row button { margin-top: 0; }

  /* ════════════════════════════════════════════════════
     ANIMACJE
  ════════════════════════════════════════════════════ */
  #animLayer {
    position: absolute; inset: 0; pointer-events: none; z-index: 100;
    border-radius: 24px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .anim-correct-num {
    font-family: "Bahnschrift","DIN Alternate","Arial Rounded MT Bold",sans-serif;
    font-size: 9rem; font-weight: 900; color: #fff; line-height: 1; letter-spacing: 2px;
    text-shadow: 0 0 10px #7fffb0,0 0 25px #50ff80,0 0 55px #20e860,0 0 100px #00c840;
    animation: correctPop 1.3s cubic-bezier(.22,1,.36,1) forwards;
    position: relative; z-index: 2;
  }
  @keyframes correctPop {
    0%   { opacity:0; transform:scale(.2) rotate(-8deg); }
    28%  { opacity:1; transform:scale(1.18) rotate(2deg); }
    50%  { transform:scale(.94) rotate(-1deg); }
    68%  { opacity:1; transform:scale(1.04) rotate(.5deg); }
    85%  { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(1.4); }
  }
  .particle {
    position: absolute; z-index: 3; font-size: 1.8rem; font-weight: 900; color: #fff;
    pointer-events: none; animation: particleFly 1s ease-out forwards;
    text-shadow: 0 0 8px rgba(80,255,140,.9),0 0 18px rgba(80,255,140,.5);
  }
  @keyframes particleFly {
    0%   { opacity:1; transform:translate(0,0) scale(1.1); }
    100% { opacity:0; transform:var(--tx) scale(.2); }
  }
  .correct-flash {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center,rgba(40,220,100,.45) 0%,rgba(40,220,100,0) 70%);
    animation: flashFade 1.3s ease-out forwards;
  }
  @keyframes flashFade { 0%{opacity:0;} 15%{opacity:1;} 100%{opacity:0;} }
  .anim-wrong-x {
    font-size: 11rem; font-weight: 900; color: #ff1a1a; line-height: 1;
    animation: wrongGlow 1.2s ease-out forwards; position: relative; z-index: 2;
  }
  @keyframes wrongGlow {
    0%   { opacity:0; transform:scale(.4); text-shadow:0 0 8px #f00,0 0 16px #f00; }
    18%  { opacity:1; transform:scale(1.12); text-shadow:0 0 8px #f00,0 0 20px #f00,0 0 40px #f22,0 0 80px #f44,0 0 130px #f00,0 0 200px #c00; }
    40%  { transform:scale(1); text-shadow:0 0 4px #f00,0 0 14px #f00,0 0 30px #f22,0 0 60px #f44,0 0 100px #f00; }
    65%  { opacity:1; transform:scale(1.06); text-shadow:0 0 12px #f00,0 0 28px #f00,0 0 55px #f22,0 0 110px #f44,0 0 180px #c00,0 0 250px #800; }
    100% { opacity:0; transform:scale(1.25); text-shadow:0 0 30px #f00,0 0 70px #f22,0 0 140px #f00; }
  }
  .wrong-flash {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center,rgba(220,0,0,.4) 0%,rgba(220,0,0,0) 70%);
    animation: flashFade 1.2s ease-out forwards;
  }
</style>
</head>
<body>
<div class="card">
  <div id="animLayer"></div>
    <h1><span class="title-text">Tabliczka mnożenia</span></h1>

  <div class="mode-row">
    <span class="mode-title">Tryb:</span>
    <button class="tab active-n" onclick="switchTab('normal')">Normalny</button>
    <button class="tab"         onclick="switchTab('timed')"><span class="ti">⏱</span><span class="tl">Czasowy</span></button>
    <button class="tab"         onclick="switchTab('extended')"><span class="ti">🔢</span><span class="tl">Extended</span></button>
  </div>

  <!-- ══ PANEL: tryb normalny ══════════════════════════ -->
  <div id="panelNormal">
    <div class="stats">
      <div class="stat-box score-box">
        <div class="stat-label">Wynik</div>
        <div class="stat-value" id="nScore">0 / 0</div>
      </div>
      <div class="stat-box timer-box">
        <div class="stat-label">Czas</div>
        <div class="stat-value" id="nTimer">0 s</div>
      </div>
    </div>
    <div class="question-box">
      <div class="question" id="nQuestion">? · ?</div>
    </div>
    <form id="nForm" autocomplete="off">
      <input type="number" id="nInput" inputmode="numeric" placeholder="Twoja odpowiedź" required>
      <button type="submit" id="nSubmitBtn">Sprawdź</button>
    </form>
    <div class="feedback empty" id="nFeedback"></div>
    <button type="button" id="nReset" class="secondary">Resetuj wynik</button>
  </div>

  <!-- ══ PANEL: tryb extended ════════════════════════ -->
  <div id="panelExtended" style="display:none">
    <div class="stats">
      <div class="stat-box score-box"><div class="stat-label">Wynik</div><div class="stat-value" id="eScore">0 / 0</div></div>
      <div class="stat-box timer-box"><div class="stat-label">Czas</div><div class="stat-value" id="eTimer">0 s</div></div>
    </div>
    <div class="question-box"><div class="question" id="eQuestion">? · ?</div></div>
    <form id="eForm" autocomplete="off">
      <input type="number" id="eInput" inputmode="numeric" placeholder="Twoja odpowiedź" required>
      <button type="submit" id="eSubmitBtn">Sprawdź</button>
    </form>
    <div class="feedback empty" id="eFeedback"></div>
    <button type="button" id="eReset" class="secondary">Resetuj wynik</button>
  </div>

  <!-- ══ PANEL: wybór trudności ═════════════════════════ -->
  <div id="panelDiff" style="display:none">
    <div class="diff-screen">
      <div class="diff-heading">Wybierz poziom trudności</div>
      <div class="diff-buttons">
        <button class="diff-btn diff-easy" onclick="selectDifficulty(15)">
          <span class="diff-icon">🟢</span>
          <span class="diff-info">
            <span class="diff-name">Easy</span>
            <span class="diff-desc">15 sekund na odpowiedź</span>
          </span>
        </button>
        <button class="diff-btn diff-medium" onclick="selectDifficulty(10)">
          <span class="diff-icon">🟡</span>
          <span class="diff-info">
            <span class="diff-name">Medium</span>
            <span class="diff-desc">10 sekund na odpowiedź</span>
          </span>
        </button>
        <button class="diff-btn diff-hard" onclick="selectDifficulty(5)">
          <span class="diff-icon">🔴</span>
          <span class="diff-info">
            <span class="diff-name">Hard</span>
            <span class="diff-desc">5 sekund na odpowiedź</span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- ══ PANEL: tryb czasowy – pytania ══════════════════ -->
  <div id="panelTimed" style="display:none">
    <div class="stats">
      <div class="stat-box score-box">
        <div class="stat-label">Wynik</div>
        <div class="stat-value" id="tScore">0 / 0</div>
      </div>
      <div class="stat-box timer-box" id="tTimerBox">
        <div class="stat-label">Pozostały czas</div>
        <div class="stat-value" id="tTimer">— s</div>
      </div>
    </div>
    <div class="question-box">
      <div class="question" id="tQuestion">? · ?</div>
    </div>
    <form id="tForm" autocomplete="off">
      <input type="number" id="tInput" inputmode="numeric" placeholder="Twoja odpowiedź" required>
      <button type="submit" id="tSubmitBtn">Sprawdź</button>
    </form>
    <div class="feedback empty" id="tFeedback"></div>
    <div class="btn-row">
      <button type="button" id="tReset" class="secondary">Resetuj wynik</button>
      <button type="button" id="btnChangeDiff" class="secondary">Zmień poziom</button>
    </div>
  </div>
</div>

<script>
  const animLayer   = document.getElementById('animLayer');
  const tabBtns     = document.querySelectorAll('.tab');

  // Normal panel
  const nScoreEl    = document.getElementById('nScore');
  const nTimerEl    = document.getElementById('nTimer');
  const nQuestionEl = document.getElementById('nQuestion');
  const nForm       = document.getElementById('nForm');
  const nInput      = document.getElementById('nInput');
  const nFeedback   = document.getElementById('nFeedback');
  const nReset      = document.getElementById('nReset');
  const eScoreEl    = document.getElementById('eScore');
  const eTimerEl    = document.getElementById('eTimer');
  const eQuestionEl = document.getElementById('eQuestion');
  const eInput      = document.getElementById('eInput');
  const eFeedback   = document.getElementById('eFeedback');
  const eReset      = document.getElementById('eReset');
  const nSubmitBtn  = document.getElementById('nSubmitBtn');
  const eSubmitBtn  = document.getElementById('eSubmitBtn');
  const tSubmitBtn  = document.getElementById('tSubmitBtn');
  function getSubmitBtn() { return currentTab === 'normal' ? nSubmitBtn : currentTab === 'extended' ? eSubmitBtn : tSubmitBtn; }
  const panelNormal = document.getElementById('panelNormal');

  // Timed panel
  const tScoreEl    = document.getElementById('tScore');
  const tTimerEl    = document.getElementById('tTimer');
  const tTimerBox   = document.getElementById('tTimerBox');
  const tQuestionEl = document.getElementById('tQuestion');
  const tForm       = document.getElementById('tForm');
  const tInput      = document.getElementById('tInput');
  const tFeedback   = document.getElementById('tFeedback');
  const tReset      = document.getElementById('tReset');
  const panelDiff   = document.getElementById('panelDiff');
  const panelTimed  = document.getElementById('panelTimed');
  const panelExtended = document.getElementById('panelExtended');

  // ── State ───────────────────────────────────────────
  let currentTab = 'normal';
  let a, b, recentQ = [], correctAnswer;
  let extFlip = false;
  let mode = 'ask';
  let autoAdvanceTimeout = null;

  let nCorrect = 0, nTotal = 0;
  let eCorrect = 0, eTotal = 0;
  let normalInterval = null, normalStart = 0;

  let tCorrect = 0, tTotal = 0;
  let timedDiff = null;
  let countdownInterval = null, countdownLeft = 0;

  // ── Tab switching ───────────────────────────────────
  function switchTab(tab) {
    clearAll();
    if (typeof getSubmitBtn === 'function') getSubmitBtn().textContent = 'Sprawdź';
    currentTab = tab;
    tabBtns[0].className = 'tab' + (tab === 'normal'   ? ' active-n' : '');
    tabBtns[1].className = 'tab' + (tab === 'timed'    ? ' active-t' : '');
    tabBtns[2].className = 'tab' + (tab === 'extended' ? ' active-e' : '');
    panelNormal.style.display   = tab === 'normal'   ? '' : 'none';
    panelExtended.style.display = tab === 'extended' ? '' : 'none';
    panelDiff.style.display     = 'none';
    panelTimed.style.display    = 'none';
    if (tab === 'timed') { showDiffScreen(); } else { newQuestion(); }
  }

  function showDiffScreen() {
    panelDiff.style.display  = '';
    panelTimed.style.display = 'none';
  }

  function selectDifficulty(secs) {
    timedDiff = secs;
    tCorrect = 0; tTotal = 0;
    tScoreEl.textContent = '0 / 0';
    panelDiff.style.display  = 'none';
    panelTimed.style.display = '';
    newQuestion();
  }

  function clearAll() {
    clearTimeout(autoAdvanceTimeout);
    clearInterval(normalInterval);
    clearInterval(countdownInterval);
    animLayer.innerHTML = '';
    mode = 'ask';
  }

  // ── Weighted random ─────────────────────────────────
  function weightedFactor() {
    const w = [1,1,1,1,5,5,5,5,5,5,2]; // 0–3 rzadkie, 4–9 najczęstsze, 10 niższe
    const total = w.reduce((s, v) => s + v, 0);
    let r = Math.random() * total;
    for (let i = 0; i < w.length; i++) { if (r < w[i]) return i; r -= w[i]; }
    return w.length - 1;
  }

  // ── New question ────────────────────────────────────
  function newQuestion(skipFocus = false) {
    clearAll();
    let na, nb;
    if (currentTab === 'extended') {
      const extW = [1,1,8,8,8,8,8,8,8,8]; // 0,1 rzadkie; 2-9 częste
      const extTotal = extW.reduce((s,v) => s+v, 0);
      function weightedExtFactor() {
        let r = Math.random() * extTotal;
        for (let i = 0; i < extW.length; i++) { if (r < extW[i]) return i; r -= extW[i]; }
        return 9;
      }
      extFlip = !extFlip;
      do {
        const big = Math.floor(Math.random() * 90) + 10;
        const small = weightedExtFactor();
        na = extFlip ? big : small;
        nb = extFlip ? small : big;
      } while (recentQ.some(q => q[0] === na && q[1] === nb));
    } else {
      do { na = weightedFactor(); nb = weightedFactor(); }
      while (recentQ.some(q => q[0] === na && q[1] === nb));
    }
    a = na; b = nb; recentQ.push([a, b]); if (recentQ.length > 10) recentQ.shift();
    correctAnswer = a * b;
    if (currentTab === 'normal') {
      nQuestionEl.textContent = `${a} · ${b}`;
      nInput.value = ''; nSubmitBtn.disabled = true; nFeedback.textContent = ''; nFeedback.className = 'feedback empty';
      if (!skipFocus) nInput.focus();
      startNormalTimer();
    } else if (currentTab === 'extended') {
      eQuestionEl.textContent = `${a} · ${b}`;
      eInput.value = ''; eSubmitBtn.disabled = true; eFeedback.textContent = ''; eFeedback.className = 'feedback empty';
      if (!skipFocus) eInput.focus();
      startExtendedTimer();
    } else {
      tQuestionEl.textContent = `${a} · ${b}`;
      tInput.value = ''; tSubmitBtn.disabled = true; tFeedback.textContent = ''; tFeedback.className = 'feedback empty';
      if (!skipFocus) tInput.focus();
      startCountdown();
    }
  }

  // ── Normal timer (counts up) ────────────────────────
  function startNormalTimer() {
    normalStart = Date.now();
    nTimerEl.textContent = '0 s';
    normalInterval = setInterval(() => {
      nTimerEl.textContent = `${Math.floor((Date.now() - normalStart) / 1000)} s`;
    }, 1000);
  }
  function stopNormalTimer() {
    clearInterval(normalInterval);
    nTimerEl.textContent = `${Math.floor((Date.now() - normalStart) / 1000)} s`;
  }
  function startExtendedTimer() {
    normalStart = Date.now();
    eTimerEl.textContent = '0 s';
    normalInterval = setInterval(() => { eTimerEl.textContent = `${Math.floor((Date.now() - normalStart) / 1000)} s`; }, 1000);
  }
  function stopExtendedTimer() {
    clearInterval(normalInterval);
    eTimerEl.textContent = `${Math.floor((Date.now() - normalStart) / 1000)} s`;
  }

  // ── Countdown timer (counts down) ──────────────────
  function refreshCountdownDisplay() {
    tTimerEl.textContent = `${countdownLeft} s`;
    const ratio = countdownLeft / timedDiff;
    tTimerBox.className = 'stat-box timer-box' +
      (ratio <= 0.2 ? ' danger' : ratio <= 0.5 ? ' warn' : '');
  }
  function startCountdown() {
    countdownLeft = timedDiff;
    refreshCountdownDisplay();
    countdownInterval = setInterval(() => {
      countdownLeft--;
      refreshCountdownDisplay();
      if (countdownLeft <= 0) timeUp();
    }, 1000);
  }
  function stopCountdown() { clearInterval(countdownInterval); }

  function timeUp() {
    if (mode !== 'ask') return;
    stopCountdown();
    mode = 'next';
    tTotal++;
    tScoreEl.textContent = `${tCorrect} / ${tTotal}`;
    tFeedback.textContent = `⏰ Czas minął! Poprawna odpowiedź to ${correctAnswer}.`;
    tFeedback.className = 'feedback bad';
    tReset.disabled = false;
    tInput.blur();
    playWrongAnim();
  }

  // ── Animations ──────────────────────────────────────
  function playCorrectAnim(answer) {
    animLayer.innerHTML = '';

    const flash = document.createElement('div');
    flash.className = 'correct-flash';
    animLayer.appendChild(flash);

    const num = document.createElement('div');
    num.className = 'anim-correct-num';
    num.textContent = answer;
    animLayer.appendChild(num);

    const symbols = ['·','=','★','✦','✧','◆','×'];
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = symbols[i % symbols.length];
      const angle = (360 / 14) * i;
      const dist  = 110 + Math.random() * 80;
      const rad   = angle * Math.PI / 180;
      p.style.setProperty('--tx', `translate(${Math.cos(rad)*dist}px,${Math.sin(rad)*dist}px)`);
      p.style.animationDelay = `${Math.random() * 0.12}s`;
      p.style.fontSize = `${1.2 + Math.random() * 1.2}rem`;
      animLayer.appendChild(p);
    }
    setTimeout(() => { animLayer.innerHTML = ''; }, 1400);
    autoAdvanceTimeout = setTimeout(newQuestion, 1900);
  }

  function playWrongAnim() {
    animLayer.innerHTML = '';
    const flash = document.createElement('div');
    flash.className = 'wrong-flash';
    animLayer.appendChild(flash);
    const x = document.createElement('div');
    x.className = 'anim-wrong-x';
    x.textContent = '✕';
    animLayer.appendChild(x);

    if (currentTab === 'timed') {
      setTimeout(() => { animLayer.innerHTML = ''; }, 1300);
      autoAdvanceTimeout = setTimeout(newQuestion, 1900);
    } else {
      setTimeout(() => { animLayer.innerHTML = ''; const btn = getSubmitBtn(); btn.textContent = 'Dalej'; btn.disabled = false; }, 1300);
    }
  }

  // ── Check answer ────────────────────────────────────
  function checkAnswer(isNormal) {
    if (mode !== 'ask') return;
    mode = 'next';
    if (isNormal === 'extended' || currentTab === 'extended') {
      stopExtendedTimer();
      const ans = Number(eInput.value); eTotal++;
      if (ans === correctAnswer) { eCorrect++;
        eFeedback.textContent = '✅ Brawo! To poprawna odpowiedź.'; eFeedback.className = 'feedback good'; playCorrectAnim(correctAnswer);
      } else {
        eFeedback.textContent = `❌ Niepoprawnie. Poprawna odpowiedź to ${correctAnswer}.`; eFeedback.className = 'feedback bad'; playWrongAnim();
      }
      eScoreEl.textContent = `${eCorrect} / ${eTotal}`; eReset.disabled = false; eInput.blur();
    } else if (isNormal) {
      stopNormalTimer();
      const ans = Number(nInput.value); nTotal++;
      if (ans === correctAnswer) { nCorrect++;
        nFeedback.textContent = '✅ Brawo! To poprawna odpowiedź.'; nFeedback.className = 'feedback good'; playCorrectAnim(correctAnswer);
      } else {
        nFeedback.textContent = `❌ Niepoprawnie. Poprawna odpowiedź to ${correctAnswer}.`; nFeedback.className = 'feedback bad'; playWrongAnim();
      }
      nScoreEl.textContent = `${nCorrect} / ${nTotal}`; nReset.disabled = false; nInput.blur();
    } else {
      stopCountdown();
      const ans = Number(tInput.value); tTotal++;
      if (ans === correctAnswer) { tCorrect++;
        tFeedback.textContent = '✅ Brawo! To poprawna odpowiedź.'; tFeedback.className = 'feedback good'; playCorrectAnim(correctAnswer);
      } else {
        tFeedback.textContent = `❌ Niepoprawnie. Poprawna odpowiedź to ${correctAnswer}.`; tFeedback.className = 'feedback bad'; playWrongAnim();
      }
      tScoreEl.textContent = `${tCorrect} / ${tTotal}`; tReset.disabled = false; tInput.blur();
    }
  }

  // ── Events ──────────────────────────────────────────
  nForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (mode === 'ask' && nInput.value !== '') checkAnswer(true);
    else if (mode === 'next') newQuestion();
  });

  tForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (mode === 'ask' && tInput.value !== '') checkAnswer(false);
    else if (mode === 'next') newQuestion();
  });
  eForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (mode === 'ask' && eInput.value !== '') checkAnswer('extended');
    else if (mode === 'next') newQuestion();
  });

  nReset.addEventListener('click', () => {
    nCorrect = 0; nTotal = 0;
    nScoreEl.textContent = '0 / 0'; nReset.disabled = true;
    document.activeElement.blur();
    newQuestion(true);
  });

  tReset.addEventListener('click', () => {
    tCorrect = 0; tTotal = 0;
    tScoreEl.textContent = '0 / 0'; tReset.disabled = true;
    document.activeElement.blur();
    newQuestion(true);
  });
  eReset.addEventListener('click', () => {
    eCorrect = 0; eTotal = 0;
    eScoreEl.textContent = '0 / 0'; eReset.disabled = true;
    document.activeElement.blur();
    newQuestion(true);
  });

  document.getElementById('btnChangeDiff').addEventListener('click', () => {
    clearAll();
    showDiffScreen();
  });

  // ── Input listeners (enable Sprawdź when non-empty) ─
  nInput.addEventListener('input', () => { nSubmitBtn.disabled = nInput.value === ''; });
  eInput.addEventListener('input', () => { eSubmitBtn.disabled = eInput.value === ''; });
  tInput.addEventListener('input', () => { tSubmitBtn.disabled = tInput.value === ''; });

  // ── Init ────────────────────────────────────────────
  nSubmitBtn.disabled = true; eSubmitBtn.disabled = true; tSubmitBtn.disabled = true;
  nReset.disabled = true; eReset.disabled = true; tReset.disabled = true;
  newQuestion(true);
</script>
</body>
</html>
