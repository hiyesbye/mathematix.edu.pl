// Plain (non-clickable) HTML for a bracket's current content — used in sign-selection UI.
function getBracketDisplayHTML(type) {
  const { rTermsRaw: rt, sqOwnTermsRaw: sqOwn, roundSign: rs, squareSign: ss, var: v } = task;
  const D = m3bracketDone;
  function tH(t, first) { return m3tHp(t.coeff, t.deg, v, first); }
  function mySep(sign, atStart) { return atStart ? (sign > 0 ? '' : '−') : (sign > 0 ? ' + ' : ' − '); }
  if (type === 'r') {
    let s = ''; let a = true;
    rt.forEach(t => { s += tH(t, a); a = false; });
    return `(${s})`;
  }
  // type === 'sq'
  let s = ''; let a = true;
  sqOwn.forEach(t => { s += tH(t, a); a = false; });
  if (D.r) {
    rt.forEach(t => { s += m3tHp(rs * t.coeff, t.deg, v, a); a = false; });
  } else {
    s += mySep(rs, a) + getBracketDisplayHTML('r');
  }
  return `[${s}]`;
}

// Compute flat terms for sign-selection when removing bracket `type`.
// Effective sign accounts for which parent brackets have already been removed.
// curlySign contributes to () only after [] is also done (it can't reach () while [] is still wrapping it).
function getM3StepFlatTerms(type) {
  const { rTermsRaw: rt, sqOwnTermsRaw: sqOwn, cuOwnTermsRaw: cuOwn,
          roundSign: rs, squareSign: ss, curlySign: cs, var: v } = task;
  const D = m3bracketDone;
  // Each item is either a term {kind:'term', absCoeff, deg, var, effectiveSign}
  // or an inner bracket unit {kind:'bracket', bracketType, effectiveSign, displayHTML}.
  const term = (coeff, deg, s) => ({kind:'term', absCoeff: Math.abs(coeff), deg, var: v, effectiveSign: Math.sign(s * coeff) || 1});
  const brk  = (bracketType, effSign) => ({kind:'bracket', bracketType, effectiveSign: effSign, displayHTML: getBracketDisplayHTML(bracketType)});

  if (type === 'r') {
    const s = rs * (D.sq ? ss * (D.cu ? cs : 1) : 1);
    return rt.map(t => term(t.coeff, t.deg, s));
  }
  if (type === 'sq') {
    const s = ss * (D.cu ? cs : 1);
    const items = sqOwn.map(t => term(t.coeff, t.deg, s));
    if (D.r) {
      rt.forEach(t => items.push(term(rs * t.coeff, t.deg, s)));
    } else {
      // () bracket as a unit — user confirms its sign after [] distribution
      items.push(brk('r', Math.sign(s * rs) || 1));
    }
    return items;
  }
  // type === 'cu'
  const s = cs;
  const items = cuOwn.map(t => term(t.coeff, t.deg, s));
  if (D.sq) {
    sqOwn.forEach(t => items.push(term(ss * t.coeff, t.deg, s)));
    if (D.r) {
      rt.forEach(t => items.push(term(ss * rs * t.coeff, t.deg, s)));
    } else {
      items.push(brk('r', Math.sign(s * ss * rs) || 1));
    }
  } else {
    // [] bracket (possibly containing ()) as a unit
    items.push(brk('sq', Math.sign(s * ss) || 1));
  }
  return items;
}

function updateM3BracketVisuals() {
  document.querySelectorAll('#question .m3-brk[data-brk]').forEach(el => {
    const t = el.dataset.brk;
    el.classList.toggle('done',   !!m3bracketDone[t]);
    el.classList.toggle('active', m3bracketActive === t);
  });
}

function selectM3Bracket(type, event) {
  event.stopPropagation();
  if (m3bracketDone[type]) return;

  const flatTerms = getM3StepFlatTerms(type);

  // If this bracket has no own terms, remove it immediately (trivial distribution)
  if (flatTerms.length === 0) {
    m3bracketDone[type] = true;
    document.getElementById('question').innerHTML = task.stateHTMLs[m3StateKey()];
    updateM3BracketVisuals();
    requestAnimationFrame(fitM3Question);
    feedbackEl.className = 'feedback ok';
    feedbackEl.innerHTML = '✅ Dobrze! Kliknij kolejne nawiasy.';
    const needCu = task.depth === 3;
    const allDone = m3bracketDone.r && m3bracketDone.sq && (!needCu || m3bracketDone.cu);
    if (allDone) {
      document.getElementById('qLabel').innerHTML = task.finalLabel;
      buildM3ChipQuestion(task.finalFlatTerms);
      buildM3Step2AnswerUI();
    } else {
      document.getElementById('qLabel').innerHTML = 'Usuń nawiasy:';
      showM3BracketWaitUI();
    }
    return;
  }

  m3bracketActive = type;
  updateM3BracketVisuals();
  feedbackEl.className = 'feedback empty';
  feedbackEl.textContent = '–';
  document.getElementById('qLabel').innerHTML = task.bracketLabels[type];
  buildM3NestedSignUI(flatTerms);
}

function advanceM3Nested() {
  task.currentStep++;
  document.getElementById('qLabel').innerHTML = task.stepLabels[task.currentStep];
  feedbackEl.className = 'feedback empty';
  feedbackEl.textContent = '–';
  if (task.currentStep < task.totalSteps - 1) {
    document.getElementById('question').innerHTML = task.stepQHTMLs[task.currentStep];
    buildM3NestedSignUI();
    requestAnimationFrame(fitM3Question);
  } else {
    buildM3ChipQuestion(task.finalFlatTerms);
    buildM3Step2AnswerUI();
  }
}

// ── M3 chip mechanic (Zredukuj step) ─────────────────
function buildM3ChipQuestion(terms) {
  m3ChipAssign = terms.map(() => -1);
  const q = document.getElementById('question');
  q.style.fontSize = '';
  q.style.whiteSpace = '';
  let html = '<div class="m3-chip-row">';
  terms.forEach((t, i) => {
    const abs = Math.abs(t.coeff);
    const cs = (abs===1&&t.deg>0)?'':String(abs);
    const vs = t.deg===0?'':(t.deg===1?t.var:`${t.var}<sup>${t.deg}</sup>`);
    if (i > 0) html += `<span class="m3-chip-sep">${t.coeff >= 0 ? '+' : '−'}</span>`;
    else if (t.coeff < 0) html += '<span class="m3-chip-sep">−</span>';
    html += `<span class="m3-chip" data-cidx="${i}" onclick="cycleM3Chip(${i})">${cs}${vs}</span>`;
  });
  html += '</div><p class="m3-chip-hint">Kliknij kilka razy, aby zmienić kolor wyrazu</p>';
  q.innerHTML = html;
}

function cycleM3Chip(i) {
  m3ChipAssign[i] = (m3ChipAssign[i] + 2) % 5 - 1; // cycles: -1→0→1→2→3→-1
  const chip = document.querySelector(`.m3-chip[data-cidx="${i}"]`);
  if (chip) chip.className = 'm3-chip' + (m3ChipAssign[i] >= 0 ? ' gc' + m3ChipAssign[i] : '');
}

// ── M3 auto-fit ───────────────────────────────────────
function fitM3Question() {
  if (M !== 3) return;
  const q = document.getElementById('question');
  if (!q || q.querySelector('.m3-chip-row')) return; // skip chip views
  q.style.fontSize = '';
  const avail = q.parentElement ? q.parentElement.clientWidth - 20 : 0;
  if (!avail) return;
  q.style.whiteSpace = 'nowrap';
  const natural = q.scrollWidth;
  if (natural <= 0) return;
  const fs0 = parseFloat(getComputedStyle(q).fontSize); // px at CSS default
  const ratio = avail / natural;
  // clamp: don't shrink below 50% or grow above 180% of CSS font size
  const targetPx = Math.min(fs0 * 1.8, Math.max(fs0 * 0.5, fs0 * ratio));
  q.style.fontSize = targetPx.toFixed(1) + 'px';
}

// ── M3 auto-fit helpers ───────────────────────────────
function fitElemToWidth(el, maxW, startRem) {
  el.style.fontSize = '';
  if (!maxW || el.scrollWidth <= maxW) return;
  let fs = startRem;
  while (el.scrollWidth > maxW && fs > 0.45) {
    fs = Math.round((fs - 0.04) * 100) / 100;
    el.style.fontSize = fs + 'rem';
  }
}
function fitM3QuestionToLine() {
  const wrap = document.querySelector('#question .m3-expr-wrap');
  if (wrap) fitElemToWidth(wrap, document.getElementById('question').offsetWidth - 8, 1.6);
}
function fitM3Step1ToLine() {
  const row = document.getElementById('m3FlatRow');
  if (row) fitElemToWidth(row, document.getElementById('answerArea').offsetWidth - 8, 1.35);
}
function fitM4BlockQuestion() {
  const wrap = document.querySelector('#question .m4-2block-expr');
  if (!wrap) return;
  wrap.style.fontSize = '';
  if (wrap.scrollWidth <= wrap.clientWidth) return;
  const fs0 = parseFloat(getComputedStyle(wrap).fontSize);
  const ratio = wrap.clientWidth / wrap.scrollWidth;
  wrap.style.fontSize = Math.max(fs0 * 0.45, fs0 * ratio).toFixed(1) + 'px';
}
function fitL7Question() {
  if (!task || task.type !== 'm4l7') return;
  const wrap = document.querySelector('#question .m3-expr-wrap');
  if (!wrap) return;
  const q = document.getElementById('question');
  const avail = q.offsetWidth - 16;
  if (!avail) return;
  wrap.style.fontSize = '';
  const fs0 = parseFloat(getComputedStyle(q).fontSize);
  const nat = wrap.scrollWidth;
  if (nat <= 0) return;
  const ratio = avail / nat;
  const targetPx = Math.min(fs0 * 1.8, Math.max(fs0 * 0.45, fs0 * ratio));
  wrap.style.fontSize = targetPx.toFixed(1) + 'px';
}

// ── M4: Jednomian × sumę ──────────────────────────────

// Multi-variable helpers
function mvarsKey(vars) {
  return Object.entries(vars).sort((a,b)=>a[0].localeCompare(b[0]))
    .filter(([,e])=>e>0).map(([l,e])=>l+(e===1?'':String(e))).join('');
}
function mvarsHTML(vars) {
  return Object.entries(vars).sort((a,b)=>a[0].localeCompare(b[0]))
    .filter(([,e])=>e>0).map(([l,e])=>e===1?l:`${l}<sup>${e}</sup>`).join('');
}
function monoMulVars(v1, v2) {
  const r = {...v1};
  for (const [l,e] of Object.entries(v2)) r[l] = (r[l]||0)+e;
  return r;
}
function monoMultiHTML(coeff, vars, wrapNeg=true) {
  const abs = Math.abs(coeff), neg = coeff < 0;
  const hasV = Object.keys(vars).length > 0;
  const cs = (abs===1 && hasV) ? '' : String(abs);
  const inner = (neg?'−':'') + cs + mvarsHTML(vars);
  return (neg && wrapNeg) ? '('+inner+')' : inner;
}
function multiTermsHTML(terms) {
  return terms.map((t, i) => {
    const abs = Math.abs(t.coeff), neg = t.coeff < 0;
    const hasV = Object.keys(t.vars).length > 0;
    const sign = neg ? (i?' − ':'−') : (i?' + ':'');
    const cs = (abs===1 && hasV) ? '' : String(abs);
    return sign + cs + mvarsHTML(t.vars);
  }).join('');
}
function resultTermsHTML(terms) {
  return terms.map((t, i) => {
    const abs = Math.abs(t.coeff), neg = t.coeff < 0;
    const hasV = t.varsDisplay !== '';
    const sign = neg ? (i?' − ':'−') : (i?' + ':'');
    const cs = (abs===1 && hasV) ? '' : String(abs);
    return sign + cs + t.varsDisplay;
  }).join('');
}

// Generate sum terms for multi-variable problems; returns 0..nTerms items
function genMultiSumTerms(monoVars, nTerms) {
  const monoLetters = Object.keys(monoVars);
  const extras = shuffle([...VARS].filter(v => !monoLetters.includes(v))).slice(0, 3);
  const pool = [...monoLetters, ...extras];
  const usedSigs = new Set();
  const terms = [];
  let att = 0;
  while (terms.length < nTerms && att++ < 200) {
    const r = Math.random();
    let termVars = {};
    if (r < 0.25) {
      // constant
    } else if (r < 0.80) {
      const l = pick(pool);
      const d = rnd(1, 3);
      termVars = {[l]: d};
    } else {
      const [l1, l2] = shuffle([...pool]).slice(0, 2);
      termVars = {[l1]: 1, [l2]: 1};
    }
    const resVars = monoMulVars(monoVars, termVars);
    const totalDeg = Object.values(resVars).reduce((s,v)=>s+v, 0);
    if (totalDeg > 5) continue;
    const sig = mvarsKey(resVars);
    if (usedSigs.has(sig)) continue;
    usedSigs.add(sig);
    terms.push({coeff: rndNZ(-6, 6), vars: termVars});
  }
  // sort by result total degree desc
  terms.sort((a, b) => {
    const da = Object.values(monoMulVars(monoVars, a.vars)).reduce((s,v)=>s+v, 0);
    const db = Object.values(monoMulVars(monoVars, b.vars)).reduce((s,v)=>s+v, 0);
    return db - da;
  });
  return terms;
}

function genM4() {
  if (L === 1) return genM4Lv1();
  if (L === 2) return genM4Lv2();
  if (L === 3) return genM4Lv3();
  if (L === 4) return genM4Lv4();
  if (L === 5) return genM4Lv5();
  if (L === 6) return genM4Lv7();
  return genM4L7Frac();
}

function genM4Lv1() {
  const v = pick(VARS);
  let k;
  do { k = rndNZ(-8, 8); } while (k === 1 || (k === -1 && Math.random() < 0.95));
  const nTerms = rnd(2, 3);
  const sumPoly = {};
  for (let d = 0; d < nTerms; d++) sumPoly[d] = rndNZ(-6, 6);
  const answer = pClean(pScale(sumPoly, k));
  const kHTML = k < 0 ? `−${Math.abs(k)}` : String(k);
  const sumDisp = polyHTMLv(sumPoly, v);
  const qHTML = `<span class="m3-expr-wrap">${kHTML}(${sumDisp})</span>`;
  const maxDeg = nTerms - 1;
  const resultTerms = [];
  for (let d = maxDeg; d >= 0; d--) {
    const vd = d === 0 ? '' : d === 1 ? v : `${v}<sup>${d}</sup>`;
    resultTerms.push({coeff: answer[d], vars: {}, varsDisplay: vd});
  }
  return {
    type: 'multimono-sum',
    qHTML, qLabel: 'Wykonaj mnożenie:',
    resultTerms, solHTML: resultTermsHTML(resultTerms),
    key: `m4l1:${k}*(${sumDisp})`
  };
}

function genM4Lv2() {
  let att = 0;
  while (att++ < 60) {
    const v = pick(VARS);
    const nTerms = rnd(2, 3);
    const divisor = rnd(2, 6);
    const resPoly = {};
    for (let d = 0; d < nTerms; d++) resPoly[d] = rndNZ(-4, 4);
    const sumPoly = pScale(resPoly, divisor);
    const sumDisp = polyHTMLv(sumPoly, v);
    const sumBr = `(${sumDisp})`;
    const useFrac = Math.random() < 0.5;
    let qHTML;
    if (useFrac) {
      qHTML = `<span class="m3-expr-wrap"><span class="m4-frac"><span class="m4-frac-num">${sumBr}</span><span class="m4-frac-bar"></span><span class="m4-frac-den">${divisor}</span></span></span>`;
    } else {
      qHTML = `<span class="m3-expr-wrap">${sumBr} ÷ ${divisor}</span>`;
    }
    const maxDeg = nTerms - 1;
    const resultTerms = [];
    for (let d = maxDeg; d >= 0; d--) {
      const vd = d === 0 ? '' : d === 1 ? v : `${v}<sup>${d}</sup>`;
      resultTerms.push({coeff: resPoly[d], vars: {}, varsDisplay: vd});
    }
    return {
      type: 'multimono-sum',
      qHTML, qLabel: 'Oblicz:',
      resultTerms, solHTML: resultTermsHTML(resultTerms),
      key: `m4l2:${sumDisp}/${divisor}`
    };
  }
}

function genM4Lv3() {
  let att = 0;
  while (att++ < 80) {
    const r = Math.random();
    const nLetters = r < 0.40 ? 1 : r < 0.85 ? 2 : 3;
    const letters = shuffle([...VARS]).slice(0, nLetters);
    const monoVars = {};
    for (const l of letters) monoVars[l] = 1;
    const monoCoeff = rndNZ(-6, 6);
    const nTerms = rnd(2, 3);
    const sumTerms = genMultiSumTerms(monoVars, nTerms);
    if (sumTerms.length < 2) continue;
    const resultTerms = sumTerms.map(t => {
      const c = monoCoeff * t.coeff;
      const rv = monoMulVars(monoVars, t.vars);
      return {coeff: c, vars: rv, varsDisplay: mvarsHTML(rv)};
    });
    const allLettersLv3 = new Set(resultTerms.flatMap(t => Object.keys(t.vars).filter(l => t.vars[l] > 0)));
    if (allLettersLv3.size > 3) continue;
    const monoDisp = monoMultiHTML(monoCoeff, monoVars, false);
    const sumDisp = multiTermsHTML(sumTerms);
    const qHTML = `<span class="m3-expr-wrap">${monoDisp}(${sumDisp})</span>`;
    return {
      type: 'multimono-sum', multiVarAnswer: true,
      qHTML, qLabel: 'Wykonaj mnożenie:',
      resultTerms, solHTML: resultTermsHTML(resultTerms),
      key: `m4l3:${monoDisp}*(${sumDisp})`
    };
  }
}

// ── shared helpers for Lv4a/4b two-step ──────────────
function m4CollectResults(blockResultTerms) {
  const collected = {};
  for (const bTerms of blockResultTerms) {
    for (const t of bTerms) {
      const k = mvarsKey(t.vars) || '_c';
      if (!collected[k]) collected[k] = { vars: t.vars, coeff: 0 };
      collected[k].coeff += t.coeff;
    }
  }
  return Object.values(collected)
    .filter(t => t.coeff !== 0)
    .sort((a, b) => {
      const da = Object.values(a.vars).reduce((s,e)=>s+e,0);
      const db = Object.values(b.vars).reduce((s,e)=>s+e,0);
      if (db !== da) return db - da;
      return (mvarsKey(a.vars)||'_c').localeCompare(mvarsKey(b.vars)||'_c');
    })
    .map(t => ({ ...t, varsDisplay: mvarsHTML(t.vars) }));
}
function m4Phase2QHTML(blockResultTerms) {
  const all = blockResultTerms.flat();
  let s = '';
  all.forEach((t, i) => {
    const neg = t.coeff < 0;
    const sign = neg ? (i?' − ':'−') : (i?' + ':'');
    const abs = Math.abs(t.coeff), hasV = t.varsDisplay !== '';
    const cs = (abs===1&&hasV)?'':String(abs);
    s += sign+cs+t.varsDisplay;
  });
  return `<span class="m3-expr-wrap">${s}</span>`;
}
function m4GenMulBlock(sharedLetters, b, simple=false) {
  let monoVars = {}, monoCoeff;
  const mt = Math.random();
  if (mt < 0.20) {
    monoVars = {}; monoCoeff = rnd(2,5);
  } else if (simple || mt < 0.70) {
    const l = sharedLetters[Math.floor(Math.random()*sharedLetters.length)];
    monoVars = {[l]:1}; monoCoeff = rnd(1,4);
  } else {
    const l = sharedLetters[Math.floor(Math.random()*sharedLetters.length)];
    monoVars = {[l]:2}; monoCoeff = rnd(1,3);
  }
  const blockSign = b===0?1:(Math.random()<0.5?1:-1);
  const nTerms = rnd(2,3), usedSigs = new Set(), sumTerms = [];
  let sat=0;
  while (sumTerms.length<nTerms && sat++<200) {
    const r=Math.random();
    let tv={};
    if (r<0.20) {} else if (r<0.75||sharedLetters.length<2) {
      const l=sharedLetters[Math.floor(Math.random()*sharedLetters.length)]; tv={[l]:1};
    } else {
      const [l1,l2]=shuffle([...sharedLetters]); tv={[l1]:1,[l2]:1};
    }
    const rv=monoMulVars(monoVars,tv);
    if (Object.values(rv).reduce((s,v)=>s+v,0)>4) continue;
    const sig=mvarsKey(rv)||'_c';
    if (usedSigs.has(sig)) continue;
    usedSigs.add(sig);
    sumTerms.push({coeff:rndNZ(-4,4),vars:tv});
  }
  if (sumTerms.length<2) return null;
  sumTerms.sort((a,bT)=>{
    const da=Object.values(monoMulVars(monoVars,a.vars)).reduce((s,v)=>s+v,0);
    const db=Object.values(monoMulVars(monoVars,bT.vars)).reduce((s,v)=>s+v,0);
    return db-da;
  });
  return {kind:'mul', monoVars, monoCoeff, blockSign, sumTerms};
}

function genM4Lv4() {
  let att=0;
  while (att++<120) {
    const nVars=Math.random()<0.45?1:2;
    const sharedLetters=shuffle([...VARS]).slice(0,nVars);
    const nBlocks=2;
    const blocks=[];
    for (let b=0;b<nBlocks;b++) {
      const bl=m4GenMulBlock(sharedLetters,b,true);
      if (!bl) { blocks.length=0; break; }
      blocks.push(bl);
    }
    if (blocks.length<2) continue;

    const blockResultTerms=blocks.map(bl=>
      bl.sumTerms.map(st=>{
        const c=bl.blockSign*bl.monoCoeff*st.coeff;
        const rv=monoMulVars(bl.monoVars,st.vars);
        return {coeff:c,vars:rv,varsDisplay:mvarsHTML(rv)};
      })
    );
    const resultTerms=m4CollectResults(blockResultTerms);
    if (resultTerms.length<2) continue;
    const allLettersLv4 = new Set(resultTerms.flatMap(t => Object.keys(t.vars).filter(l => t.vars[l] > 0)));
    if (allLettersLv4.size > 3) continue;

    let qInner='';
    for (let b=0;b<blocks.length;b++) {
      const {monoVars,monoCoeff,blockSign,sumTerms}=blocks[b];
      const monoDisp=monoMultiHTML(monoCoeff,monoVars,false);
      const sumDisp=multiTermsHTML(sumTerms);
      if (b===0) { qInner+=monoDisp; }
      else { qInner+=blockSign>0?' + ':' − '; qInner+=monoDisp; }
      qInner+=`(${sumDisp})`;
    }
    return {
      type:'multi-block-expand', phase:1, multiVarAnswer:true,
      qHTML:`<span class="m3-expr-wrap m4-2block-expr">${qInner}</span>`,
      qLabel:'Wykonaj mnożenie i uprość:',
      blocks, blockResultTerms, resultTerms,
      phase2QHTML:m4Phase2QHTML(blockResultTerms),
      solHTML:resultTermsHTML(resultTerms),
      key:`m4l4:${qInner}`
    };
  }
}

function genM4Lv5() {
  let att=0;
  while (att++<150) {
    const nVars=Math.random()<0.45?1:2;
    const sharedLetters=shuffle([...VARS]).slice(0,nVars);
    const nBlocks=2;
    // at least 1 'div' block, at most nBlocks
    const nDiv=rnd(1,nBlocks);
    const divIdx=new Set(shuffle([...Array(nBlocks).keys()]).slice(0,nDiv));

    const blocks=[];
    for (let b=0;b<nBlocks;b++) {
      if (divIdx.has(b)) {
        // sum ÷ divisor
        const divisor=rnd(2,5);
        const blockSign=b===0?1:(Math.random()<0.5?1:-1);
        const nTerms=rnd(2,3), usedVK=new Set(), sumTerms=[];
        let sat=0;
        while (sumTerms.length<nTerms && sat++<200) {
          const r=Math.random();
          let tv={};
          if (r<0.25) {} else if (r<0.75||sharedLetters.length<2) {
            const l=sharedLetters[Math.floor(Math.random()*sharedLetters.length)]; tv={[l]:1};
          } else {
            const [l1,l2]=shuffle([...sharedLetters]); tv={[l1]:1,[l2]:1};
          }
          const vk=mvarsKey(tv)||'_c';
          if (usedVK.has(vk)) continue;
          const mult=rndNZ(-4,4);
          usedVK.add(vk);
          sumTerms.push({coeff:mult*divisor,vars:tv});
        }
        if (sumTerms.length<2) { blocks.length=0; break; }
        sumTerms.sort((a,bT)=>
          Object.values(bT.vars).reduce((s,v)=>s+v,0)-Object.values(a.vars).reduce((s,v)=>s+v,0)
        );
        blocks.push({kind:'div',divisor,blockSign,sumTerms,monoVars:{},monoCoeff:1});
      } else {
        const bl=m4GenMulBlock(sharedLetters,b,true);
        if (!bl) { blocks.length=0; break; }
        blocks.push(bl);
      }
    }
    if (blocks.length<2) continue;

    const blockResultTerms=blocks.map(bl=>{
      if (bl.kind==='div') {
        return bl.sumTerms.map(st=>({
          coeff:bl.blockSign*st.coeff/bl.divisor,
          vars:st.vars, varsDisplay:mvarsHTML(st.vars)
        }));
      }
      return bl.sumTerms.map(st=>{
        const c=bl.blockSign*bl.monoCoeff*st.coeff;
        const rv=monoMulVars(bl.monoVars,st.vars);
        return {coeff:c,vars:rv,varsDisplay:mvarsHTML(rv)};
      });
    });
    const resultTerms=m4CollectResults(blockResultTerms);
    if (resultTerms.length<2) continue;
    const allLettersLv5 = new Set(resultTerms.flatMap(t => Object.keys(t.vars).filter(l => t.vars[l] > 0)));
    if (allLettersLv5.size > 3) continue;

    let qInner='';
    for (let b=0;b<blocks.length;b++) {
      const bl=blocks[b];
      const sumDisp=multiTermsHTML(bl.sumTerms);
      let blockExpr;
      if (bl.kind==='div') {
        blockExpr=`<span class="m4-frac"><span class="m4-frac-num">${sumDisp}</span><span class="m4-frac-bar"></span><span class="m4-frac-den">${bl.divisor}</span></span>`;
      } else {
        blockExpr=`${monoMultiHTML(bl.monoCoeff,bl.monoVars,false)}(${sumDisp})`;
      }
      if (b===0) { if (bl.blockSign<0) qInner+='−'; qInner+=blockExpr; }
      else { qInner+=bl.blockSign>0?' + ':' − '; qInner+=blockExpr; }
    }
    return {
      type:'multi-block-expand', phase:1, multiVarAnswer:true,
      qHTML:`<span class="m3-expr-wrap m4-2block-expr">${qInner}</span>`,
      qLabel:'Wykonaj działania i uprość:',
      blocks, blockResultTerms, resultTerms,
      phase2QHTML:m4Phase2QHTML(blockResultTerms),
      solHTML:resultTermsHTML(resultTerms),
      key:`m4l5:${qInner}`
    };
  }
}

function genM4Lv7() {
  let att = 0;
  while (att++ < 80) {
    const r = Math.random();
    const nLetters = r < 0.35 ? 1 : r < 0.85 ? 2 : 3;
    const letters = shuffle([...VARS]).slice(0, nLetters);
    const monoVars = {};
    for (const l of letters) monoVars[l] = 1;
    const monoCoeff = rndNZ(-6, 6);
    const nTerms = rnd(2, 3);
    const sumTerms = genMultiSumTerms(monoVars, nTerms);
    if (sumTerms.length < 2) continue;
    const fillTerms = sumTerms.map(t => {
      const c = monoCoeff * t.coeff;
      const rv = monoMulVars(monoVars, t.vars);
      const vars = Object.entries(rv).sort((a,b)=>a[0].localeCompare(b[0])).map(([l,e])=>({l,e}));
      return {coeff: c, vars};
    });
    const allLettersLv7 = new Set(fillTerms.flatMap(t => t.vars.map(v => v.l)));
    if (allLettersLv7.size > 3) continue;
    const monoDisp = monoMultiHTML(monoCoeff, monoVars, false);
    const sumDisp = multiTermsHTML(sumTerms);
    const qHTML = `<span class="m3-expr-wrap">${monoDisp}(${sumDisp})</span>`;
    const solHTML = fillTerms.map((t, i) => {
      const neg = t.coeff < 0, abs = Math.abs(t.coeff);
      const sign = neg ? (i?' − ':'−') : (i?' + ':'');
      const hasV = t.vars.length > 0;
      const cs = (abs===1 && hasV) ? '' : String(abs);
      const vs = t.vars.map(({l,e})=>e===1?l:`${l}<sup>${e}</sup>`).join('');
      return sign + cs + vs;
    }).join('');
    return {
      type: 'multimono-fill',
      qHTML, qLabel: 'Wykonaj mnożenie:',
      fillTerms, solHTML,
      key: `m4l5:${monoDisp}*(${sumDisp})`
    };
  }
}

// ── M4 Lv7: ułamek × liczbę (klikanie elementów) ─────

function gcdFunc(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { const t = b; b = a % b; a = t; }
  return a || 1;
}

function genM4L7Frac() {
  const isHard = m5Mode === 'hard';
  let att = 0;
  while (att++ < 200) {
    // Shared variable structure: both numerators use the same letters (creates like terms)
    const nNum = rnd(2, 3);
    const varCount = nNum - 1;
    const sharedLetters = shuffle([...VARS]).slice(0, varCount);
    // sharedVarSets: varCount variable slots + 1 constant slot
    const sharedVarSets = [...sharedLetters.map(l => ({ [l]: 1 })), {}];
    const maxMul = nNum >= 3 ? 3 : 4; // smaller range for 3-term to keep expression compact

    const fracTerms = [];
    let genOk = true;

    for (let ti = 0; ti < 2; ti++) {
      const denom = pick([2, 3, 4, 5, 6, 7]);
      const outer = rnd(2, isHard ? 7 : 5);
      const numVarSets = sharedVarSets.map(vs => ({ ...vs }));
      const numCoeffs = numVarSets.map(() => denom * rndNZ(-maxMul, maxMul));

      const sign = ti === 0 ? 1 : (Math.random() < 0.5 ? 1 : -1);
      const g = gcdFunc(outer, denom);
      const resultTerms = numCoeffs.map((c, i) => ({
        coeff: sign * outer * c / denom,
        vars: numVarSets[i]
      })).filter(r => r.coeff !== 0);

      if (resultTerms.length === 0) { genOk = false; break; }
      fracTerms.push({
        sign, outer, numCoeffs, numVarSets, denom, gcdOD: g, resultTerms,
        l7phase: 'idle', l7curOuter: outer, l7curDenom: denom, l7interCoeffs: null,
      });
    }

    if (!genOk || fracTerms.length < 2) continue;

    const allFlat = fracTerms.flatMap(ft => ft.resultTerms);
    const finalTerms = m5Reduce(allFlat);
    if (finalTerms.length === 0) continue;
    if (finalTerms.some(r => Math.abs(r.coeff) > 80)) continue;

    const needsReduction = finalTerms.length < allFlat.length;
    const tempTask = { fracTerms, phase: 'tasks', l7sel: null, l7actionTi: null, l7actionType: null };
    const qHTML = l7QuestionHTML(tempTask);
    const solHTML = multiTermsHTML(finalTerms);

    return {
      type: 'm4l7', qLabel: 'Wykonaj mnożenie:',
      fracTerms, finalTerms, needsReduction, qHTML, solHTML,
      key: `m4l7:${solHTML}`,
      phase: 'tasks',
      l7sel: null, l7actionTi: null, l7actionType: null,
    };
  }
}

function m4l7NumHTML(ft) {
  return ft.numCoeffs.map((c, i) => {
    const abs = Math.abs(c), neg = c < 0;
    const hasV = Object.keys(ft.numVarSets[i]).length > 0;
    const sign = neg ? (i ? ' − ' : '−') : (i ? ' + ' : '');
    const cs = (abs === 1 && hasV) ? '' : String(abs);
    return sign + cs + mvarsHTML(ft.numVarSets[i]);
  }).join('');
}

function l7CoeffsHTML(coeffs, varSets) {
  return coeffs.map((c, i) => {
    const abs = Math.abs(c), neg = c < 0;
    const hasV = Object.keys(varSets[i]).length > 0;
    const sign = neg ? (i ? ' − ' : '−') : (i ? ' + ' : '');
    const cs = (abs === 1 && hasV) ? '' : String(abs);
    return sign + cs + mvarsHTML(varSets[i]);
  }).join('');
}

function l7SelCls(t, ti, el) {
  if (t.l7sel && t.l7sel.ti === ti && t.l7sel.el === el) return ' l7-hl';
  if (t.l7actionTi === ti) {
    const at = t.l7actionType;
    if (at === 'mul'  && (el === 'outer' || el === 'numer')) return ' l7-hl';
    if (at === 'div'  && (el === 'numer' || el === 'denom')) return ' l7-hl';
    if (at === 'simp' && (el === 'outer' || el === 'denom')) return ' l7-hl';
  }
  return '';
}

function l7TermHTML(t, ft, ti) {
  const ph = ft.l7phase, cO = ft.l7curOuter, cD = ft.l7curDenom;
  const sc = el => l7SelCls(t, ti, el);
  const sgn = ft.sign < 0 ? '−' : '';

  if (ph === 'post-mul') {
    const nH = `<span class="l7-el l7-numer${sc('numer')}" onclick="l7Click('numer',${ti})">${l7CoeffsHTML(ft.l7interCoeffs, ft.numVarSets)}</span>`;
    const dH = `<span class="l7-el${sc('denom')}" onclick="l7Click('denom',${ti})">${cD}</span>`;
    return `<span class="m4-frac">${nH}<span class="m4-frac-bar"></span>${dH}</span>`;
  }
  if (ph === 'post-div') {
    const oH = `<span class="l7-el${sc('outer')}" onclick="l7Click('outer',${ti})">${sgn}${cO}</span>`;
    const nH = `<span class="l7-el l7-numer${sc('numer')}" onclick="l7Click('numer',${ti})">(${l7CoeffsHTML(ft.l7interCoeffs, ft.numVarSets)})</span>`;
    return `${oH}&thinsp;&middot;&thinsp;${nH}`;
  }

  let oH;
  if (ph === 'simp-active') {
    oH = `<span class="l7-el l7-cancel-el l7-hl">${sgn}<sup><input class="l7-simp-inp" id="l7si_o_${ti}" type="number" inputmode="numeric" min="1" oninput="updateSubmit()"></sup><span class="l7-struck">${cO}</span></span>`;
  } else if (ph === 'post-simp') {
    oH = `<span class="l7-el l7-cancel-el${sc('outer')}" onclick="l7Click('outer',${ti})">${sgn}<sup class="l7-cancel-val">${cO}</sup><span class="l7-struck">${ft.outer}</span></span>`;
  } else {
    oH = `<span class="l7-el${sc('outer')}" onclick="l7Click('outer',${ti})">${sgn}${cO}</span>`;
  }

  const srcCoeffs = ft.l7interCoeffs ?? ft.numCoeffs;
  const nH = `<span class="l7-el l7-numer${sc('numer')}" onclick="l7Click('numer',${ti})">${l7CoeffsHTML(srcCoeffs, ft.numVarSets)}</span>`;

  let dH = null;
  if (cD > 1) {
    if (ph === 'simp-active') {
      dH = `<span class="l7-el l7-cancel-el l7-hl"><span class="l7-struck">${ft.denom}</span><sub><input class="l7-simp-inp" id="l7si_d_${ti}" type="number" inputmode="numeric" min="1" oninput="updateSubmit()"></sub></span>`;
    } else if (ph === 'post-simp') {
      dH = `<span class="l7-el l7-cancel-el${sc('denom')}" onclick="l7Click('denom',${ti})"><span class="l7-struck">${ft.denom}</span><sub class="l7-cancel-val">${cD}</sub></span>`;
    } else {
      dH = `<span class="l7-el${sc('denom')}" onclick="l7Click('denom',${ti})">${cD}</span>`;
    }
  }

  if (!dH) return `${oH}&thinsp;&middot;&thinsp;(${nH})`;
  return `${oH}&thinsp;&middot;&thinsp;<span class="m4-frac">${nH}<span class="m4-frac-bar"></span>${dH}</span>`;
}

function l7QuestionHTML(t) {
  t = t ?? task;
  let html = '<span class="m3-expr-wrap" style="white-space:nowrap">';
  let hasContent = false;
  t.fracTerms.forEach((ft, ti) => {
    if (ft.l7phase === 'expanded') {
      ft.resultTerms.forEach(rt => {
        const neg = rt.coeff < 0, abs = Math.abs(rt.coeff);
        const hasV = Object.keys(rt.vars).length > 0;
        const prefix = !hasContent ? (neg ? '−' : '') : (neg ? ' − ' : ' + ');
        const cs = (abs === 1 && hasV) ? '' : String(abs);
        html += prefix + cs + mvarsHTML(rt.vars);
        hasContent = true;
      });
    } else {
      const outerVisible = ft.l7phase !== 'post-mul';
      const prefix = !hasContent ? '' : (ft.sign < 0 && outerVisible ? ' ' : ' + ');
      html += prefix + l7TermHTML(t, ft, ti);
      hasContent = true;
    }
  });
  html += '</span>';
  return html;
}

function buildM4L7UI() {
  const area = document.getElementById('answerArea');
  document.getElementById('m4FillHint').style.display = 'none';
  const t = task;

  document.getElementById('question').innerHTML = l7QuestionHTML();
  requestAnimationFrame(fitL7Question);

  if (t.phase === 'combine') {
    const allFlat = t.fracTerms.flatMap(ft => ft.resultTerms);
    m5BuildChipQuestion(allFlat);
    m4MultiSigns = t.finalTerms.map(() => 1);
    const lbl = t.needsReduction ? 'Zredukuj wyrazy podobne i wpisz wynik:' : 'Wpisz wynik końcowy:';
    let html = `<div class="m4-phase-label">${lbl}</div>`;
    html += '<div class="poly-inputs m3-step2-inputs">';
    t.finalTerms.forEach((ft2, i) => {
      if (i > 0) html += '<span class="plus-sep">&thinsp;</span>';
      const hasV = Object.keys(ft2.vars).length > 0;
      html += `<div class="coeff-group">
        <button class="sign-btn" data-m4sign="${i}" type="button" onclick="toggleM4Sign(${i})">+</button>
        <input class="coeff-input" data-m4idx="${i}" ${hasV ? 'data-hasv="1"' : ''} type="number" inputmode="numeric">
        ${hasV ? `<span class="coeff-var">${mvarsHTML(ft2.vars)}</span>` : ''}
      </div>`;
    });
    html += '</div>';
    area.innerHTML = html;
    area.querySelectorAll('input').forEach(el => el.addEventListener('input', updateSubmit));
    updateSubmit();
    area.querySelector('input').focus();
    return;
  }

  const at = t.l7actionType;

  if (!at) {
    area.innerHTML = '<div class="m4-phase-label l7-hint">Kliknij dwa elementy tego samego członu, aby wykonać działanie.</div>';
    submitBtn.disabled = true;
    return;
  }

  if (at === 'simp') {
    area.innerHTML = '<div class="m4-phase-label l7-hint">Wpisz wyniki skrócenia w kratki w przykładzie powyżej.</div>';
    updateSubmit();
    const ti = t.l7actionTi;
    setTimeout(() => document.getElementById(`l7si_o_${ti}`)?.focus(), 30);
    return;
  }

  const ti = t.l7actionTi;
  const ft = t.fracTerms[ti];
  const varLabels = ft.numVarSets.map(vs => mvarsHTML(vs));

  const buildTermInputs = () => {
    m4l7Signs = varLabels.map(() => 1);
    let h = '<div class="poly-inputs m3-step2-inputs">';
    varLabels.forEach((lbl, i) => {
      if (i > 0) h += '<span class="plus-sep">&thinsp;</span>';
      h += `<div class="coeff-group">
        <button class="sign-btn" data-l7sign="${i}" type="button" onclick="toggleL7Sign(${i})">+</button>
        <input class="coeff-input" data-l7inter="${i}" ${lbl ? 'data-hasv="1"' : ''} type="number" inputmode="numeric">
        ${lbl ? `<span class="coeff-var">${lbl}</span>` : ''}
      </div>`;
    });
    h += '</div>';
    return h;
  };

  if (at === 'mul') {
    const signedO = ft.sign * ft.l7curOuter;
    const signedOStr = signedO < 0 ? `(−${Math.abs(signedO)})` : String(signedO);
    let html = `<div class="m4-phase-label">Pomnóż ${signedOStr} przez każdy wyraz licznika:</div>`;
    html += buildTermInputs();
    area.innerHTML = html;
    area.querySelectorAll('input').forEach(el => el.addEventListener('input', updateSubmit));
    updateSubmit();
    area.querySelector('input').focus();
    return;
  }

  if (at === 'div') {
    const cD = ft.l7curDenom;
    const srcCoeffs = ft.l7interCoeffs ?? ft.numCoeffs;
    const ctxHTML = srcCoeffs.map((c, i) => {
      const abs = Math.abs(c), neg = c < 0, hasV = varLabels[i] !== '';
      const sign = neg ? (i ? ' − ' : '−') : (i ? ' + ' : '');
      const cs = (abs === 1 && hasV) ? '' : String(abs);
      return sign + cs + varLabels[i];
    }).join('');
    let html = `<div class="m4-phase-label">Podziel przez ${cD}: &ensp;<strong>${ctxHTML}</strong></div>`;
    html += buildTermInputs();
    area.innerHTML = html;
    area.querySelectorAll('input').forEach(el => el.addEventListener('input', updateSubmit));
    updateSubmit();
    area.querySelector('input').focus();
    return;
  }
}

function toggleL7Sign(i) {
  m4l7Signs[i] = -m4l7Signs[i];
  const btn = document.querySelector(`[data-l7sign="${i}"].sign-btn`);
  if (!btn) return;
  const neg = m4l7Signs[i] < 0;
  btn.textContent = neg ? '−' : '+';
  btn.className = 'sign-btn' + (neg ? ' neg' : '');
}

function l7Click(el, ti) {
  const t = task;
  if (t.l7actionTi !== null) return;
  const ft = t.fracTerms[ti];

  if (t.l7sel && t.l7sel.ti === ti && t.l7sel.el === el) {
    t.l7sel = null;
    buildM4L7UI();
    return;
  }

  if (!t.l7sel || t.l7sel.ti !== ti) {
    t.l7sel = { ti, el };
    buildM4L7UI();
    return;
  }

  const pair = [t.l7sel.el, el].sort().join('+');
  t.l7sel = null;

  if (pair === 'numer+outer') {
    if (['idle', 'post-simp', 'post-div'].includes(ft.l7phase)) l7TriggerAction(ti, 'mul');
    else buildM4L7UI();
  } else if (pair === 'denom+outer') {
    const g = gcdFunc(ft.l7curOuter, ft.l7curDenom);
    if (g > 1 && ['idle', 'post-mul', 'post-div'].includes(ft.l7phase)) l7TriggerAction(ti, 'simp');
    else buildM4L7UI();
  } else if (pair === 'denom+numer') {
    if (['idle', 'post-simp', 'post-mul'].includes(ft.l7phase)) l7TriggerAction(ti, 'div');
    else buildM4L7UI();
  } else {
    buildM4L7UI();
  }
}

function l7TriggerAction(ti, action) {
  const t = task;
  const ft = t.fracTerms[ti];
  t.l7actionTi = ti;
  t.l7actionType = action;
  ft.l7phase = action + '-active';
  if (action === 'mul' || action === 'div') {
    m4l7Signs = ft.numVarSets.map(() => 1);
  }
  buildM4L7UI();
}

function checkM4L7() {
  const t = task;
  const okFb = msg => { feedbackEl.className = 'feedback ok'; feedbackEl.innerHTML = '✅ ' + msg; };
  const badFb = msg => { feedbackEl.className = 'feedback bad'; feedbackEl.innerHTML = '❌ ' + msg; };

  if (t.phase === 'combine') {
    const allOk = t.finalTerms.every((ft2, i) => {
      const inp = document.querySelector(`[data-m4idx="${i}"]`);
      const absVal = inp && inp.value !== '' ? Math.abs(Number(inp.value)) : (inp?.dataset.hasv ? 1 : 0);
      return m4MultiSigns[i] * absVal === ft2.coeff;
    });
    mode = 'next';
    clearTimeout(autoAdv);
    stopTimer();
    tot++;
    if (allOk) {
      ok++; playOk();
      feedbackEl.className = 'feedback good';
      feedbackEl.innerHTML = `✅ Brawo! Wynik: <strong>${task.solHTML}</strong>`;
    } else {
      playBad();
      feedbackEl.className = 'feedback bad';
      feedbackEl.innerHTML = `❌ Źle! Poprawna odpowiedź: <strong>${task.solHTML}</strong>`;
    }
    scoreEl.textContent = `${ok} / ${tot}`;
    resetBtn.disabled = false;
    submitBtn.disabled = true;
    nextBtn.style.display = '';
    return;
  }

  const ti = t.l7actionTi;
  const ft = t.fracTerms[ti];
  const at = t.l7actionType;

  const readInps = () => [...document.querySelectorAll('[data-l7inter]')].map((inp, i) => {
    const abs = inp.value === '' && inp.dataset.hasv ? 1 : Math.abs(parseInt(inp.value || '0', 10));
    return m4l7Signs[i] * abs;
  });

  if (at === 'simp') {
    const sO = parseInt(document.getElementById(`l7si_o_${ti}`)?.value || '', 10);
    const sD = parseInt(document.getElementById(`l7si_d_${ti}`)?.value || '', 10);
    const g = gcdFunc(ft.l7curOuter, ft.l7curDenom);
    if (sO !== ft.l7curOuter / g || sD !== ft.l7curDenom / g) { badFb('Sprawdź skrócenie.'); return; }
    ft.l7curOuter = sO;
    ft.l7curDenom = sD;
    ft.l7phase = 'post-simp';
    t.l7actionTi = null; t.l7actionType = null;
    okFb('Dobrze!');
    l7CheckDone();
    return;
  }

  if (at === 'mul') {
    const signedO = ft.sign * ft.l7curOuter;
    const srcCoeffs = ft.l7interCoeffs ?? ft.numCoeffs;
    const expected = srcCoeffs.map(c => signedO * c);
    const got = readInps();
    if (!got.every((v, i) => v === expected[i])) { badFb('Sprawdź mnożenie.'); return; }
    ft.l7interCoeffs = expected;
    ft.l7curOuter = 1;
    t.l7actionTi = null; t.l7actionType = null;
    okFb('Dobrze!');
    if (ft.l7curDenom === 1) {
      ft.l7phase = 'expanded';
    } else {
      ft.l7phase = 'post-mul';
    }
    l7CheckDone();
    return;
  }

  if (at === 'div') {
    const srcCoeffs = ft.l7interCoeffs ?? ft.numCoeffs;
    const expected = srcCoeffs.map(c => c / ft.l7curDenom);
    const got = readInps();
    if (!got.every((v, i) => v === expected[i])) { badFb('Sprawdź dzielenie.'); return; }
    ft.l7interCoeffs = expected;
    ft.l7curDenom = 1;
    t.l7actionTi = null; t.l7actionType = null;
    okFb('Dobrze!');
    if (ft.l7curOuter === 1) {
      ft.l7phase = 'expanded';
    } else {
      ft.l7phase = 'post-div';
    }
    l7CheckDone();
    return;
  }
}

function l7CheckDone() {
  const t = task;
  if (t.fracTerms.every(ft => ft.l7phase === 'expanded')) {
    t.phase = 'combine';
    document.getElementById('qLabel').innerHTML = t.needsReduction ? 'Zredukuj wyrazy podobne:' : 'Wpisz wynik:';
  }
  buildM4L7UI();
}

// ── M5: Sumę × sumę ───────────────────────────────────

function m5SumHTML(terms) {
  return terms.map((t, i) => {
    const neg = t.coeff < 0, abs = Math.abs(t.coeff);
    const vd = t.varsDisplay !== undefined ? t.varsDisplay : mvarsHTML(t.vars || {});
    const hasV = vd !== '';
    const sign = neg ? (i ? ' − ' : '−') : (i ? ' + ' : '');
    const cs = (abs === 1 && hasV) ? '' : String(abs);
    return sign + cs + vd;
  }).join('');
}

function m5ProductSums(s1, s2) {
  const res = [];
  for (const a of s1) for (const b of s2)
    res.push({ coeff: a.coeff * b.coeff, vars: monoMulVars(a.vars || {}, b.vars || {}) });
  return res.filter(t => t.coeff !== 0).map(t => ({ ...t, varsDisplay: mvarsHTML(t.vars) }));
}

function m5GenBracket(letter) {
  const a = rndNZ(-5, 5), b = rndNZ(-5, 5);
  return letter
    ? [{ coeff: a, vars: { [letter]: 1 } }, { coeff: b, vars: {} }]
    : [{ coeff: a, vars: {} }, { coeff: b, vars: {} }];
}

function m5BracketHTML(terms) {
  return '(' + multiTermsHTML(terms) + ')';
}

function m5Reduce(terms) {
  const collected = {};
  for (const t of terms) {
    const k = mvarsKey(t.vars) || '_c';
    if (!collected[k]) collected[k] = { vars: t.vars, coeff: 0 };
    collected[k].coeff += t.coeff;
  }
  return Object.values(collected)
    .filter(t => t.coeff !== 0)
    .sort((a, b) => {
      const da = Object.values(a.vars).reduce((s, e) => s + e, 0);
      const db = Object.values(b.vars).reduce((s, e) => s + e, 0);
      if (db !== da) return db - da;
      return (mvarsKey(a.vars) || '_c').localeCompare(mvarsKey(b.vars) || '_c');
    })
    .map(t => ({ ...t, varsDisplay: mvarsHTML(t.vars) }));
}

function genM5() {
  if (L === 1) return genM5Lv1();
  if (L === 2) return genM5Lv2();
  if (L === 3) return genM5Lv3();
  if (L === 4) return genM5Lv4();
  if (L === 5) return genM5Lv5();
  return genM5Lv6();
}

function genM5Lv1() {
  let att = 0;
  while (att++ < 60) {
    const [v1, v2] = shuffle([...VARS]).slice(0, 2);
    const b1 = m5GenBracket(v1), b2 = m5GenBracket(v2);
    const expandTerms = m5ProductSums(b1, b2);
    const keys = expandTerms.map(t => mvarsKey(t.vars) || '_c');
    if (new Set(keys).size < expandTerms.length) continue;
    if (expandTerms.some(t => t.coeff === 0)) continue;
    const qHTML = `<span class="m3-expr-wrap">${m5BracketHTML(b1)}${m5BracketHTML(b2)}</span>`;
    return {
      type: 'm5', level: 1, step: 1,
      expandTerms,
      qHTML, qLabel: 'Wymnóż nawiasy:',
      solHTML: m5SumHTML(expandTerms), key: `m5l1:${qHTML}`
    };
  }
}

function genM5Lv2() {
  let att = 0;
  while (att++ < 60) {
    const v = pick(VARS);
    const b1 = m5GenBracket(v), b2 = m5GenBracket(v);
    if ([...b1, ...b2].some(t => t.coeff === 0)) continue;
    const expandTerms = m5ProductSums(b1, b2);
    const keyCounts = {};
    expandTerms.forEach(t => { const k = mvarsKey(t.vars) || '_c'; keyCounts[k] = (keyCounts[k] || 0) + 1; });
    if (!Object.values(keyCounts).some(c => c > 1)) continue;
    const reducedTerms = m5Reduce(expandTerms);
    if (reducedTerms.length < 2) continue;
    const expandQHTML = `<span class="m3-expr-wrap">${m5SumHTML(expandTerms)}</span>`;
    const qHTML = `<span class="m3-expr-wrap">${m5BracketHTML(b1)}${m5BracketHTML(b2)}</span>`;
    return {
      type: 'm5', level: 2, step: 1,
      expandTerms, reducedTerms, expandQHTML,
      qHTML, qLabel: 'Wymnóż nawiasy, potem uprość:',
      solHTML: m5SumHTML(reducedTerms), key: `m5l2:${qHTML}`
    };
  }
}

function genM5Lv3() {
  let att = 0;
  while (att++ < 80) {
    const v = pick(VARS);
    const hasMono = Math.random() < 0.65;
    const monoCoeff = rndNZ(-5, 5);
    const monoTerm = { coeff: monoCoeff, vars: hasMono ? { [v]: 1 } : {} };
    const b1 = m5GenBracket(v), b2 = m5GenBracket(v);
    if ([...b1, ...b2].some(t => t.coeff === 0)) continue;
    const f0 = [monoTerm], f1 = b1, f2 = b2;
    const p01 = m5ProductSums(f0, f1), p02 = m5ProductSums(f0, f2), p12 = m5ProductSums(f1, f2);
    const r01 = m5Reduce(p01), r02 = m5Reduce(p02), r12 = m5Reduce(p12);
    const s01 = m5ProductSums(r01, f2), s02 = m5ProductSums(r02, f1), s12 = m5ProductSums(r12, f0);
    const finalTerms = m5Reduce(s01);
    if (finalTerms.length < 2) continue;
    const monoDisp = monoMultiHTML(monoCoeff, monoTerm.vars, false);
    const fHTMLs = [monoDisp, m5BracketHTML(f1), m5BracketHTML(f2)];
    const qHTML = `<span class="m3-expr-wrap">${fHTMLs.join('')}</span>`;
    return {
      type: 'm5', level: 3, step: 1,
      factors: [f0, f1, f2], factorHTMLs: fHTMLs,
      pairProducts: { '0-1': p01, '0-2': p02, '1-2': p12 },
      pairStep2Products: { '0-1': s01, '0-2': s02, '1-2': s12 },
      finalTerms, selectedPair: null, step2Terms: null,
      qHTML, qLabel: 'Wykonaj mnożenie:',
      solHTML: m5SumHTML(finalTerms), key: `m5l3:${qHTML}`
    };
  }
}

function genM5Lv4() {
  let att = 0;
  while (att++ < 80) {
    const v = pick(VARS);
    const b1 = m5GenBracket(v), b2 = m5GenBracket(v), b3 = m5GenBracket(v);
    if ([...b1, ...b2, ...b3].some(t => t.coeff === 0)) continue;
    const p01 = m5ProductSums(b1, b2), p02 = m5ProductSums(b1, b3), p12 = m5ProductSums(b2, b3);
    const r01 = m5Reduce(p01), r02 = m5Reduce(p02), r12 = m5Reduce(p12);
    const s01 = m5ProductSums(r01, b3), s02 = m5ProductSums(r02, b2), s12 = m5ProductSums(r12, b1);
    const finalTerms = m5Reduce(s01);
    if (finalTerms.length < 2) continue;
    const fHTMLs = [m5BracketHTML(b1), m5BracketHTML(b2), m5BracketHTML(b3)];
    const qHTML = `<span class="m3-expr-wrap">${fHTMLs.join('')}</span>`;
    return {
      type: 'm5', level: 4, step: 1,
      factors: [b1, b2, b3], factorHTMLs: fHTMLs,
      pairProducts: { '0-1': p01, '0-2': p02, '1-2': p12 },
      pairStep2Products: { '0-1': s01, '0-2': s02, '1-2': s12 },
      finalTerms, selectedPair: null, step2Terms: null,
      qHTML, qLabel: 'Wykonaj mnożenie:',
      solHTML: m5SumHTML(finalTerms), key: `m5l4:${qHTML}`
    };
  }
}

function genM5Lv5() {
  let att = 0;
  while (att++ < 60) {
    const v = pick(VARS);
    const a = rndNZ(-5, 5), b = rndNZ(-5, 5);
    const bracket = [{ coeff: a, vars: { [v]: 1 } }, { coeff: b, vars: {} }];
    const expandTerms = m5ProductSums(bracket, bracket);
    const reducedTerms = m5Reduce(expandTerms);
    if (reducedTerms.length < 2) continue;
    const bHTML = m5BracketHTML(bracket);
    const qHTML = `<span class="m3-expr-wrap">${bHTML}<sup>2</sup></span>`;
    const expandQHTML = `<span class="m3-expr-wrap">${bHTML}${bHTML}</span>`;
    return {
      type: 'm5', level: 5, step: 1,
      bracket, expandTerms, reducedTerms, expandQHTML,
      qHTML, qLabel: 'Oblicz kwadrat sumy:',
      solHTML: m5SumHTML(reducedTerms), key: `m5l5:${qHTML}`
    };
  }
}

function genM5Lv6() {
  const r = Math.random();
  if (r < 0.333) return genM5Lv6Cube();
  if (r < 0.667) return genM5Lv6MonoSq();
  return genM5Lv6SqSum();
}

function genM5Lv6Cube() {
  let att = 0;
  while (att++ < 60) {
    const v = pick(VARS);
    const a = rndNZ(-4, 4), b = rndNZ(-4, 4);
    const bracket = [{ coeff: a, vars: { [v]: 1 } }, { coeff: b, vars: {} }];
    const bHTML = m5BracketHTML(bracket);
    const sq = m5ProductSums(bracket, bracket);
    const sqRed = m5Reduce(sq);
    const cubeRaw = m5ProductSums(sqRed, bracket);
    const reducedTerms = m5Reduce(cubeRaw);
    if (reducedTerms.length < 2) continue;
    const fHTMLs = [bHTML, bHTML, bHTML];
    const qHTML = `<span class="m3-expr-wrap">${bHTML}<sup>3</sup></span>`;
    const pP = { '0-1': sq, '0-2': sq, '1-2': sq };
    const pS = { '0-1': cubeRaw, '0-2': cubeRaw, '1-2': cubeRaw };
    return {
      type: 'm5', level: 6, step: 1, method: null, subtype: 'cube',
      bracket, bHTML, factorHTMLs: fHTMLs,
      pairProducts: pP, pairStep2Products: pS,
      expandedSqTerms: sqRed, reducedTerms,
      finalTerms: reducedTerms, selectedPair: null, step2Terms: null,
      qHTML, qLabel: 'Oblicz sześcian sumy:',
      solHTML: m5SumHTML(reducedTerms), key: `m5l6c:${qHTML}`
    };
  }
}

function genM5Lv6MonoSq() {
  let att = 0;
  while (att++ < 80) {
    const v = pick(VARS);
    const monoDeg = rnd(1, 3);
    const monoVars = { [v]: monoDeg };
    const hasCoeff = Math.random() < 0.55;
    const monoCoeff = hasCoeff ? rndNZ(-5, 5) : 1;
    const monoTerm = { coeff: monoCoeff, vars: monoVars };
    const bracket = m5GenBracket(v);
    if (bracket.some(t => t.coeff === 0)) continue;
    const sq = m5ProductSums(bracket, bracket);
    const sqRed = m5Reduce(sq);
    if (sqRed.length < 2) continue;
    const monoArr = [monoTerm];
    const step3Terms = m5ProductSums(monoArr, sqRed);
    const reducedFinalTerms = m5Reduce(step3Terms);
    if (reducedFinalTerms.length < 1) continue;
    const monoHTML = monoMultiHTML(monoCoeff, monoVars, false);
    const bHTML = m5BracketHTML(bracket);
    const fHTMLs = [monoHTML, bHTML, bHTML];
    const p01 = m5ProductSums(monoArr, bracket);
    const p12 = sq;
    const r01 = m5Reduce(p01), r12 = sqRed;
    const s01 = m5ProductSums(r01, bracket);
    const s12 = m5ProductSums(r12, monoArr);
    const finalTerms = m5Reduce(s01);
    if (finalTerms.length < 1) continue;
    const qHTML = `<span class="m3-expr-wrap">${monoHTML}${bHTML}<sup>2</sup></span>`;
    return {
      type: 'm5', level: 6, step: 1, method: null, subtype: 'mono_sq',
      monoTerm, monoArr, monoHTML, bracket, bHTML,
      expandedSqTerms: sqRed, step3Terms, finalTerms,
      factorHTMLs: fHTMLs,
      pairProducts: { '0-1': p01, '0-2': p01, '1-2': p12 },
      pairStep2Products: { '0-1': s01, '0-2': s01, '1-2': s12 },
      selectedPair: null, step2Terms: null,
      qHTML, qLabel: 'Wykonaj mnożenie:',
      solHTML: m5SumHTML(finalTerms), key: `m5l6m:${qHTML}`
    };
  }
}

function genM5Lv6SqSum() {
  let att = 0;
  while (att++ < 80) {
    const v = pick(VARS);
    const sq = m5GenBracket(v), sum = m5GenBracket(v);
    if ([...sq, ...sum].some(t => t.coeff === 0)) continue;
    const sqSq = m5ProductSums(sq, sq);
    const sqRed = m5Reduce(sqSq);
    if (sqRed.length < 2) continue;
    const step3Terms = m5ProductSums(sum, sqRed);
    const reducedFinalTerms = m5Reduce(step3Terms);
    if (reducedFinalTerms.length < 2) continue;
    const sqHTML = m5BracketHTML(sq), sumHTML = m5BracketHTML(sum);
    const sqPos = Math.random() < 0.5 ? 'left' : 'right';
    const fHTMLs = [sqHTML, sqHTML, sumHTML];
    const sqSumP = m5ProductSums(sq, sum);
    const rSqSq = sqRed, rSqSum = m5Reduce(sqSumP);
    const s01 = m5ProductSums(rSqSq, sum);
    const s02 = m5ProductSums(rSqSum, sq);
    const finalTerms = m5Reduce(s01);
    if (finalTerms.length < 2) continue;
    const qHTMLInner = sqPos === 'left'
      ? `${sqHTML}<sup>2</sup>${sumHTML}`
      : `${sumHTML}${sqHTML}<sup>2</sup>`;
    const qHTML = `<span class="m3-expr-wrap">${qHTMLInner}</span>`;
    return {
      type: 'm5', level: 6, step: 1, method: null, subtype: 'sq_sum',
      sq, sum, sqHTML, sumHTML, sqPos,
      expandedSqTerms: sqRed, step3Terms, finalTerms,
      factorHTMLs: fHTMLs,
      pairProducts: { '0-1': sqSq, '0-2': sqSumP, '1-2': sqSumP },
      pairStep2Products: { '0-1': s01, '0-2': s02, '1-2': s02 },
      selectedPair: null, step2Terms: null,
      qHTML, qLabel: 'Wykonaj mnożenie:',
      solHTML: m5SumHTML(finalTerms), key: `m5l6s:${qHTML}`
    };
  }
}

// ── M5 mode helpers ───────────────────────────────────

function m5SetMode(mode) {
  m5Mode = mode;
  document.getElementById('m5BtnNormal').classList.toggle('active', mode === 'normal');
  document.getElementById('m5BtnHard').classList.toggle('active', mode === 'hard');
  applyModTheme(5, L);
  fullReset();
}

function hardSortKey(t) {
  const vars = t.vars || {};
  const letters = Object.keys(vars).sort();
  if (letters.length === 0) return 'zzz';
  const totalDeg = Object.values(vars).reduce((s, e) => s + e, 0);
  // primary: first letter alphabetically; secondary: higher degree first; tertiary: full var key
  return letters[0] + String(99 - totalDeg).padStart(2, '0') + letters.join('');
}

function hardSortTerms(terms) {
  return [...terms].sort((a, b) => hardSortKey(a).localeCompare(hardSortKey(b)));
}

function parseVarInput(s) {
  s = (s || '').trim().toLowerCase();
  if (!s) return {};
  const vars = {};
  const re = /([a-z])(\d*)/g;
  let m;
  while ((m = re.exec(s)) !== null) {
    if (m[1]) vars[m[1]] = m[2] ? parseInt(m[2]) : 1;
  }
  return vars;
}

function varsEqual(a, b) {
  a = a || {}; b = b || {};
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every(k => a[k] === b[k]);
}

function m5CheckAny(terms) {
  return m5Mode === 'hard' ? m5CheckTermsHard(terms) : m5CheckTerms(terms);
}

function m5CheckTermsHard(expected) {
  const sorted = hardSortTerms(expected);

  // Group consecutive terms that share the same hardSortKey
  const groups = [];
  let i = 0;
  while (i < sorted.length) {
    const key = hardSortKey(sorted[i]);
    let j = i;
    while (j < sorted.length && hardSortKey(sorted[j]) === key) j++;
    groups.push({ terms: sorted.slice(i, j), start: i });
    i = j;
  }

  return groups.every(({ terms, start }) => {
    const varEntries = Object.entries(terms[0].vars || {}).sort().filter(([, e]) => e > 0);

    // All inputs in this group must have the correct letters/exponents
    const lettersOk = terms.every((_, offset) => {
      const idx = start + offset;
      return varEntries.every(([letter, exp], j) => {
        const lInp = document.querySelector(`[data-m5letter="${idx}-${j}"]`);
        if (!lInp || lInp.value.trim().toLowerCase() !== letter) return false;
        if (exp > 1) {
          const eInp = document.querySelector(`[data-m5exp="${idx}-${j}"]`);
          if (!eInp || parseInt(eInp.value) !== exp) return false;
        }
        return true;
      });
    });
    if (!lettersOk) return false;

    // Coefficients may be entered in any order within the same-key group
    const expCoeffs = terms.map(t => t.coeff).slice().sort((a, b) => a - b);
    const actCoeffs = terms.map((_, offset) => {
      const idx = start + offset;
      const inp = document.querySelector(`[data-m4idx="${idx}"]`);
      if (!inp || inp.value === '') return NaN;
      return m4MultiSigns[idx] * Math.abs(Number(inp.value));
    }).sort((a, b) => a - b);

    return actCoeffs.every((v, k) => !isNaN(v) && v === expCoeffs[k]);
  });
}

// ── M5 UI ─────────────────────────────────────────────

function m5BuildUI() {
  const { level, step } = task;
  document.getElementById('submitBtn').style.display = '';
  if (level === 1) { m5BuildExpandUI(task.expandTerms); return; }
  if (level === 2) {
    if (step === 1) { m5BuildExpandUI(task.expandTerms); return; }
    m5BuildExpandUI(task.reducedTerms); return;
  }
  if (level === 3 || level === 4) {
    if (step === 1) { m5BuildSelectUI(); return; }
    if (step === 2) { m5BuildExpandUI(task.step2Terms); return; }
    m5BuildExpandUI(task.finalTerms); return;
  }
  if (level === 5) {
    if (step === 1) { m5BuildMethodChoiceUI(); return; }
    if (step === 2) { m5BuildExpandUI(task.expandTerms); return; }
    m5BuildExpandUI(task.reducedTerms); return;
  }
  if (level === 6) {
    if (step === 1) { m5BuildMethodChoiceUI(); return; }
    const { subtype, method } = task;
    if (subtype === 'cube' && method === 'wzory') { m5BuildExpandUI(task.reducedTerms); return; }
    if (method === 'wzory') {
      if (step === 2) { m5Lv6BuildSqFillUI(); return; }
      if (step === 3) { m5BuildExpandUI(task.step3Terms); return; }
      m5BuildExpandUI(task.finalTerms); return;
    }
    if (step === 2) { m5BuildSelectUI(); return; }
    if (step === 3) { m5BuildExpandUI(task.step2Terms); return; }
    m5BuildExpandUI(task.finalTerms); return;
  }
}

function m5BuildExpandUI(terms) {
  if (m5Mode === 'hard') { m5BuildExpandUIHard(terms); return; }
  const area = document.getElementById('answerArea');
  m4MultiSigns = terms.map(() => 1);
  let html = '<div class="poly-inputs m3-step2-inputs">';
  terms.forEach((t, i) => {
    if (i > 0) html += '<span class="plus-sep">&thinsp;</span>';
    const vd = t.varsDisplay !== undefined ? t.varsDisplay : mvarsHTML(t.vars || {});
    html += `<div class="coeff-group">
      <button class="sign-btn" data-m4sign="${i}" type="button" onclick="toggleM4Sign(${i})">+</button>
      <input class="coeff-input" data-m4idx="${i}" type="number" inputmode="numeric">`;
    if (vd) html += `<span class="coeff-var">${vd}</span>`;
    html += `</div>`;
  });
  html += '</div>';
  area.innerHTML = html;
  area.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateSubmit));
  updateSubmit();
  const first = area.querySelector('input');
  if (first) setTimeout(() => first.focus(), 50);
}

function m5BuildExpandUIHard(terms) {
  const sorted = hardSortTerms(terms);
  const area = document.getElementById('answerArea');
  m4MultiSigns = sorted.map(() => 1);
  let html = '<div class="poly-inputs m3-step2-inputs">';
  sorted.forEach((t, i) => {
    if (i > 0) html += '<span class="plus-sep">&thinsp;</span>';
    html += `<div class="coeff-group">
      <button class="sign-btn" data-m4sign="${i}" type="button" onclick="toggleM4Sign(${i})">+</button>
      <input class="coeff-input" data-m4idx="${i}" type="number" inputmode="numeric">`;
    Object.entries(t.vars || {}).sort().filter(([,e]) => e > 0).forEach(([,exp], j) => {
      html += `<input class="m4-letter-inp" data-m5letter="${i}-${j}" type="text" maxlength="1" autocomplete="off" spellcheck="false">`;
      if (exp > 1) html += `<input class="m4-exp-inp" data-m5exp="${i}-${j}" type="number" inputmode="numeric">`;
    });
    html += `</div>`;
  });
  html += '</div>';
  area.innerHTML = html;
  area.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateSubmit));
  updateSubmit();
  const first = area.querySelector('input');
  if (first) setTimeout(() => first.focus(), 50);
}

function m5BuildChipQuestion(terms) {
  m5ChipAssign = terms.map(() => -1);
  const q = document.getElementById('question');
  let html = '<div class="m3-chip-row">';
  terms.forEach((t, i) => {
    const abs = Math.abs(t.coeff);
    const vd = t.varsDisplay !== undefined ? t.varsDisplay : mvarsHTML(t.vars || {});
    const hasV = vd !== '';
    const cs = (abs === 1 && hasV) ? '' : String(abs);
    if (i > 0) html += `<span class="m3-chip-sep">${t.coeff >= 0 ? '+' : '−'}</span>`;
    else if (t.coeff < 0) html += '<span class="m3-chip-sep">−</span>';
    html += `<span class="m3-chip" data-m5cidx="${i}" onclick="cycleM5Chip(${i})">${cs}${vd}</span>`;
  });
  html += '</div><p class="m3-chip-hint">Kliknij kilka razy, aby zmienić kolor wyrazu</p>';
  q.innerHTML = html;
}

function cycleM5Chip(i) {
  m5ChipAssign[i] = (m5ChipAssign[i] + 2) % 5 - 1;
  const chip = document.querySelector(`.m3-chip[data-m5cidx="${i}"]`);
  if (chip) chip.className = 'm3-chip' + (m5ChipAssign[i] >= 0 ? ' gc' + m5ChipAssign[i] : '');
}

function m5BuildSelectUI() {
  const q = document.getElementById('question');
  let qHTML = '<div class="m5-factors">';
  task.factorHTMLs.forEach((fHTML, i) => {
    const isSel = task.selectedPair && task.selectedPair.includes(i);
    qHTML += `<span class="m5-factor-tile${isSel ? ' sel' : ''}" onclick="m5ToggleFactor(${i})">${fHTML}</span>`;
  });
  qHTML += '</div>';
  q.innerHTML = qHTML;
  m5UpdateSelectAnswer();
}

function m5ToggleFactor(i) {
  if (mode !== 'ask') return;
  const prev = task.selectedPair || [];
  if (prev.includes(i)) {
    task.selectedPair = prev.filter(x => x !== i);
  } else if (prev.length < 2) {
    task.selectedPair = [...prev, i].sort((a, b) => a - b);
  } else {
    task.selectedPair = [i];
  }
  document.querySelectorAll('.m5-factor-tile').forEach((el, idx) => {
    el.className = 'm5-factor-tile' + (task.selectedPair.includes(idx) ? ' sel' : '');
  });
  m5UpdateSelectAnswer();
}

function m5UpdateSelectAnswer() {
  const area = document.getElementById('answerArea');
  if (!task.selectedPair || task.selectedPair.length < 2) {
    area.innerHTML = '<div class="m5-select-hint">Zaznacz dwa wyrażenia do przemnożenia</div>';
    document.getElementById('submitBtn').disabled = true;
    return;
  }
  const key = task.selectedPair.join('-');
  const productTerms = task.pairProducts[key];
  const remainIdx = [0, 1, 2].find(i => !task.selectedPair.includes(i));
  const remainHTML = task.factorHTMLs[remainIdx];
  const displayTerms = m5Mode === 'hard' ? hardSortTerms(productTerms) : productTerms;
  m4MultiSigns = displayTerms.map(() => 1);
  let html = '<div class="poly-inputs m3-step2-inputs">';
  html += '<span class="m6-sq-ctx">(</span>';
  displayTerms.forEach((t, i) => {
    if (i > 0) html += '<span class="plus-sep">&thinsp;</span>';
    html += `<div class="coeff-group">
      <button class="sign-btn" data-m4sign="${i}" type="button" onclick="toggleM4Sign(${i})">+</button>
      <input class="coeff-input" data-m4idx="${i}" type="number" inputmode="numeric">`;
    if (m5Mode === 'hard') {
      Object.entries(t.vars || {}).sort().filter(([,e]) => e > 0).forEach(([,exp], j) => {
        html += `<input class="m4-letter-inp" data-m5letter="${i}-${j}" type="text" maxlength="1" autocomplete="off" spellcheck="false">`;
        if (exp > 1) html += `<input class="m4-exp-inp" data-m5exp="${i}-${j}" type="number" inputmode="numeric">`;
      });
    } else {
      const vd = t.varsDisplay !== undefined ? t.varsDisplay : mvarsHTML(t.vars || {});
      if (vd) html += `<span class="coeff-var">${vd}</span>`;
    }
    html += `</div>`;
  });
  html += `<span class="m6-sq-ctx">)${remainHTML}</span>`;
  html += '</div>';
  area.innerHTML = html;
  area.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateSubmit));
  updateSubmit();
  const first = area.querySelector('input');
  if (first) setTimeout(() => first.focus(), 50);
}

function m5BuildMethodChoiceUI() {
  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('answerArea').innerHTML = `<div class="m5-method-btns">
    <button class="m5-method-btn" onclick="m5ChooseMethod('wzory')">Wzory skróconego mnożenia</button>
    <button class="m5-method-btn" onclick="m5ChooseMethod('normal')">Ręcznie</button>
  </div>`;
}

function m5Lv6BuildSqFillUI() {
  const area = document.getElementById('answerArea');
  const { subtype, monoHTML, sumHTML, sqPos, expandedSqTerms } = task;
  let prefix, suffix;
  if (subtype === 'mono_sq') {

    suffix = `<span class="m6-sq-ctx">)</span>`;
  } else {
    if (sqPos === 'left') {
      prefix = `<span class="m6-sq-ctx">(</span>`;
      suffix = `<span class="m6-sq-ctx">) &sdot; ${sumHTML}</span>`;
    } else {
      prefix = `<span class="m6-sq-ctx">${sumHTML} &sdot; (</span>`;
      suffix = `<span class="m6-sq-ctx">)</span>`;
    }
  }
  const sqDisplayTerms = m5Mode === 'hard' ? hardSortTerms(expandedSqTerms) : expandedSqTerms;
  m4MultiSigns = sqDisplayTerms.map(() => 1);
  let html = `<div class="m6-sq-fill">${prefix}`;
  sqDisplayTerms.forEach((t, i) => {
    if (i > 0) html += '<span class="plus-sep">&thinsp;</span>';

      <button class="sign-btn" data-m4sign="${i}" type="button" onclick="toggleM4Sign(${i})">+</button>
      <input class="coeff-input" data-m4idx="${i}" type="number" inputmode="numeric">`;
    if (m5Mode === 'hard') {
      Object.entries(t.vars || {}).sort().filter(([,e]) => e > 0).forEach(([,exp], j) => {
        html += `<input class="m4-letter-inp" data-m5letter="${i}-${j}" type="text" maxlength="1" autocomplete="off" spellcheck="false">`;
        if (exp > 1) html += `<input class="m4-exp-inp" data-m5exp="${i}-${j}" type="number" inputmode="numeric">`;

      if (vd) html += `<span class="coeff-var">${vd}</span>`;

    html += `</div>`;
  });
