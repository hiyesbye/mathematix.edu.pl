function m5ChooseMethod(method) {
  task.method = method;
  document.getElementById('submitBtn').style.display = '';
  if (task.level === 6) {
    task.step = 2;
    const lbl = document.getElementById('qLabel');
    if (method === 'wzory') {
      lbl.innerHTML = task.subtype === 'cube' ? 'Wpisz wynik:' : 'Wpisz wynik wzoru skróconego mnożenia:';
    } else {
      lbl.innerHTML = 'Zaznacz dwa wyrażenia do przemnożenia:';
    }
    m5BuildUI();
    return;
  }
  if (method === 'wzory') {
    task.step = 3;
    document.getElementById('qLabel').innerHTML = 'Wpisz wynik:';
  } else {
    task.step = 2;
    document.getElementById('qLabel').innerHTML = 'Wymnóż nawiasy:';
    document.getElementById('question').innerHTML = task.expandQHTML;
  }
  m5BuildUI();
}

// ── M5 check ──────────────────────────────────────────

function m5CheckTerms(expected) {
  return expected.every((t, i) => {
    const inp = document.querySelector(`[data-m4idx="${i}"]`);
    const absVal = inp && inp.value !== '' ? Math.abs(Number(inp.value)) : 1;
    return m4MultiSigns[i] * absVal === t.coeff;
  });
}

function m5HasLikeTerms(terms) {
  return m5Reduce(terms).length < terms.length;
}

function m5NextStep() {
  const { level, step } = task;
  if (level === 1) return null;
  if (level === 2) return step === 1 ? (m5HasLikeTerms(task.expandTerms) ? 2 : null) : null;
  if (level === 3 || level === 4) {
    if (step === 1) {
      const key = task.selectedPair.join('-');
      task.step2Terms = task.pairStep2Products[key];
      return 2;
    }
    if (step === 2) return m5HasLikeTerms(task.step2Terms) ? 3 : null;
    return null;
  }
  if (level === 5) {
    if (task.method === 'wzory') return null;
    if (step === 2) return m5HasLikeTerms(task.expandTerms) ? 3 : null;
    return null;
  }
  if (level === 6) {
    const { subtype, method } = task;
    if (subtype === 'cube' && method === 'wzory') return null;
    if (method === 'wzory') {
      if (step === 2) return 3;
      if (step === 3) return m5HasLikeTerms(task.step3Terms) ? 4 : null;
      return null;
    }
    if (step === 2) {
      const key = task.selectedPair.join('-');
      task.step2Terms = task.pairStep2Products[key];
      return 3;
    }
    if (step === 3) return m5HasLikeTerms(task.step2Terms) ? 4 : null;
    return null;
  }
  return null;
}

function m5UpdateQuestionForStep() {
  const { level, step } = task;
  const q = document.getElementById('question');
  const lbl = document.getElementById('qLabel');
  if (level === 2 && step === 2) {
    m5BuildChipQuestion(task.expandTerms);
    lbl.innerHTML = 'Zaznacz wyrazy podobne, potem wpisz wynik:';
  }
  if ((level === 3 || level === 4) && step === 2) {
    const key = task.selectedPair.join('-');
    const remainIdx = [0, 1, 2].find(i => !task.selectedPair.includes(i));
    const r1 = m5Reduce(task.pairProducts[key]);
    q.innerHTML = `<span class="m3-expr-wrap">(${m5SumHTML(r1)})${task.factorHTMLs[remainIdx]}</span>`;
    lbl.innerHTML = 'Wykonaj mnożenie:';
  }
  if ((level === 3 || level === 4) && step === 3) {
    m5BuildChipQuestion(task.step2Terms);
    lbl.innerHTML = 'Zaznacz wyrazy podobne, potem wpisz wynik:';
  }
  if (level === 5 && step === 3) {
    m5BuildChipQuestion(task.expandTerms);
    lbl.innerHTML = 'Zaznacz wyrazy podobne, potem wpisz wynik:';
  }
  if (level === 6) {
    const { subtype, method } = task;
    if (method === 'wzory' && step === 3) {
      if (subtype === 'mono_sq') {
        q.innerHTML = `<span class="m3-expr-wrap">${task.monoHTML}${m5BracketHTML(task.expandedSqTerms)}</span>`;
      } else {
        const sqExp = m5BracketHTML(task.expandedSqTerms);
        q.innerHTML = task.sqPos === 'left'
          ? `<span class="m3-expr-wrap">${sqExp}${task.sumHTML}</span>`
          : `<span class="m3-expr-wrap">${task.sumHTML}${sqExp}</span>`;
      }
      lbl.innerHTML = 'Wymnóż czynniki:';
    }
    if (method === 'normal' && step === 3) {
      const key = task.selectedPair.join('-');
      const remainIdx = [0, 1, 2].find(i => !task.selectedPair.includes(i));
      const r1 = m5Reduce(task.pairProducts[key]);
      q.innerHTML = `<span class="m3-expr-wrap">(${m5SumHTML(r1)})${task.factorHTMLs[remainIdx]}</span>`;
      lbl.innerHTML = 'Wykonaj mnożenie:';
    }
    if (step === 4) {
      m5BuildChipQuestion(method === 'wzory' ? task.step3Terms : task.step2Terms);
      lbl.innerHTML = 'Zaznacz wyrazy podobne, potem wpisz wynik:';
    }
  }
}

function m5HandleCheckAnswer() {
  const { level, step } = task;
  let correct;
  if (level === 1) {
    correct = m5CheckAny(task.expandTerms);
  } else if (level === 2) {
    correct = step === 1 ? m5CheckAny(task.expandTerms) : m5CheckAny(task.reducedTerms);
  } else if (level === 3 || level === 4) {
    if (step === 1) {
      correct = task.selectedPair && task.selectedPair.length === 2
        ? m5CheckAny(task.pairProducts[task.selectedPair.join('-')])
        : false;
    } else if (step === 2) {
      correct = m5CheckAny(task.step2Terms);
    } else {
      correct = m5CheckAny(task.finalTerms);
    }
  } else if (level === 5) {
    correct = step === 2 ? m5CheckAny(task.expandTerms) : m5CheckAny(task.reducedTerms);
  } else if (level === 6) {
    const { subtype, method } = task;
    if (subtype === 'cube' && method === 'wzory') {
      correct = m5CheckAny(task.reducedTerms);
    } else if (method === 'wzory') {
      if (step === 2) correct = m5CheckAny(task.expandedSqTerms);
      else if (step === 3) correct = m5CheckAny(task.step3Terms);
      else correct = m5CheckAny(task.finalTerms);
    } else {
      if (step === 2) {
        correct = task.selectedPair && task.selectedPair.length === 2
          ? m5CheckAny(task.pairProducts[task.selectedPair.join('-')])
          : false;
      } else if (step === 3) {
        correct = m5CheckAny(task.step2Terms);
      } else {
        correct = m5CheckAny(task.finalTerms);
      }
    }
  }

  if (!correct) {
    feedbackEl.className = 'feedback bad';
    feedbackEl.innerHTML = '❌ Sprawdź obliczenia — niedobrze.';
    return;
  }

  const nextStep = m5NextStep();
  if (nextStep !== null) {
    task.step = nextStep;
    feedbackEl.className = 'feedback ok';
    const isReduceNext = nextStep === 4 || (nextStep === 3 && task.level < 6) || (nextStep === 2 && task.level === 2);
    feedbackEl.innerHTML = isReduceNext ? '✅ Dobrze! Teraz zredukuj wyrazy podobne.' : '✅ Dobrze! Kontynuuj.';
    m5UpdateQuestionForStep();
    m5BuildUI();
    return;
  }

  mode = 'next';
  clearTimeout(autoAdv);
  stopTimer();
  ok++; tot++;
  playOk();
  feedbackEl.className = 'feedback good';
  feedbackEl.innerHTML = `✅ Brawo! Wynik: <strong>${task.solHTML}</strong>`;
  scoreEl.textContent = `${ok} / ${tot}`;
  resetBtn.disabled = false;
  submitBtn.disabled = true;
  nextBtn.style.display = '';
}

// ── Master generator ──────────────────────────────────
function generate() {
  let t, key, tries = 0;
  do {
    switch (M) {
      case 1: t = genM1(); break;
      case 2: t = genM2(); break;
      case 3: t = genM3(); break;
      case 4: t = genM4(); break;
      case 5: t = genM5(); break;
    }
    key = t.key || t.qHTML;
    tries++;
  } while (recentKeys.includes(key) && tries < 40);
  recentKeys.push(key);
  if (recentKeys.length > 14) recentKeys.shift();
  return t;
}

// ── Chip interaction (M2 Lv2/3) ──────────────────────
function chipClick(i) {
  if (mode !== 'ask') return;
  const s = chipState[i];
  if (typeof s === 'number') return; // locked group, ignore
  chipState[i] = s === 'sel' ? null : 'sel';
  rebuildChips();
  checkAutoLock();
  updateSubmit();
}

function checkAutoLock() {
  const selIds = chipState.map((s, i) => s === 'sel' ? i : -1).filter(i => i >= 0);
  if (selIds.length === 0) return;
  const types = selIds.map(i => task.terms[i].var + ':' + task.terms[i].deg);
  if (new Set(types).size !== 1) return;
  const varKey = types[0];
  const allOfType = task.terms.filter(t => t.var + ':' + t.deg === varKey);
  const allCovered = allOfType.every(t => chipState[t.id] === 'sel' || typeof chipState[t.id] === 'number');
  if (!allCovered) return;
  selIds.forEach(id => { chipState[id] = chipGroupIdx; });
  chipGroupIdx++;
  rebuildChips();
  updateSubmit();
}

function rebuildChips() {
  const qDiv = document.getElementById('question');
  const frozen = task.phase === 2 || mode !== 'ask';
  let html = '<div class="term-chips-area">';
  task.terms.forEach((t, i) => {
    const s = chipState[i];
    let cls = 'term-chip';
    if (typeof s === 'number') cls += ' g' + s + (frozen ? ' done' : '');
    else if (s === 'sel') cls += ' sel';
    const abs = Math.abs(t.coeff), cs = abs === 1 ? '' : String(abs);
    const vp = t.deg === 1 ? t.var : `${t.var}<sup>${t.deg}</sup>`;
    const neg = t.coeff < 0;
    const sign = i === 0 ? (neg ? '−' : '') : (neg ? ' − ' : ' + ');
    const click = frozen ? '' : ` onclick="chipClick(${i})"`;
    html += `<span class="${cls}"${click}>${sign}${cs}${vp}</span>`;
  });
  html += '</div>';
  qDiv.innerHTML = html;
  requestAnimationFrame(fitChipsToLine);
}

function fitChipsToLine() {
  const qDiv = document.getElementById('question');
  if (!qDiv) return;
  const area = qDiv.querySelector('.term-chips-area');
  if (!area) return;
  area.style.fontSize = '';
  const maxW = qDiv.offsetWidth;
  if (area.scrollWidth <= maxW) return;
  let fs = 1.35;
  while (area.scrollWidth > maxW && fs > 0.6) {
    fs = Math.round((fs - 0.04) * 100) / 100;
    area.style.fontSize = fs + 'rem';
  }
}

function toggleSign(i) {
  if (mode !== 'ask') return;
  signState[i] = -signState[i];
  const btn = document.querySelector(`[data-gidx="${i}"].sign-btn`);
  if (btn) {
    btn.textContent = signState[i] > 0 ? '+' : '−';
    btn.className = 'sign-btn' + (signState[i] < 0 ? ' neg' : '');
  }
}

// ── Answer UI ─────────────────────────────────────────
function buildAnswerUI() {
  const area = document.getElementById('answerArea');
  document.getElementById('m4FillHint').style.display = 'none';

  if (task.type === 'multivar-mono') {
    let html = '<div class="multivars-answer">';
    html += `<div class="ans-coeff-grp">
      <div class="ans-label">współczynnik</div>
      <input class="ans-coeff-inp" id="ai_mcoeff" type="number" inputmode="numeric">
    </div>`;
    for (let i = 0; i < task.targetVars.length; i++) {
      const v = task.targetVars[i];
      html += `<div class="ans-var-block">`;
      if (task.blindVars) {
        html += `<input class="ans-letter-inp" id="ai_letter_${i}" type="text" maxlength="1" autocomplete="off" spellcheck="false">`;
      } else {
        html += `<span class="ans-var-letter">${v}</span>`;
      }
      html += `<input class="ans-exp-inp" id="ai_exp_${i}" type="number" inputmode="numeric">
      </div>`;
    }
    html += '</div>';
    area.innerHTML = html;
  } else if (task.type === 'multimono-fill') {
    buildM4FillUI();
    return;
  } else if (task.type === 'm4l7') {
    buildM4L7UI();
    return;
  } else if (task.type === 'multi-block-expand') {
    buildM4MultiBlockPhase1UI();
    return;
  } else if (task.type === 'multimono-sum') {
    buildM4MultiUI();
    return;
  } else if (task.type === 'remove-brackets') {
    if (task.phase === 1) buildM3Step1UI();
    else buildM3Step2AnswerUI();
    return;
  } else if (task.type === 'remove-brackets-nested') {
    m3bracketActive = null;
    m3bracketDone = { r: false, sq: false, cu: false };
    const qEl = document.getElementById('question');
    qEl.style.fontSize = '';
    qEl.style.whiteSpace = '';
    showM3BracketWaitUI();
    return;
  } else if (task.type === 'm5') {
    m5BuildUI();
    return;
  } else if (task.type === 'group-poly') {
    chipState = task.terms.map(() => null);
    chipGroupIdx = 0;
    rebuildChips(); // chips → question div
    buildGroupPolyPhase2UI(); // inputy od razu widoczne
    return;
  } else if (task.textInput) {
    area.innerHTML = `<div class="poly-inputs"><input class="text-mono-inp" id="ai_text" type="text" autocomplete="off" spellcheck="false" inputmode="text"></div>`;
  } else {
    // Polynomial inputs (M2–M5)
    const varName = task.var || 'x';
    const minDeg = task.minDeg ?? 0;
    let html = '<div class="poly-inputs">';
    for (let d = task.maxDeg; d >= minDeg; d--) {
      if (d < task.maxDeg) html += '<span class="plus-sep">+</span>';
      const varLabel = d === 0 ? '' : (d === 1 ? varName : `${varName}<sup>${d}</sup>`);
      html += `<div class="coeff-group">
        <input class="coeff-input" data-deg="${d}" type="number" inputmode="numeric">
        ${varLabel ? `<span class="coeff-var">${varLabel}</span>` : ''}
      </div>`;
    }
    html += '</div>';
    area.innerHTML = html;
  }

  area.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateSubmit));
  updateSubmit();
  const first = area.querySelector('input');
  if (first) setTimeout(() => first.focus(), 50);
}

function buildGroupPolyPhase2UI() {
  const area = document.getElementById('answerArea');
  signState = task.groups.map(() => 1);
  let html = '<div class="phase2-label">Wpisz wynik redukcji:</div><div class="group-poly-answer">';
  task.groups.forEach((g, i) => {
    if (i > 0) html += '<span class="plus-sep">&thinsp;</span>';
    const varLabel = g.deg === 1 ? g.var : `${g.var}<sup>${g.deg}</sup>`;
    html += `<div class="coeff-group">
      <button class="sign-btn" data-gidx="${i}" type="button" onclick="toggleSign(${i})">+</button>
      <input class="coeff-input" data-gidx="${i}" type="number" inputmode="numeric">
      <span class="coeff-var">${varLabel}</span>
    </div>`;
  });
  html += '</div>';
  area.innerHTML = html;
  area.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateSubmit));
  updateSubmit();
  const first = area.querySelector('input');
  if (first) setTimeout(() => first.focus(), 50);
}

function updateSubmit() {
  let dis;
  if (task && task.type === 'multivar-mono') {
    const cInp = document.getElementById('ai_mcoeff');
    const coeffOk = cInp && cInp.value !== '';
    const lettersOk = !task.blindVars || task.targetVars.every((v, i) => {
      const inp = document.getElementById('ai_letter_' + i);
      return inp && inp.value.trim() !== '';
    });
    dis = !(coeffOk && lettersOk);
  } else if (task && task.type === 'multimono-fill') {
    const inputs = document.querySelectorAll('#answerArea [data-m4idx], #answerArea .m4-letter-inp');
    dis = [...inputs].every(i => i.value === '');
  } else if (task && task.type === 'm4l7') {
    if (task.phase === 'combine') {
      const inps = [...document.querySelectorAll('[data-m4idx]')];
      dis = inps.length === 0 || inps.some(i => !i.dataset.hasv && i.value === '');
    } else if (task.l7actionType === 'simp') {
      const ti = task.l7actionTi;
      dis = !(document.getElementById(`l7si_o_${ti}`)?.value && document.getElementById(`l7si_d_${ti}`)?.value);
    } else if (task.l7actionType === 'mul' || task.l7actionType === 'div') {
      const inps = [...document.querySelectorAll('[data-l7inter]')];
      dis = inps.length === 0 || inps.some(i => !i.dataset.hasv && i.value === '');
    } else {
      dis = true;
    }
  } else if (task && (task.type === 'multimono-sum' || task.type === 'multi-block-expand')) {
    const sel = task.multiVarAnswer
      ? '#answerArea [data-m4idx], #answerArea .m4-letter-inp'
      : '#answerArea [data-m4idx]';
    const inputs = document.querySelectorAll(sel);
    dis = [...inputs].every(i => i.value === '');
  } else if (task && task.type === 'remove-brackets') {
    dis = false;
  } else if (task && task.type === 'remove-brackets-nested') {
    if (m3bracketActive !== null) {
      dis = false;
    } else if (document.querySelectorAll('#answerArea input').length) {
      dis = false;
    } else {
      dis = true;
    }
  } else if (task && task.type === 'm5') {
    if ((task.level === 5 || task.level === 6) && task.step === 1) {
      dis = true;
    } else if (task.level === 6 && task.step === 2 && task.method === 'normal') {
      const hasSelection = task.selectedPair && task.selectedPair.length === 2;
      const inputs = document.querySelectorAll('#answerArea [data-m4idx]');
      dis = !hasSelection || (inputs.length > 0 && [...inputs].every(i => i.value === ''));
    } else if ((task.level === 3 || task.level === 4) && task.step === 1) {
      const hasSelection = task.selectedPair && task.selectedPair.length === 2;
      const inputs = document.querySelectorAll('#answerArea [data-m4idx]');
      dis = !hasSelection || (inputs.length > 0 && [...inputs].every(i => i.value === ''));
    } else {
      const inputs = document.querySelectorAll('#answerArea [data-m4idx]');
      dis = inputs.length > 0 && [...inputs].every(i => i.value === '');
    }
  } else if (task && task.type === 'group-poly') {
    dis = false;
  } else if (task && task.textInput) {
    const inp = document.getElementById('ai_text');
    dis = !inp || inp.value.trim() === '';
  } else {
    const inputs = document.querySelectorAll('#answerArea input');
    dis = [...inputs].every(i => i.value === '');
  }
  document.getElementById('submitBtn').disabled = dis;
}

function parseMonoTerm(str) {
  const s = str.trim().replace(/\s+/g, '').toLowerCase();
  if (!s) return null;
  const m = s.match(/^(-?)(\d*)([a-z])$/);
  if (!m) return null;
  const abs = m[2] === '' ? 1 : parseInt(m[2], 10);
  if (isNaN(abs) || abs === 0) return null;
  return { coeff: m[1] === '-' ? -abs : abs, var: m[3] };
}

// ── Check answer ──────────────────────────────────────
function checkAnswer() {
  if (mode !== 'ask') return;

  // M3 step 1: validate signs — does NOT finalize the task
  if (task && task.type === 'remove-brackets' && task.phase === 1) {
    const allOk = task.flatTerms.every((t, i) => termSignState[i] === t.effectiveSign);
    if (allOk) {
      transitionM3ToPhase2();
    } else {
      feedbackEl.className = 'feedback bad';
      feedbackEl.innerHTML = '❌ Sprawdź zaznaczenia — niektóre znaki są błędne.';
    }
    return;
  }

  // M3 Lv3: bracket selection mode
  if (task && task.type === 'remove-brackets-nested' && m3bracketActive !== null) {
    const flatTerms = getM3StepFlatTerms(m3bracketActive);
    const allOk = flatTerms.every((t, i) => m3nestedTermSigns[i] === t.effectiveSign);
    if (allOk) {
      m3bracketDone[m3bracketActive] = true;
      m3bracketActive = null;
      document.getElementById('question').innerHTML = task.stateHTMLs[m3StateKey()];
      updateM3BracketVisuals();
      requestAnimationFrame(fitM3Question);
      const needCu = task.depth === 3;
      const allDone = m3bracketDone.r && m3bracketDone.sq && (!needCu || m3bracketDone.cu);
      if (allDone) {
        document.getElementById('qLabel').innerHTML = task.finalLabel;
        buildM3ChipQuestion(task.finalFlatTerms);
        buildM3Step2AnswerUI();
      } else {
        document.getElementById('qLabel').innerHTML = 'Usuń nawiasy:';
        feedbackEl.className = 'feedback ok';
        feedbackEl.innerHTML = '✅ Dobrze! Kliknij kolejne nawiasy.';
        showM3BracketWaitUI();
      }
    } else {
      feedbackEl.className = 'feedback bad';
      feedbackEl.innerHTML = '❌ Sprawdź zaznaczenia — niektóre znaki są błędne.';
    }
    return;
  }

  // M4 Lv4a/4b phase 1
  if (task && task.type === 'multi-block-expand' && task.phase === 1) {
    let fi = 0;
    const allOk = task.blockResultTerms.every(bTerms =>
      bTerms.every(t => {
        const inp = document.querySelector(`[data-m4idx="${fi}"]`);
        const absVal = inp && inp.value !== '' ? Math.abs(Number(inp.value)) : 1;
        const coeffOk = m4MultiSigns[fi] * absVal === t.coeff;
        let varsOk = true;
        if (task.multiVarAnswer) {
          varsOk = Object.entries(t.vars).sort().filter(([,e])=>e>0).every(([letter, exp], j) => {
            const lInp = document.querySelector(`[data-m4letter="${fi}-${j}"]`);
            if (!lInp || lInp.value.trim().toLowerCase() !== letter) return false;
            if (exp > 1) {
              const eInp = document.querySelector(`[data-m4exp="${fi}-${j}"]`);
              if (!eInp || Number(eInp.value) !== exp) return false;
            }
            return true;
          });
        }
        fi++;
        return coeffOk && varsOk;
      })
    );
    if (allOk) {
      transitionM4ToPhase2();
    } else {
      document.getElementById('feedback').className = 'feedback bad';
      document.getElementById('feedback').innerHTML = '❌ Sprawdź obliczenia — niektóre wyrazy są błędne.';
    }
    return;
  }

  // M4 Lv7 — fully self-contained handler
  if (task && task.type === 'm4l7') {
    checkM4L7();
    return;
  }

  // M5 multi-step — fully self-contained handler
  if (task && task.type === 'm5') {
    m5HandleCheckAnswer();
    return;
  }

  mode = 'next';
  clearTimeout(autoAdv);
  stopTimer();

  let correct = false;

  if (task.type === 'multivar-mono') {
    const cInp = document.getElementById('ai_mcoeff');
    const uc = cInp ? Number(cInp.value) : NaN;
    if (!isNaN(uc) && uc === task.target.coeff) {
      correct = task.targetVars.every((v, i) => {
        const eInp = document.getElementById('ai_exp_' + i);
        const ue = eInp && eInp.value !== '' ? Number(eInp.value) : 1;
        if (ue !== (task.target.vars[v] || 0)) return false;
        if (task.blindVars) {
          const lInp = document.getElementById('ai_letter_' + i);
          return lInp && lInp.value.trim().toLowerCase() === v;
        }
        return true;
      });
    }
  } else if (task.type === 'group-poly') {
    correct = task.groups.every((g, i) => {
      const c = document.querySelector(`[data-gidx="${i}"].coeff-input`);
      const uc = signState[i] * (c && c.value !== '' ? Number(c.value) : 1);
      return uc === g.sum;
    });
    rebuildChips(); // freeze chips with .done
  } else if (task.textInput) {
    const inp = document.getElementById('ai_text');
    const parsed = parseMonoTerm(inp ? inp.value : '');
    correct = parsed !== null && parsed.coeff === task.answer[1] && parsed.var === task.var;
  } else if (task.type === 'multimono-fill') {
    correct = task.fillTerms.every((t, ti) => {
      const coeffInp = document.querySelector(`[data-m4idx="${ti}"]`);
      const absVal = coeffInp && coeffInp.value !== '' ? Math.abs(Number(coeffInp.value)) : 0;
      if (m4MultiSigns[ti] * absVal !== t.coeff) return false;
      return t.vars.every((v, vi) => {
        const lInp = document.querySelector(`[data-fti="${ti}"][data-fvi="${vi}"].m4-letter-inp`);
        if (!lInp || lInp.value.trim().toLowerCase() !== v.l) return false;
        if (v.e > 1) {
          const eInp = document.querySelector(`[data-fti="${ti}"][data-fvi="${vi}"][data-fexp]`);
          if (!eInp || Number(eInp.value) !== v.e) return false;
        }
        return true;
      });
    });
  } else if (task.type === 'multimono-sum' || task.type === 'multi-block-expand') {
    correct = task.resultTerms.every((t, i) => {
      const inp = document.querySelector(`[data-m4idx="${i}"]`);
      const emptyDefault = (task.type === 'multi-block-expand' && task.multiVarAnswer) ? 1 : 0;
      const absVal = inp && inp.value !== '' ? Math.abs(Number(inp.value)) : emptyDefault;
      if (m4MultiSigns[i] * absVal !== t.coeff) return false;
      if (!task.multiVarAnswer) return true;
      return Object.entries(t.vars).sort().filter(([,e])=>e>0).every(([letter, exp], j) => {
        const lInp = document.querySelector(`[data-m4letter="${i}-${j}"]`);
        if (!lInp || lInp.value.trim().toLowerCase() !== letter) return false;
        if (exp > 1) {
          const eInp = document.querySelector(`[data-m4exp="${i}-${j}"]`);
          if (!eInp || Number(eInp.value) !== exp) return false;
        }
        return true;
      });
    });
  } else if (task.type === 'remove-brackets' || task.type === 'remove-brackets-nested') {
    correct = true;
    for (let d = 0; d <= task.maxDeg; d++) {
      const idx = task.maxDeg - d;
      const inp = document.querySelector(`#answerArea [data-deg="${d}"]`);
      const expected = task.answer[d] || 0;
      const absVal = (inp && inp.value !== '') ? Math.abs(Number(inp.value)) : (d > 0 && Math.abs(expected) === 1 ? 1 : 0);
      const uc = m3step2Signs[idx] * absVal;
      if (uc !== (task.answer[d] || 0)) { correct = false; break; }
    }
  } else {
    correct = true;
    for (let d = 0; d <= task.maxDeg; d++) {
      const inp = document.querySelector(`#answerArea [data-deg="${d}"]`);
      const uc = (inp && inp.value !== '') ? Number(inp.value) : 0;
      if (uc !== (task.answer[d] || 0)) { correct = false; break; }
    }
  }

  tot++;
  if (correct) {
    ok++;
    playOk();
    feedbackEl.className = 'feedback good';
    feedbackEl.innerHTML = `✅ Brawo! Wynik: <strong>${task.solHTML}</strong>`;
  } else {
    playBad();
    feedbackEl.className = 'feedback bad';
    feedbackEl.innerHTML = `❌ Źle! Poprawna odpowiedź: <strong>${task.solHTML}</strong>`;
  }

  scoreEl.textContent = `${ok} / ${tot}`;
  resetBtn.disabled = false;
  submitBtn.disabled = true;
  nextBtn.style.display = '';
}

// ── New question ──────────────────────────────────────

const HARD_THEME = { dark:'#7f0000', mid:'#c62828', light:'#ef9a9a', bg:'#ffebee', shadow:'rgba(198,40,40,.3)' };
function applyModTheme(n, l) {
  let t;
  if (n === 5 && m5Mode === 'hard') {
    t = HARD_THEME;
  } else {
    const shades = MOD_LEVEL_SHADES[n];
    const idx = Math.min(l || 1, shades.length - 1);
    t = shades[idx];
  }
  if (!t) return;
  const r = document.documentElement.style;
  r.setProperty('--mod-dark',        t.dark);
  r.setProperty('--mod-mid',         t.mid);
  r.setProperty('--mod-light',       t.light);
  r.setProperty('--mod-bg',          t.bg);
  r.setProperty('--mod-shadow',      t.shadow);
  r.setProperty('--mod-label-color', t.label || t.dark);
}

// ── Reset ─────────────────────────────────────────────
function fullReset() {
  clearTimeout(autoAdv);
  stopTimer();
  ok = 0; tot = 0; recentKeys = [];
  scoreEl.textContent = '0 / 0';
  timerEl.textContent = '0 s';
  resetBtn.disabled = true;
  newQuestion();
}

// ── Timer ─────────────────────────────────────────────
function startTimer() {
  stopTimer();
  t0 = Date.now();
  timerEl.textContent = '0 s';
  timerID = setInterval(() => {
    timerEl.textContent = Math.floor((Date.now()-t0)/1000) + ' s';
  }, 1000);
}
function stopTimer() { clearInterval(timerID); timerID = null; }

// ── Animations ────────────────────────────────────────
const animLayer = document.getElementById('animLayer');

function playOk() {
  animLayer.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'anim-ok'; el.textContent = '✓';
  animLayer.appendChild(el);
  const fl = document.createElement('div'); fl.className = 'flash-ok';
  animLayer.appendChild(fl);
  ['★','♦','●','✶'].forEach((sym, si) => {
    for (let i = 0; i < 2; i++) {
      const p = document.createElement('span'); p.className = 'particle';
      p.textContent = sym;
      const ang = (si*2+i) * Math.PI/4 + Math.random()*.4;
      const dist = 70 + Math.random()*60;
      p.style.setProperty('--tx', `translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px)`);
      p.style.animationDelay = (Math.random()*0.12)+'s';
      animLayer.appendChild(p);
    }
  });
}

function playBad() {
  animLayer.innerHTML = '';
  const x = document.createElement('div'); x.className = 'anim-x'; x.textContent = '✕';
  animLayer.appendChild(x);
  const fl = document.createElement('div'); fl.className = 'flash-bad';
  animLayer.appendChild(fl);
}
