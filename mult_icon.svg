<svg viewBox="0 0 397 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#64b5f6"/>
    </linearGradient>
  </defs>
  <rect width="397" height="280" fill="url(#bg)"/>
  <text x="200" y="195" font-size="230" fill="rgba(255,255,255,0.07)"
        text-anchor="middle" font-family="Georgia, serif" font-weight="bold">×</text>
  <line x1="198" y1="20" x2="198" y2="250" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-dasharray="6,4"/>
  <g font-family="'Courier New', monospace" font-weight="bold" fill="white" text-anchor="middle">
    <text x="100" y="55"  font-size="20" fill="rgba(255,255,255,0.7)">mnożenie</text>
    <text x="100" y="95"  font-size="24">2 × 3 = 6</text>
    <text x="100" y="135" font-size="24">6 × 7 = 42</text>
    <text x="100" y="175" font-size="24">4 × 8 = 32</text>
    <text x="100" y="215" font-size="24">9 × 5 = 45</text>
    <text x="100" y="255" font-size="24">7 × 7 = 49</text>
  </g>
  <g font-family="'Courier New', monospace" font-weight="bold" fill="white" text-anchor="middle">
    <text x="298" y="55"  font-size="20" fill="rgba(255,255,255,0.7)">mnożenie</text>
    <text x="298" y="95"  font-size="24">4 × 5 = 20</text>
    <text x="298" y="135" font-size="24">8 × 9 = 72</text>
    <text x="298" y="175" font-size="24">3 × 7 = 21</text>
    <text x="298" y="215" font-size="24">6 × 6 = 36</text>
    <text x="298" y="255" font-size="24">5 × 8 = 40</text>
  </g>
</svg>
