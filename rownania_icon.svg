<svg viewBox="0 0 397 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c0000"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFE055"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7EFFD4"/>
    </marker>
  </defs>

  <rect width="397" height="280" fill="url(#bg)"/>

  <!-- Watermark -->
  <text x="200" y="175" font-size="210" fill="rgba(255,255,255,0.05)"
        text-anchor="middle" font-family="Georgia,serif" font-weight="bold">=</text>

  <!-- TOP EQUATION: 3x + 2 = 11 (no label, no divider) -->
  <text y="50" font-family="Georgia,'Times New Roman',serif"
        font-size="28" font-weight="bold" font-style="italic">
    <tspan x="116" fill="#FFE055">3x</tspan><tspan fill="white"> + 2 = 11</tspan>
  </text>
  <!-- Underline under +2 (estimate: x≈157–203, y=64) -->
  <line x1="157" y1="64" x2="205" y2="64" stroke="#FFE055" stroke-width="4" stroke-linecap="round"/>

  <!-- Upper arrows: −2 applied to both sides -->
  <path d="M 162,75 Q 162,92 177,110"
        fill="none" stroke="#FFE055" stroke-width="2" marker-end="url(#ay)"/>
  <path d="M 234,75 Q 234,92 221,110"
        fill="none" stroke="#FFE055" stroke-width="2" marker-end="url(#ay)"/>

  <!-- −2 labels: white, larger -->
  <text x="128" y="96" font-family="Georgia,'Times New Roman',serif"
        font-size="16" font-weight="bold" font-style="italic"
        fill="white" text-anchor="middle">&#x2212;2</text>
  <text x="268" y="96" font-family="Georgia,'Times New Roman',serif"
        font-size="16" font-weight="bold" font-style="italic"
        fill="white" text-anchor="middle">&#x2212;2</text>

  <!-- Intermediate equation: 3x = 9 (coefficient 3 in mint, x in yellow) -->
  <text x="198" y="133" font-family="Georgia,'Times New Roman',serif"
        font-size="22" font-weight="bold" font-style="italic"
        fill="white" text-anchor="middle">
    <tspan fill="#7EFFD4">3</tspan><tspan fill="#FFE055">x</tspan><tspan fill="white"> = 9</tspan>
  </text>
  <!-- Underline under 3x in mint (getBBox: x=163, w=29) -->
  <line x1="161" y1="145" x2="194" y2="145" stroke="#7EFFD4" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Lower arrows: ÷3 applied to both sides -->
  <path d="M 162,147 Q 172,162 182,178"
        fill="none" stroke="#7EFFD4" stroke-width="2" marker-end="url(#am)"/>
  <path d="M 234,147 Q 224,162 214,178"
        fill="none" stroke="#7EFFD4" stroke-width="2" marker-end="url(#am)"/>

  <!-- ÷3 labels -->
  <text x="128" y="164" font-family="Georgia,'Times New Roman',serif"
        font-size="14" font-weight="bold" font-style="italic"
        fill="rgba(126,255,212,0.95)" text-anchor="middle">&#xF7;3</text>
  <text x="268" y="164" font-family="Georgia,'Times New Roman',serif"
        font-size="14" font-weight="bold" font-style="italic"
        fill="rgba(126,255,212,0.95)" text-anchor="middle">&#xF7;3</text>

  <!-- Final answer: x = 3 -->
  <text x="198" y="207" font-family="Georgia,'Times New Roman',serif"
        font-size="28" font-weight="bold" font-style="italic"
        fill="white" text-anchor="middle">
    <tspan fill="#FFE055">x</tspan><tspan> = 3</tspan>
  </text>
</svg>
