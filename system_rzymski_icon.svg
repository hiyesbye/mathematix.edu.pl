<svg viewBox="0 0 397 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1a00"/>
      <stop offset="100%" stop-color="#b07818"/>
    </linearGradient>
  </defs>

  <rect width="397" height="280" fill="url(#bg)"/>

  <!-- Watermark -->
  <text x="200" y="190" font-size="210" fill="rgba(255,255,255,0.05)"
        text-anchor="middle" font-family="Georgia,serif" font-weight="bold">M</text>

  <!-- Roman numeral symbols -->
  <text x="28"  y="50" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" font-style="italic" fill="#FFE055">I</text>
  <text x="85"  y="50" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" font-style="italic" fill="#FFE055">V</text>
  <text x="142" y="50" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" font-style="italic" fill="#FFE055">X</text>
  <text x="198" y="50" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" font-style="italic" fill="#FFE055">L</text>
  <text x="255" y="50" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" font-style="italic" fill="#FFE055">C</text>
  <text x="312" y="50" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" font-style="italic" fill="#FFE055">D</text>
  <text x="368" y="50" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="bold" font-style="italic" fill="#FFE055">M</text>

  <!-- Values below symbols -->
  <text x="28"  y="70" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="rgba(255,255,255,0.75)">1</text>
  <text x="85"  y="70" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="rgba(255,255,255,0.75)">5</text>
  <text x="142" y="70" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="rgba(255,255,255,0.75)">10</text>
  <text x="198" y="70" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="rgba(255,255,255,0.75)">50</text>
  <text x="255" y="70" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="rgba(255,255,255,0.75)">100</text>
  <text x="312" y="70" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="rgba(255,255,255,0.75)">500</text>
  <text x="368" y="70" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="rgba(255,255,255,0.75)">1000</text>

  <!-- Separator -->
  <line x1="20" y1="85" x2="377" y2="85" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- Main example: XIV = 14 -->
  <text x="198" y="155" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="44" font-weight="bold" font-style="italic">
    <tspan fill="#FFE055">XIV</tspan><tspan fill="white"> = 14</tspan>
  </text>

  <!-- Sub-examples: IV=4  IX=9  XL=40 -->
  <text x="90"  y="200" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="16" font-style="italic">
    <tspan fill="rgba(255,224,85,0.8)">IV</tspan><tspan fill="rgba(255,255,255,0.65)">=4</tspan>
  </text>
  <text x="198" y="200" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="16" font-style="italic">
    <tspan fill="rgba(255,224,85,0.8)">IX</tspan><tspan fill="rgba(255,255,255,0.65)">=9</tspan>
  </text>
  <text x="307" y="200" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="16" font-style="italic">
    <tspan fill="rgba(255,224,85,0.8)">XL</tspan><tspan fill="rgba(255,255,255,0.65)">=40</tspan>
  </text>
</svg>
