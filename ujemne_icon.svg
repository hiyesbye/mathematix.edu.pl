<svg viewBox="0 0 397 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#880e4f"/>
      <stop offset="100%" stop-color="#f48fb1"/>
    </linearGradient>
  </defs>
  <rect width="397" height="280" fill="url(#bg)"/>
  <text x="200" y="195" font-size="220" fill="rgba(255,255,255,0.07)"
        text-anchor="middle" font-family="Georgia, serif" font-weight="bold">−</text>
  <line x1="198" y1="20" x2="198" y2="250" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-dasharray="6,4"/>
  <g font-family="'Courier New', monospace" font-weight="bold" fill="white" text-anchor="middle">
    <text x="100" y="55"  font-size="20" fill="rgba(255,255,255,0.7)">+ i −</text>
    <text x="100" y="95"  font-size="24">-3 + 5 = 2</text>
    <text x="100" y="135" font-size="24">-7 + 3 = -4</text>
    <text x="100" y="175" font-size="24">-2 + (-4) = -6</text>
    <text x="100" y="215" font-size="24">4 + (-9) = -5</text>
    <text x="100" y="255" font-size="24">-1 + (-6) = -7</text>
  </g>
  <g font-family="'Courier New', monospace" font-weight="bold" fill="white" text-anchor="middle">
    <text x="298" y="55"  font-size="20" fill="rgba(255,255,255,0.7)">× i ÷</text>
    <text x="298" y="95"  font-size="24">-3 × 4 = -12</text>
    <text x="298" y="135" font-size="24">-5 × (-2) = 10</text>
    <text x="298" y="175" font-size="24">-6 ÷ 2 = -3</text>
    <text x="298" y="215" font-size="24">-8 ÷ (-4) = 2</text>
    <text x="298" y="255" font-size="24">4 × (-3) = -12</text>
  </g>
</svg>
