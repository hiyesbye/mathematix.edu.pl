  <text x="198" y="97" font-family="Georgia,'Times New Roman',serif"
        font-size="48" fill="white" text-anchor="middle" font-weight="bold">&#x2212;8 + 5 = &#x2212;3</text>

  <text x="198" y="157" font-family="'Courier New',monospace" font-size="13"
