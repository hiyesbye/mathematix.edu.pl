<svg viewBox="0 0 397 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d0030"/>
      <stop offset="100%" stop-color="#d81b60"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="outerBlur"/>
      <feFlood flood-color="#ff1a6a" flood-opacity="0.55" result="outerColor"/>
      <feComposite in="outerColor" in2="outerBlur" operator="in" result="outerGlow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="innerBlur"/>
      <feFlood flood-color="#ffaad0" flood-opacity="0.9" result="innerColor"/>
      <feComposite in="innerColor" in2="innerBlur" operator="in" result="innerGlow"/>
      <feMerge>
        <feMergeNode in="outerGlow"/>
        <feMergeNode in="innerGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="397" height="280" fill="url(#bg)"/>

  <line x1="30" y1="136" x2="367" y2="136"
        stroke="rgba(255,255,255,0.22)" stroke-width="1.5" stroke-dasharray="8,4"/>

  <text x="198" y="102" font-family="Georgia,'Times New Roman',serif"
        font-size="56" fill="white" text-anchor="middle" font-weight="bold"
        filter="url(#glow)">&#x2212;8 + 5 = &#x2212;3</text>

  <text x="198" y="200" font-family="Georgia,'Times New Roman',serif"
        font-size="38" fill="white" text-anchor="middle" font-weight="bold"
        filter="url(#glow)">(&#x2212;4) &#xD7; (&#x2212;3) = 12</text>
</svg>
