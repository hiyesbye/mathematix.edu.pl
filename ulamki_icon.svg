<svg viewBox="0 0 397 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004d40"/>
      <stop offset="100%" stop-color="#4db6ac"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="outerBlur"/>
      <feFlood flood-color="#00ffe8" flood-opacity="0.5" result="outerColor"/>
      <feComposite in="outerColor" in2="outerBlur" operator="in" result="outerGlow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="innerBlur"/>
      <feFlood flood-color="#aafff5" flood-opacity="0.85" result="innerColor"/>
      <feComposite in="innerColor" in2="innerBlur" operator="in" result="innerGlow"/>
      <feMerge>
        <feMergeNode in="outerGlow"/>
        <feMergeNode in="innerGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="397" height="280" fill="url(#bg)"/>

  <line x1="30" y1="136" x2="367" y2="136"
        stroke="rgba(255,255,255,0.22)" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- Example 1: 1⅓ + 2⅔ = 4  (y_center=78) -->
  <g filter="url(#glow)">
    <text x="92" y="91" font-family="Georgia,'Times New Roman',serif"
          font-size="38" fill="white" text-anchor="middle" font-weight="bold">1</text>
    <text x="122" y="68" font-family="Georgia,'Times New Roman',serif"
          font-size="22" fill="white" text-anchor="middle">1</text>
    <line x1="108" y1="78" x2="136" y2="78" stroke="white" stroke-width="2.5"/>
    <text x="122" y="96" font-family="Georgia,'Times New Roman',serif"
          font-size="22" fill="white" text-anchor="middle">3</text>
    <text x="161" y="91" font-family="Georgia,'Times New Roman',serif"
          font-size="38" fill="white" text-anchor="middle" font-weight="bold">+</text>
    <text x="200" y="91" font-family="Georgia,'Times New Roman',serif"
          font-size="38" fill="white" text-anchor="middle" font-weight="bold">2</text>
    <text x="230" y="68" font-family="Georgia,'Times New Roman',serif"
          font-size="22" fill="white" text-anchor="middle">2</text>
    <line x1="216" y1="78" x2="244" y2="78" stroke="white" stroke-width="2.5"/>
    <text x="230" y="96" font-family="Georgia,'Times New Roman',serif"
          font-size="22" fill="white" text-anchor="middle">3</text>
    <text x="269" y="91" font-family="Georgia,'Times New Roman',serif"
          font-size="38" fill="white" text-anchor="middle" font-weight="bold">=</text>
    <text x="308" y="91" font-family="Georgia,'Times New Roman',serif"
          font-size="38" fill="white" text-anchor="middle" font-weight="bold">4</text>
  </g>

  <!-- Example 2: ¾ × ½ = ⅜  (y_center=185) -->
  <g filter="url(#glow)">
    <text x="100" y="173" font-family="Georgia,'Times New Roman',serif"
          font-size="26" fill="white" text-anchor="middle">3</text>
    <line x1="84" y1="185" x2="116" y2="185" stroke="white" stroke-width="2.5"/>
    <text x="100" y="206" font-family="Georgia,'Times New Roman',serif"
          font-size="26" fill="white" text-anchor="middle">4</text>
    <text x="152" y="198" font-family="Georgia,'Times New Roman',serif"
          font-size="40" fill="white" text-anchor="middle" font-weight="bold">&#xD7;</text>
    <text x="200" y="173" font-family="Georgia,'Times New Roman',serif"
          font-size="26" fill="white" text-anchor="middle">1</text>
    <line x1="184" y1="185" x2="216" y2="185" stroke="white" stroke-width="2.5"/>
    <text x="200" y="206" font-family="Georgia,'Times New Roman',serif"
          font-size="26" fill="white" text-anchor="middle">2</text>
    <text x="250" y="198" font-family="Georgia,'Times New Roman',serif"
          font-size="40" fill="white" text-anchor="middle" font-weight="bold">=</text>
    <text x="304" y="173" font-family="Georgia,'Times New Roman',serif"
          font-size="26" fill="white" text-anchor="middle">3</text>
    <line x1="288" y1="185" x2="320" y2="185" stroke="white" stroke-width="2.5"/>
    <text x="304" y="206" font-family="Georgia,'Times New Roman',serif"
          font-size="26" fill="white" text-anchor="middle">8</text>
  </g>
</svg>
