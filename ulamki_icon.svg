<svg viewBox="0 0 397 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004d40"/>
      <stop offset="100%" stop-color="#4db6ac"/>
    </linearGradient>
  </defs>
  <rect width="397" height="280" fill="url(#bg)"/>

  <line x1="30" y1="136" x2="367" y2="136"
        stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- label 1 -->
  <text x="198" y="22" font-family="'Courier New',monospace" font-size="13"
        fill="rgba(255,255,255,0.55)" text-anchor="middle" font-style="italic">dodawanie ułamków mieszanych</text>

  <!-- Example 1: 1 1/3 + 2 2/3 = 4  (y_bar=75) -->
  <!-- integer "1" -->
  <text x="92" y="89" font-family="Georgia,'Times New Roman',serif"
        font-size="36" fill="white" text-anchor="middle" font-weight="bold">1</text>
  <!-- fraction 1/3 centered at x=122 -->
  <text x="122" y="66" font-family="Georgia,'Times New Roman',serif"
        font-size="20" fill="white" text-anchor="middle">1</text>
  <line x1="108" y1="75" x2="136" y2="75" stroke="white" stroke-width="2.5"/>
  <text x="122" y="95" font-family="Georgia,'Times New Roman',serif"
        font-size="20" fill="white" text-anchor="middle">3</text>
  <!-- "+" -->
  <text x="161" y="89" font-family="Georgia,'Times New Roman',serif"
        font-size="36" fill="white" text-anchor="middle" font-weight="bold">+</text>
  <!-- integer "2" -->
  <text x="200" y="89" font-family="Georgia,'Times New Roman',serif"
        font-size="36" fill="white" text-anchor="middle" font-weight="bold">2</text>
  <!-- fraction 2/3 centered at x=230 -->
  <text x="230" y="66" font-family="Georgia,'Times New Roman',serif"
        font-size="20" fill="white" text-anchor="middle">2</text>
  <line x1="216" y1="75" x2="244" y2="75" stroke="white" stroke-width="2.5"/>
  <text x="230" y="95" font-family="Georgia,'Times New Roman',serif"
        font-size="20" fill="white" text-anchor="middle">3</text>
  <!-- "=" -->
  <text x="269" y="89" font-family="Georgia,'Times New Roman',serif"
        font-size="36" fill="white" text-anchor="middle" font-weight="bold">=</text>
  <!-- result "4" -->
  <text x="308" y="89" font-family="Georgia,'Times New Roman',serif"
        font-size="36" fill="white" text-anchor="middle" font-weight="bold">4</text>

  <!-- label 2 -->
  <text x="198" y="156" font-family="'Courier New',monospace" font-size="13"
        fill="rgba(255,255,255,0.55)" text-anchor="middle" font-style="italic">mnożenie ułamków</text>

  <!-- Example 2: 3/4 × 1/2 = 3/8  (y_bar=198) -->
  <!-- fraction 3/4 centered at x=98 -->
  <text x="98" y="189" font-family="Georgia,'Times New Roman',serif"
        font-size="24" fill="white" text-anchor="middle">3</text>
  <line x1="82" y1="198" x2="114" y2="198" stroke="white" stroke-width="2.5"/>
  <text x="98" y="219" font-family="Georgia,'Times New Roman',serif"
        font-size="24" fill="white" text-anchor="middle">4</text>
  <!-- "×" -->
  <text x="152" y="211" font-family="Georgia,'Times New Roman',serif"
        font-size="38" fill="white" text-anchor="middle" font-weight="bold">&#xD7;</text>
  <!-- fraction 1/2 centered at x=200 -->
  <text x="200" y="189" font-family="Georgia,'Times New Roman',serif"
        font-size="24" fill="white" text-anchor="middle">1</text>
  <line x1="184" y1="198" x2="216" y2="198" stroke="white" stroke-width="2.5"/>
  <text x="200" y="219" font-family="Georgia,'Times New Roman',serif"
        font-size="24" fill="white" text-anchor="middle">2</text>
  <!-- "=" -->
  <text x="250" y="211" font-family="Georgia,'Times New Roman',serif"
        font-size="38" fill="white" text-anchor="middle" font-weight="bold">=</text>
  <!-- fraction 3/8 centered at x=304 -->
  <text x="304" y="189" font-family="Georgia,'Times New Roman',serif"
        font-size="24" fill="white" text-anchor="middle">3</text>
  <line x1="288" y1="198" x2="320" y2="198" stroke="white" stroke-width="2.5"/>
  <text x="304" y="219" font-family="Georgia,'Times New Roman',serif"
        font-size="24" fill="white" text-anchor="middle">8</text>
</svg>
