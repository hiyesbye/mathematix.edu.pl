<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umów poprawę</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        * { margin: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', Courier, monospace; background: #eef2f5; }

        .topbar {
            position: sticky; top: 0; z-index: 100;
            background: #1c1c1c; color: white;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; height: 52px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .topbar-left { display: flex; align-items: center; gap: 14px; }
        .topbar-title { font-size: 17px; font-weight: bold; letter-spacing: 0.5px; }
        .topbar-right { display: flex; align-items: center; gap: 14px; }
        #komunikat { font-size: 14px; min-width: 160px; text-align: right; }

        .btn-powrot {
            padding: 7px 16px; background: transparent; color: #ccc;
            border: 1px solid #555; border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px; cursor: pointer;
        }
        .btn-powrot:hover { background: #444; color: white; }
        .btn-zatwierdz {
            padding: 7px 22px; background: #2a9d3f; color: white;
            border: none; border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px; font-weight: bold; cursor: pointer; white-space: nowrap;
        }
        .btn-zatwierdz:hover { background: #1e7a30; }

        .content { max-width: 560px; margin: 24px auto; padding: 0 18px 48px; }

        .info-box {
            background: white; border: 1px solid #ddd; border-radius: 8px;
            padding: 14px 18px; margin-bottom: 22px; font-size: 14px; color: #555;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }

        .sekcja { margin-bottom: 24px; }
        .sekcja-naglowek {
            font-size: 14px; font-weight: bold; text-transform: uppercase;
            letter-spacing: 1.5px; color: white; padding: 10px 18px;
            border-radius: 6px 6px 0 0;
        }
        .sekcja-naglowek.niebieski { background: rgb(11, 105, 148); }
        .sekcja-naglowek.czerwony  { background: #b52a1e; }

        .sekcja-body {
            background: white; border: 2px solid #ddd; border-top: none;
            border-radius: 0 0 6px 6px;
        }

        .chk-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 18px; border-bottom: 1px solid #f0f0f0;
            cursor: pointer; user-select: none;
        }
        .chk-row:last-child { border-bottom: none; }
        .chk-row:hover { background: #f7f9fb; }
        .chk-left { display: flex; align-items: center; gap: 14px; }
        .chk-row input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; }
        .chk-row.niebieski input[type="checkbox"] { accent-color: rgb(11,105,148); }
        .chk-row.czerwony  input[type="checkbox"] { accent-color: #c0392b; }
        .chk-nazwa { font-size: 16px; color: #222; }

        .chk-ocena-badge {
            font-weight: bold; font-size: 14px; padding: 2px 10px;
            border-radius: 4px; border: 2px solid; background: white;
            min-width: 28px; text-align: center;
        }
        .chk-ocena-badge.niebieski { color: #0a6a96; border-color: rgb(11,105,148); }
        .chk-ocena-badge.czerwony  { color: #b52a1e; border-color: #c0392b; }

        .brak { color: #888; font-style: italic; text-align: center; padding: 40px 0; font-size: 15px; }
        #ladowanie { text-align: center; padding: 50px; color: #888; font-size: 17px; }

        @media (max-width: 480px) {
            .topbar { padding: 0 10px; gap: 8px; }
            .topbar-left { gap: 8px; }
            .topbar-title { font-size: 13px; }
            .btn-powrot { padding: 6px 10px; font-size: 12px; }
            .btn-zatwierdz { padding: 6px 12px; font-size: 12px; }
            #komunikat { min-width: 0; font-size: 12px; }
            .content { padding: 0 10px 40px; }
            .chk-nazwa { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-left">
            <button class="btn-powrot" onclick="window.opener && !window.opener.closed ? window.close() : window.location.href='profil.html'">&#8592; Powrót</button>
            <span class="topbar-title">Umów poprawę</span>
        </div>
        <div class="topbar-right">
            <span id="komunikat"></span>
            <button class="btn-zatwierdz" id="btn-zatwierdz" style="display:none;" onclick="zatwierdz()">Zatwierdź</button>
        </div>
    </div>

    <div class="content">
        <div id="ladowanie">Wczytywanie...</div>
        <div id="tresc" style="display:none;">
            <div class="info-box">Zaznacz kartkówki i prace kontrolne, które chcesz poprawić. Nauczyciel umówi z Tobą termin poprawy.</div>
            <div id="sekcje"></div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        let profilId = null;
        let poprawyObecne = {};
        const KLUCZE_POPRAWY = ['popk1','popk2','popk3','popk4','popk5','popk6','popk7','popk8','popkl1','popkl2','popkl3','popkl4'];

        function rowHtml(key, nazwa, ocena, checked, kolor) {
            return `<label class="chk-row ${kolor}" for="chk-${key}">
                <span class="chk-left">
                    <input type="checkbox" id="chk-${key}" data-key="${key}" ${checked ? 'checked' : ''}>
                    <span class="chk-nazwa">${nazwa}</span>
                </span>
                <span class="chk-ocena-badge ${kolor}">${ocena}</span>
            </label>`;
        }

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            profilId = session.user.id;

            const { data: sem1 } = await sb.from('semestr1').select('*').eq('profil_id', profilId).single();

            KLUCZE_POPRAWY.forEach(k => { poprawyObecne[k] = !!sem1?.[k]; });

            let kartRows = '';
            for (let i = 1; i <= 8; i++) {
                const ocena = sem1?.[`kartkowka_${i}`];
                if (ocena == null) continue;
                kartRows += rowHtml(`popk${i}`, `Kartkówka ${i}`, ocena, !!sem1?.[`popk${i}`], 'niebieski');
            }

            let klasRows = '';
            for (let i = 1; i <= 4; i++) {
                const ocena = sem1?.[`praca_kontrolna_${i}`];
                if (ocena == null) continue;
                klasRows += rowHtml(`popkl${i}`, `Praca kontrolna ${i}`, ocena, !!sem1?.[`popkl${i}`], 'czerwony');
            }

            document.getElementById('ladowanie').style.display = 'none';
            document.getElementById('tresc').style.display = 'block';

            if (!kartRows && !klasRows) {
                document.getElementById('sekcje').innerHTML = '<div class="brak">Nie masz jeszcze żadnych wystawionych ocen z kartkówek ani prac kontrolnych do poprawy.</div>';
                return;
            }

            let html = '';
            if (kartRows) html += `<div class="sekcja">
                <div class="sekcja-naglowek niebieski">Kartkówki</div>
                <div class="sekcja-body">${kartRows}</div>
            </div>`;
            if (klasRows) html += `<div class="sekcja">
                <div class="sekcja-naglowek czerwony">Prace kontrolne</div>
                <div class="sekcja-body">${klasRows}</div>
            </div>`;

            document.getElementById('sekcje').innerHTML = html;
            document.getElementById('btn-zatwierdz').style.display = 'inline-block';
        }

        async function zatwierdz() {
            const kom = document.getElementById('komunikat');
            kom.style.color = '#ccc';
            kom.textContent = 'Zapisywanie...';

            const wartosci = { ...poprawyObecne };
            document.querySelectorAll('input[type="checkbox"][data-key]').forEach(cb => {
                wartosci[cb.dataset.key] = cb.checked;
            });

            const params = {};
            KLUCZE_POPRAWY.forEach(k => { params[`p_${k}`] = wartosci[k]; });

            const { error } = await sb.rpc('zapisz_poprawy', params);
            if (error) {
                kom.style.color = '#ff7070';
                kom.textContent = 'Błąd: ' + error.message;
                return;
            }

            kom.style.color = '#6dcc80';
            kom.textContent = 'Zapisano ✓';
            setTimeout(() => { kom.textContent = ''; }, 3000);
        }

        init();
    </script>
</body>
</html>
