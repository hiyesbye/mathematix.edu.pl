<svg viewBox="0 0 397 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004d40"/>
      <stop offset="100%" stop-color="#00bcd4"/>
    </linearGradient>
  </defs>
  <rect width="397" height="280" fill="url(#bg)"/>

  <!-- faint watermark -->
  <text x="205" y="205" font-size="220" fill="rgba(255,255,255,0.055)"
        text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-weight="bold">x</text>

  <!-- label -->
  <text x="198" y="23" font-family="'Courier New',monospace" font-size="12"
        fill="rgba(255,255,255,0.55)" text-anchor="middle" font-style="italic">wyrażenia algebraiczne</text>

  <!-- top: like terms in two colours + underline -->
  <text x="198" y="95" font-family="Georgia,'Times New Roman',serif"
        font-size="29" text-anchor="middle" font-weight="bold" font-style="italic">
    <tspan fill="#FFE055" text-decoration="underline">3x</tspan><tspan fill="white"> + </tspan><tspan fill="#7EFFD4" text-decoration="underline">5</tspan><tspan fill="white"> + </tspan><tspan fill="#FFE055" text-decoration="underline">4x</tspan><tspan fill="white"> &#x2212; </tspan><tspan fill="#7EFFD4" text-decoration="underline">8</tspan><tspan fill="white"> = ?</tspan>
  </text>

  <!-- divider -->
  <line x1="28" y1="140" x2="369" y2="140"
        stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- bottom: one-line expansion -->
  <text x="198" y="207" font-family="'Courier New',monospace"
        font-size="17" fill="white" text-anchor="middle" font-weight="bold"
        >(2x&#x2212;3)(3a+4) = 6ax+8x&#x2212;9a&#x2212;12</text>
</svg>
